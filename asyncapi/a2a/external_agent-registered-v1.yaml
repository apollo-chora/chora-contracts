asyncapi: "3.0.0"
info:
  title: "Chora Agent-to-Agent — external_agent.registered.v1"
  version: "1.0.0"
  description: |
    Published after a successful external agent registration handshake.
    Initial trust_level is always UNTRUSTED — promotion to BASIC / VERIFIED /
    PARTNER requires platform_ops action.

    Owning team   : Team 3 (Platform)
    Owning domain : Agent-to-Agent (chora_a2a database)
    Reference     : ADR-132 §3
  contact:
    name: "Chora Platform Team — Platform Track"
  license:
    name: "Proprietary"

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  externalAgentRegistered:
    address: "chora.a2a.external_agent.registered.v1"
    messages:
      externalAgentRegistered:
        $ref: "#/components/messages/ExternalAgentRegistered"

operations:
  publishExternalAgentRegistered:
    action: send
    channel:
      $ref: "#/channels/externalAgentRegistered"
    summary: "Publish an external agent registration event"
    description: |
      Producer: chora-a2a-gateway.
      Consumers: A2A Gateway routing tables (key cache),
                 O+ partner registry,
                 Audit log,
                 Identity (cross-domain agent inventory).
    messages:
      - $ref: "#/channels/externalAgentRegistered/messages/externalAgentRegistered"

components:
  messages:
    ExternalAgentRegistered:
      name: "ExternalAgentRegistered"
      title: "External Agent Registered"
      summary: "An external agent has been registered (trust UNTRUSTED)"
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf;version=3
      payload:
        schemaFormat: "application/x-protobuf;version=3"
        schema:
          protoFile: "proto/events/a2a/external_agent.proto"
          messageName: "chora.a2a.v1.ExternalAgentRegistered"
