asyncapi: "3.0.0"
info:
  title: "Chora Agent-to-Agent — invocation.completed.v1"
  version: "1.0.0"
  description: |
    Published when an A2A invocation succeeds — owning agent produced a
    response that passed outbound guardrails. Drives billing, latency
    rollups, and partner-trust scoring.

    Owning team   : Team 3 (Platform)
    Owning domain : Agent-to-Agent (chora_a2a database)
    Reference     : ADR-132 §5
  contact:
    name: "Chora Platform Team — Platform Track"
  license:
    name: "Proprietary"

defaultContentType: application/vnd.google.protobuf

servers:
  production:
    host: "pubsub.googleapis.com"
    protocol: googlepubsub
    description: "Google Cloud Pub/Sub (production)"
  emulator:
    host: "localhost:8085"
    protocol: googlepubsub
    description: "Cloud Pub/Sub Emulator (local dev)"

channels:
  invocationCompleted:
    address: "chora.a2a.invocation.completed.v1"
    messages:
      invocationCompleted:
        $ref: "#/components/messages/InvocationCompleted"

operations:
  publishInvocationCompleted:
    action: send
    channel:
      $ref: "#/channels/invocationCompleted"
    summary: "Publish an A2A invocation completion event"
    description: |
      Producer: chora-a2a-gateway.
      Consumers: A2A billing meter (charged events),
                 O+ governance dashboard (latency / success rate),
                 Audit log,
                 partner-trust scoring service.
    messages:
      - $ref: "#/channels/invocationCompleted/messages/invocationCompleted"

components:
  messages:
    InvocationCompleted:
      name: "InvocationCompleted"
      title: "A2A Invocation Completed"
      summary: "An A2A invocation succeeded"
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf;version=3
      payload:
        schemaFormat: "application/vnd.google.protobuf;version=3"
        schema:
          protoFile: "proto/events/a2a/invocation.proto"
          messageName: "chora.a2a.v1.InvocationCompleted"
