asyncapi: 3.0.0
info:
  title: Chora AI Kernel — CrewMemberSwapped
  version: 1.0.0
  description: |
    Published when a crew member is swapped mid-run (specialist summoned,
    fallback agent replaces failing primary). Surfaces the dynamic
    specialist composition pattern.

    - Domain: AI Kernel (`chora_ai_kernel` DB)
    - Topic: `chora.ai_kernel.crew.member_swapped.v1`
    - Source proto: `proto/events/ai_kernel/crew.proto`
       message `chora.ai_kernel.v1.CrewMemberSwapped`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  crewMemberSwapped:
    address: chora.ai_kernel.crew.member_swapped.v1
    messages:
      crewMemberSwapped:
        $ref: '#/components/messages/CrewMemberSwapped'

operations:
  publishCrewMemberSwapped:
    action: send
    channel:
      $ref: '#/channels/crewMemberSwapped'
    messages:
      - $ref: '#/channels/crewMemberSwapped/messages/crewMemberSwapped'

  consumeCrewMemberSwapped:
    action: receive
    channel:
      $ref: '#/channels/crewMemberSwapped'
    description: |
      Consumers: Observability (specialist invocation KPI),
      O+ crew composition timeline, Audit log.
    messages:
      - $ref: '#/channels/crewMemberSwapped/messages/crewMemberSwapped'

components:
  messages:
    CrewMemberSwapped:
      name: CrewMemberSwapped
      title: Crew Member Swapped
      summary: A crew member has been swapped mid-run
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/ai_kernel/crew.proto#/chora.ai_kernel.v1.CrewMemberSwapped'
