asyncapi: 3.0.0
info:
  title: Chora AI Kernel — LoraAdapterDeployed
  version: 1.0.0
  description: |
    Published when an adapter is deployed to one of the 3 targets
    (Vertex Endpoint / Cloud Run + GPU / Autopilot GPU). Multiple
    deployments per adapter are valid.

    - Domain: AI Kernel (`chora_ai_kernel` DB)
    - Topic: `chora.ai_kernel.lora.adapter_deployed.v1`
    - Source proto: `proto/events/ai_kernel/lora.proto`
       message `chora.ai_kernel.v1.LoraAdapterDeployed`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  loraAdapterDeployed:
    address: chora.ai_kernel.lora.adapter_deployed.v1
    messages:
      loraAdapterDeployed:
        $ref: '#/components/messages/LoraAdapterDeployed'

operations:
  publishLoraAdapterDeployed:
    action: send
    channel:
      $ref: '#/channels/loraAdapterDeployed'
    messages:
      - $ref: '#/channels/loraAdapterDeployed/messages/loraAdapterDeployed'

  consumeLoraAdapterDeployed:
    action: receive
    channel:
      $ref: '#/channels/loraAdapterDeployed'
    description: |
      Consumers: Model Gateway (route refresh), O+ ModelOps view,
      Notifications.
    messages:
      - $ref: '#/channels/loraAdapterDeployed/messages/loraAdapterDeployed'

components:
  messages:
    LoraAdapterDeployed:
      name: LoraAdapterDeployed
      title: LoRA Adapter Deployed
      summary: A LoRA adapter has been deployed to a target
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/ai_kernel/lora.proto#/chora.ai_kernel.v1.LoraAdapterDeployed'
