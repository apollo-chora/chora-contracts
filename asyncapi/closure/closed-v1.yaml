asyncapi: 3.0.0
info:
  title: Chora Closure — Closed
  version: 1.0.0
  description: |
    Terminal saga event — emitted immediately after CryptoShredComplete with
    a full transition history snapshot for audit replay.

    - Domain: AI Kernel — Closure Orchestrator (`chora_ai_kernel` DB)
    - Topic: `chora.closure.closed.v1`
    - Source proto: `proto/events/closure/saga.proto`
       message `chora.closure.v1.ClosureClosed`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  closureClosed:
    address: chora.closure.closed.v1
    messages:
      closureClosed:
        $ref: '#/components/messages/ClosureClosed'

operations:
  publishClosureClosed:
    action: send
    channel:
      $ref: '#/channels/closureClosed'
    messages:
      - $ref: '#/channels/closureClosed/messages/closureClosed'

  consumeClosureClosed:
    action: receive
    channel:
      $ref: '#/channels/closureClosed'
    description: |
      Consumers:
        - chora-governance (final audit log entry, hash-chain anchor)
        - chora-observability (close-rate KPIs)
    messages:
      - $ref: '#/channels/closureClosed/messages/closureClosed'

components:
  messages:
    ClosureClosed:
      name: ClosureClosed
      title: Saga terminated; transition history attached
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/closure/saga.proto#/chora.closure.v1.ClosureClosed'
