asyncapi: 3.0.0
info:
  title: Chora Closure — PseudonymisePerDomainComplete
  version: 1.0.0
  description: |
    All participating domains have acked their per-domain pseudonymisation.
    Marks the saga's SUSPENDED -> PSEUDONYMIZED transition.

    Distinct from each per-domain `chora.{domain}.account.pseudonymised.v1`
    ack — this is the AGGREGATED completion signal that downstream
    cold-archive workers wait on.

    - Domain: AI Kernel — Closure Orchestrator (`chora_ai_kernel` DB)
    - Topic: `chora.closure.pseudonymise_per_domain_complete.v1`
    - Source proto: `proto/events/closure/saga.proto`
       message `chora.closure.v1.ClosurePseudonymisePerDomainComplete`
    - IMDA: tag envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  closurePseudonymisePerDomainComplete:
    address: chora.closure.pseudonymise_per_domain_complete.v1
    messages:
      closurePseudonymisePerDomainComplete:
        $ref: '#/components/messages/ClosurePseudonymisePerDomainComplete'

operations:
  publishClosurePseudonymisePerDomainComplete:
    action: send
    channel:
      $ref: '#/channels/closurePseudonymisePerDomainComplete'
    messages:
      - $ref: '#/channels/closurePseudonymisePerDomainComplete/messages/closurePseudonymisePerDomainComplete'

  consumeClosurePseudonymisePerDomainComplete:
    action: receive
    channel:
      $ref: '#/channels/closurePseudonymisePerDomainComplete'
    description: |
      Consumers:
        - chora-closure-orchestrator (advance saga to COLD_ARCHIVED)
        - chora-observability (O+ closure-pipeline depth dashboard)
        - chora-governance (audit log entry — append-only ledger)
    messages:
      - $ref: '#/channels/closurePseudonymisePerDomainComplete/messages/closurePseudonymisePerDomainComplete'

components:
  messages:
    ClosurePseudonymisePerDomainComplete:
      name: ClosurePseudonymisePerDomainComplete
      title: All domains acked pseudonymisation
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/closure/saga.proto#/chora.closure.v1.ClosurePseudonymisePerDomainComplete'
