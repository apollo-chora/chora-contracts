asyncapi: 3.0.0
info:
  title: Chora Closure — Requested
  version: 1.0.0
  description: |
    Federated closure saga INITIATED — ACTIVE -> CLOSING transition.

    Replaces the deprecated `chora.closure_orchestrator.saga.initiated.v1`
    topic per `docs/m13/contracts-reconciliation-2026-05-09.md` §1.

    - Domain: AI Kernel — Closure Orchestrator (`chora_ai_kernel` DB)
    - Topic: `chora.closure.requested.v1`
    - Source proto: `proto/events/closure/saga.proto`
       message `chora.closure.v1.ClosureRequested`
    - IMDA: tag envelope.chora_imda_dimension = "accountability" (D1 audit chain)
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  closureRequested:
    address: chora.closure.requested.v1
    messages:
      closureRequested:
        $ref: '#/components/messages/ClosureRequested'

operations:
  publishClosureRequested:
    action: send
    channel:
      $ref: '#/channels/closureRequested'
    messages:
      - $ref: '#/channels/closureRequested/messages/closureRequested'

  consumeClosureRequested:
    action: receive
    channel:
      $ref: '#/channels/closureRequested'
    description: |
      Consumers:
        - chora-notifications (grace-period start email)
        - chora-identity (mirror saga state on closure.Saga aggregate)
        - chora-observability (O+ closure-pipeline projection)
        - all 10 domain pseudonymise subscribers (await PSEUDONYMIZED)
    messages:
      - $ref: '#/channels/closureRequested/messages/closureRequested'

components:
  messages:
    ClosureRequested:
      name: ClosureRequested
      title: Federated closure saga initiated
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/closure/saga.proto#/chora.closure.v1.ClosureRequested'
