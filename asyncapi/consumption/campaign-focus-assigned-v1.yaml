asyncapi: 3.0.0
info:
  title: Chora Content Consumption — CampaignFocusAssigned
  version: 1.0.0
  description: |
    Published when the learner assigns (or moves) a goal's single campaign
    focus node — `Goal.FocusConceptID` (ADR-227 D11). The Companion only
    proposes the next frontier node; the learner assigns (Learner-Ownership).
    Setting focus also retargets the bound Companion's resonant concept
    (ADR-227 Verification addendum #5) — one affordance, so no separate
    resonance event exists.

    - Domain: Content Consumption (`chora_consumption` DB)
    - Aggregate root: `campaign_node_progress` / `goal` (ADR-227 D16)
    - Topic: `chora.consumption.campaign.focus_assigned.v1`
    - Schema format: Protobuf binary, validated by Pub/Sub Schema Registry
    - Source proto: `proto/events/consumption/campaign.proto`
       message `chora.consumption.v1.CampaignFocusAssigned`

    Carries `goal_id` (BINDING, addendum #6) for per-goal Companion
    attribution. Idempotent via envelope idempotency_key =
    goal_id:concept_id:assigned_at. Embeds the mandatory
    `chora.common.v1.EventEnvelope` as field 1.
  contact:
    name: Team 1 (Content) + Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  campaignFocusAssigned:
    address: chora.consumption.campaign.focus_assigned.v1
    description: Single-event topic for CampaignFocusAssigned.
    messages:
      campaignFocusAssigned:
        $ref: '#/components/messages/CampaignFocusAssigned'

operations:
  publishCampaignFocusAssigned:
    action: send
    channel:
      $ref: '#/channels/campaignFocusAssigned'
    summary: Publish a CampaignFocusAssigned event
    description: |
      Emitted by chora-consumption (WS-C1 focus service) via the
      transactional outbox in the same tx that persists
      goals.focus_concept_id.
    messages:
      - $ref: '#/channels/campaignFocusAssigned/messages/campaignFocusAssigned'

  consumeCampaignFocusAssigned:
    action: receive
    channel:
      $ref: '#/channels/campaignFocusAssigned'
    summary: Subscribe to CampaignFocusAssigned events
    description: |
      Primary consumers (loosely-coupled, attach later):
      - Consumption — reconcile companion_instances.resonant_concept_id
      - Observability — IMDA D2 assignment disclosure
    messages:
      - $ref: '#/channels/campaignFocusAssigned/messages/campaignFocusAssigned'

components:
  messages:
    CampaignFocusAssigned:
      name: CampaignFocusAssigned
      title: Campaign focus assigned (goal's march target)
      summary: The learner pointed the goal's campaign at a concept node
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/consumption/campaign.proto#/chora.consumption.v1.CampaignFocusAssigned'
