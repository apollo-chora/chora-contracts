asyncapi: 3.0.0
info:
  title: Chora Content Consumption — CampaignGoalSealed
  version: 1.0.0
  description: |
    Published when the learner SEALS a goal's campaign (ADR-227 D3): a
    sovereign declaration allowed only while the frontier is system-verified
    empty (every claimed node won). The same tx sets
    goals.personal_completed_at (ADR-213 personal axis — never the
    credentialed axis). Tier-S XP rides this event BECAUSE of the verified
    frontier-clear — a bare learner declaration alone never awards XP (D10).
    Claiming new fog re-opens the campaign; a re-seal after genuine
    expansion (≥ N newly-won nodes, tunable) sets `is_reseal=true`
    (weekly-capped re-award).

    - Domain: Content Consumption (`chora_consumption` DB)
    - Aggregate root: `campaign_node_progress` / `goal` (ADR-227 D16)
    - Topic: `chora.consumption.campaign.goal_sealed.v1`
    - Schema format: Protobuf binary, validated by Pub/Sub Schema Registry
    - Source proto: `proto/events/consumption/campaign.proto`
       message `chora.consumption.v1.CampaignGoalSealed`

    Carries `goal_id` (BINDING, addendum #6) for ResolveForGoal XP routing.
    Idempotent via envelope idempotency_key = goal_id:sealed_at. Embeds the
    mandatory `chora.common.v1.EventEnvelope` as field 1.
  contact:
    name: Team 1 (Content) + Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  campaignGoalSealed:
    address: chora.consumption.campaign.goal_sealed.v1
    description: Single-event topic for CampaignGoalSealed.
    messages:
      campaignGoalSealed:
        $ref: '#/components/messages/CampaignGoalSealed'

operations:
  publishCampaignGoalSealed:
    action: send
    channel:
      $ref: '#/channels/campaignGoalSealed'
    summary: Publish a CampaignGoalSealed event
    description: |
      Emitted by chora-consumption (WS-C1 seal service) via the
      transactional outbox in the same tx that stamps
      goals.personal_completed_at — only after verifying the frontier is
      empty (no self-declared seal ever emits).
    messages:
      - $ref: '#/channels/campaignGoalSealed/messages/campaignGoalSealed'

  consumeCampaignGoalSealed:
    action: receive
    channel:
      $ref: '#/channels/campaignGoalSealed'
    summary: Subscribe to CampaignGoalSealed events
    description: |
      Primary consumers (loosely-coupled, attach later):
      - Identity — tier-S XP, ~1/week cap (ExpRuleResolver row, WS-C5)
      - Observability — IMDA D1 evidence (seal gated on frontier-clear)
    messages:
      - $ref: '#/channels/campaignGoalSealed/messages/campaignGoalSealed'

components:
  messages:
    CampaignGoalSealed:
      name: CampaignGoalSealed
      title: Campaign goal sealed (sovereign completion on verified clear)
      summary: The learner sealed a goal whose frontier is verifiably empty
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/consumption/campaign.proto#/chora.consumption.v1.CampaignGoalSealed'
