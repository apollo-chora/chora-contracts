asyncapi: 3.0.0
info:
  title: Chora Content Consumption — CampaignRungCleared
  version: 1.0.0
  description: |
    Published when server-graded work clears a rung of a campaign node's
    6-level Bloom ladder (ADR-227 D6) — either a first clear that advances
    the ladder (at most one per calendar day per node, D7) or a defence /
    refresher re-clear at an already-cleared rung (D8; `is_refresher=true`,
    reduced XP per the D10 table). Cleared rungs are never lost — no
    negative counterpart event exists.

    - Domain: Content Consumption (`chora_consumption` DB)
    - Aggregate root: `campaign_node_progress` (ADR-227 D16)
    - Topic: `chora.consumption.campaign.rung_cleared.v1`
    - Schema format: Protobuf binary, validated by Pub/Sub Schema Registry
    - Source proto: `proto/events/consumption/campaign.proto`
       message `chora.consumption.v1.CampaignRungCleared`

    Carries `goal_id` (BINDING, addendum #6) so chora-identity routes XP via
    ResolveForGoal. The `rung` enum uses ladder positions in D6 order with
    original-Bloom vocabulary (evaluation=5, synthesis=6 — deliberately NOT
    the creation CognitiveLevel numbering). Idempotent via envelope
    idempotency_key = goal_id:concept_id:rung:cleared_at. Embeds the
    mandatory `chora.common.v1.EventEnvelope` as field 1.
  contact:
    name: Team 1 (Content) + Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  campaignRungCleared:
    address: chora.consumption.campaign.rung_cleared.v1
    description: Single-event topic for CampaignRungCleared.
    messages:
      campaignRungCleared:
        $ref: '#/components/messages/CampaignRungCleared'

operations:
  publishCampaignRungCleared:
    action: send
    channel:
      $ref: '#/channels/campaignRungCleared'
    summary: Publish a CampaignRungCleared event
    description: |
      Emitted by chora-consumption (WS-C1 ladder service) via the
      transactional outbox in the same tx that advances rungs_cleared /
      stamps the refresher — always downstream of server grading, never a
      client claim (D10; ADR-203 L16).
    messages:
      - $ref: '#/channels/campaignRungCleared/messages/campaignRungCleared'

  consumeCampaignRungCleared:
    action: receive
    channel:
      $ref: '#/channels/campaignRungCleared'
    summary: Subscribe to CampaignRungCleared events
    description: |
      Primary consumers (loosely-coupled, attach later):
      - Identity — small flat XP, daily-capped (ExpRuleResolver row, WS-C5)
      - Observability — IMDA D1 verified-work evidence
    messages:
      - $ref: '#/channels/campaignRungCleared/messages/campaignRungCleared'

components:
  messages:
    CampaignRungCleared:
      name: CampaignRungCleared
      title: Campaign rung cleared (ladder step verified)
      summary: Server-graded work cleared one rung of a campaign node
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/consumption/campaign.proto#/chora.consumption.v1.CampaignRungCleared'
