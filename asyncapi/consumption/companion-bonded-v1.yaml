asyncapi: 3.0.0
info:
  title: Chora Content Consumption — CompanionBonded
  version: 1.0.0
  description: |
    Published when a learner first bonds with a Companion (RPG companion).

    - Domain: Content Consumption (`chora_consumption` DB)
    - Aggregate root: `Companion` (DOMAIN ENTITY — not an AI agent)
    - Topic: `chora.consumption.companion.bonded.v1`
    - Schema format: Protobuf binary, validated by Pub/Sub Schema Registry
    - Source proto: `proto/events/consumption/companion.proto`
       message `chora.consumption.v1.CompanionBonded`

    **CRITICAL** — `Companion` here refers to the in-game RPG companion as a
    domain entity (pure game mechanics: species, level, bonded_at). The AI
    agent that powers Companion responses is a SEPARATE adapter concern in
    AI Kernel; its lifecycle events live under `chora.ai_kernel.*`.

    Embeds the mandatory `chora.common.v1.EventEnvelope` as field 1.
  contact:
    name: Chora Platform Team (Team 3) + Team 1 (Content)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub
    description: Google Cloud Pub/Sub (chora-489812 platform host)

channels:
  companionBonded:
    address: chora.consumption.companion.bonded.v1
    description: Single-event topic for CompanionBonded.
    messages:
      companionBonded:
        $ref: '#/components/messages/CompanionBonded'

operations:
  publishCompanionBonded:
    action: send
    channel:
      $ref: '#/channels/companionBonded'
    summary: Publish a CompanionBonded event
    messages:
      - $ref: '#/channels/companionBonded/messages/companionBonded'

  consumeCompanionBonded:
    action: receive
    channel:
      $ref: '#/channels/companionBonded'
    summary: Subscribe to CompanionBonded events
    description: |
      Primary consumers:
      - Sharing — onboarding social broadcast (welcome to the Companion)
      - Notifications — first-bond welcome message
    messages:
      - $ref: '#/channels/companionBonded/messages/companionBonded'

components:
  messages:
    CompanionBonded:
      name: CompanionBonded
      title: Companion Bonded
      summary: A learner bonded with a Companion (RPG companion entity)
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/consumption/companion.proto#/chora.consumption.v1.CompanionBonded'
