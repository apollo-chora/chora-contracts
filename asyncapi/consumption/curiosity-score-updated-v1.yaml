asyncapi: 3.0.0
info:
  title: Chora Content Consumption — CuriosityScoreUpdated
  version: 1.0.0
  description: |
    Published when a learner's per-node curiosity score is updated
    (decay or reinforcement). Anchors the Curiosity-Reward-Social engagement
    loop primitive.

    - Domain: Content Consumption (`chora_consumption` DB)
    - Aggregate root: `KnowledgeGraphNode`
    - Topic: `chora.consumption.knowledge_graph.curiosity_score_updated.v1`
    - Schema format: Protobuf binary, validated by Pub/Sub Schema Registry
    - Source proto: `proto/events/consumption/knowledge_graph.proto`
       message `chora.consumption.v1.CuriosityScoreUpdated`

    Embeds the mandatory `chora.common.v1.EventEnvelope` as field 1.
  contact:
    name: Chora Platform Team (Team 3) + Team 1 (Content)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub
    description: Google Cloud Pub/Sub (chora-489812 platform host)

channels:
  curiosityScoreUpdated:
    address: chora.consumption.knowledge_graph.curiosity_score_updated.v1
    description: Single-event topic for CuriosityScoreUpdated.
    messages:
      curiosityScoreUpdated:
        $ref: '#/components/messages/CuriosityScoreUpdated'

operations:
  publishCuriosityScoreUpdated:
    action: send
    channel:
      $ref: '#/channels/curiosityScoreUpdated'
    summary: Publish a CuriosityScoreUpdated event
    messages:
      - $ref: '#/channels/curiosityScoreUpdated/messages/curiosityScoreUpdated'

  consumeCuriosityScoreUpdated:
    action: receive
    channel:
      $ref: '#/channels/curiosityScoreUpdated'
    summary: Subscribe to CuriosityScoreUpdated events
    description: |
      Primary consumers:
      - Sharing — reputation + leaderboards
      - Notifications — re-engagement nudges based on lapsed curiosity
      - AI Kernel — Recommender weighting
    messages:
      - $ref: '#/channels/curiosityScoreUpdated/messages/curiosityScoreUpdated'

components:
  messages:
    CuriosityScoreUpdated:
      name: CuriosityScoreUpdated
      title: Curiosity Score Updated
      summary: A learner's curiosity score for a KnowledgeGraph node was updated
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/consumption/knowledge_graph.proto#/chora.consumption.v1.CuriosityScoreUpdated'
