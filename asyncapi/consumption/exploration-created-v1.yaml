asyncapi: 3.0.0
info:
  title: Chora Content Consumption — ExplorationCreated
  version: 1.0.0
  description: |
    Published when a new exploration starts within a cluster (per ADR-143).

    Cluster creation implicitly emits this for the initial exploration.
    Subsequent explorations within the same cluster appear after a merge
    (the merged-cluster's pre-merge explorations remain valid; new ones
    can be created via `CreateExploration`).

    - Domain: Content Consumption (`chora_consumption` DB)
    - Aggregate root: `Exploration` (kg_user_explorations table)
    - Topic: `chora.consumption.kg_exploration.created.v1`
    - Schema format: Protobuf binary, validated by Pub/Sub Schema Registry
    - Source proto: `proto/events/consumption/knowledge_graph.proto`
       message `chora.consumption.v1.ExplorationCreated`

    Embeds the mandatory `chora.common.v1.EventEnvelope` as field 1.
  contact:
    name: Chora Content Team (Team 1)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub
    description: Google Cloud Pub/Sub (chora-489812 platform host)

channels:
  explorationCreated:
    address: chora.consumption.kg_exploration.created.v1
    description: Single-event topic for ExplorationCreated.
    messages:
      explorationCreated:
        $ref: '#/components/messages/ExplorationCreated'

operations:
  publishExplorationCreated:
    action: send
    channel:
      $ref: '#/channels/explorationCreated'
    summary: Publish an ExplorationCreated event

  consumeExplorationCreated:
    action: receive
    channel:
      $ref: '#/channels/explorationCreated'
    summary: Subscribe to ExplorationCreated events
    description: |
      Primary consumers:
      - Observability — engagement analytics

components:
  messages:
    ExplorationCreated:
      name: ExplorationCreated
      title: Exploration Created
      summary: A new exploration started within a knowledge map cluster
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/consumption/knowledge_graph.proto#/chora.consumption.v1.ExplorationCreated'
