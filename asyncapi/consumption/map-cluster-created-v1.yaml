asyncapi: 3.0.0
info:
  title: Chora Content Consumption — MapClusterCreated
  version: 1.0.0
  description: |
    Published when a learner creates a new knowledge map cluster (per ADR-143).
    A MapCluster is the disconnected map abstraction the Join action merges.

    - Domain: Content Consumption (`chora_consumption` DB)
    - Aggregate root: `MapCluster` (kg_user_map_clusters table)
    - Topic: `chora.consumption.kg_map_cluster.created.v1`
    - Schema format: Protobuf binary, validated by Pub/Sub Schema Registry
    - Source proto: `proto/events/consumption/knowledge_graph.proto`
       message `chora.consumption.v1.MapClusterCreated`

    Co-emitted with `ExplorationCreated` (every fresh cluster creates an
    initial exploration).

    Embeds the mandatory `chora.common.v1.EventEnvelope` as field 1.
  contact:
    name: Chora Content Team (Team 1) + Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  mapClusterCreated:
    address: chora.consumption.kg_map_cluster.created.v1
    description: Single-event topic for MapClusterCreated.
    messages:
      mapClusterCreated:
        $ref: '#/components/messages/MapClusterCreated'

operations:
  publishMapClusterCreated:
    action: send
    channel:
      $ref: '#/channels/mapClusterCreated'
    summary: Publish a MapClusterCreated event
    messages:
      - $ref: '#/channels/mapClusterCreated/messages/mapClusterCreated'

  consumeMapClusterCreated:
    action: receive
    channel:
      $ref: '#/channels/mapClusterCreated'
    summary: Subscribe to MapClusterCreated events
    description: |
      Primary consumers:
      - Sharing — curiosity reputation seed
      - Observability — engagement analytics
    messages:
      - $ref: '#/channels/mapClusterCreated/messages/mapClusterCreated'

components:
  messages:
    MapClusterCreated:
      name: MapClusterCreated
      title: Map Cluster Created
      summary: A learner created a new knowledge map cluster
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/consumption/knowledge_graph.proto#/chora.consumption.v1.MapClusterCreated'
