asyncapi: 3.0.0
info:
  title: Chora Content Consumption — PathAbandoned
  version: 1.0.0
  description: |
    Published when a learner explicitly abandons or times out of a `LearningPath`.

    - Domain: Content Consumption (`chora_consumption` DB)
    - Aggregate root: `LearningPath`
    - Topic: `chora.consumption.path.abandoned.v1`
    - Schema format: Protobuf binary, validated by Pub/Sub Schema Registry
    - Source proto: `proto/events/consumption/learning_path.proto`
       message `chora.consumption.v1.PathAbandoned`

    Embeds the mandatory `chora.common.v1.EventEnvelope` as field 1.
  contact:
    name: Chora Platform Team (Team 3) + Team 1 (Content)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub
    description: Google Cloud Pub/Sub (chora-489812 platform host)

channels:
  pathAbandoned:
    address: chora.consumption.path.abandoned.v1
    description: Single-event topic for PathAbandoned.
    messages:
      pathAbandoned:
        $ref: '#/components/messages/PathAbandoned'

operations:
  publishPathAbandoned:
    action: send
    channel:
      $ref: '#/channels/pathAbandoned'
    summary: Publish a PathAbandoned event
    messages:
      - $ref: '#/channels/pathAbandoned/messages/pathAbandoned'

  consumePathAbandoned:
    action: receive
    channel:
      $ref: '#/channels/pathAbandoned'
    summary: Subscribe to PathAbandoned events
    description: |
      Primary consumers:
      - Notifications — re-engagement nudges (Ebbinghaus-aware reminder)
      - Observability — drop-off / churn metrics
    messages:
      - $ref: '#/channels/pathAbandoned/messages/pathAbandoned'

components:
  messages:
    PathAbandoned:
      name: PathAbandoned
      title: Path Abandoned
      summary: A learner abandoned a LearningPath
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/consumption/learning_path.proto#/chora.consumption.v1.PathAbandoned'
