asyncapi: 3.0.0
info:
  title: Chora Content Consumption — SessionAbandoned
  version: 1.0.0
  description: |
    Published when a learner abandons an `AtomicSession` without completing.

    - Domain: Content Consumption (`chora_consumption` DB)
    - Aggregate root: `AtomicSession`
    - Topic: `chora.consumption.session.abandoned.v1`
    - Schema format: Protobuf binary, validated by Pub/Sub Schema Registry
    - Source proto: `proto/events/consumption/session.proto`
       message `chora.consumption.v1.SessionAbandoned`

    Embeds the mandatory `chora.common.v1.EventEnvelope` as field 1.
  contact:
    name: Chora Platform Team (Team 3) + Team 1 (Content)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub
    description: Google Cloud Pub/Sub (chora-489812 platform host)

channels:
  sessionAbandoned:
    address: chora.consumption.session.abandoned.v1
    description: Single-event topic for SessionAbandoned.
    messages:
      sessionAbandoned:
        $ref: '#/components/messages/SessionAbandoned'

operations:
  publishSessionAbandoned:
    action: send
    channel:
      $ref: '#/channels/sessionAbandoned'
    summary: Publish a SessionAbandoned event
    messages:
      - $ref: '#/channels/sessionAbandoned/messages/sessionAbandoned'

  consumeSessionAbandoned:
    action: receive
    channel:
      $ref: '#/channels/sessionAbandoned'
    summary: Subscribe to SessionAbandoned events
    description: |
      Primary consumers:
      - Notifications — re-engagement nudges
      - Observability — drop-off + abandonment-rate analytics
    messages:
      - $ref: '#/channels/sessionAbandoned/messages/sessionAbandoned'

components:
  messages:
    SessionAbandoned:
      name: SessionAbandoned
      title: Session Abandoned
      summary: A learner abandoned an AtomicSession before completion
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/consumption/session.proto#/chora.consumption.v1.SessionAbandoned'
