asyncapi: "3.0.0"
info:
  title: "Chora Content Creation — atom.archived.v1"
  version: "1.0.0"
  description: |
    Published when an atom is soft-deleted (status = ARCHIVED, deleted_at
    set). Per ddd-enforcement aggregate invariant #5 this is NEVER a hard
    delete — preserves audit + revision history.

    Consumers MUST remove the atom from active learner-facing queries
    (default `WHERE deleted_at IS NULL` filter) but RETAIN history records.

    Owning team    : Team 1 (Content)
    Owning domain  : Content Creation (chora_creation database)

    Source-of-truth: docs/architecture-review-inputs-2026-05-07.md Tier 2 D8
    + .claude/rules/ddd-enforcement.md
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  atomArchived:
    address: "chora.creation.atom.archived.v1"
    description: |
      Pub/Sub topic for AtomArchived events.
    messages:
      atomArchived:
        $ref: "#/components/messages/AtomArchived"

operations:
  publishAtomArchived:
    action: send
    channel:
      $ref: "#/channels/atomArchived"
    summary: "Publish an atom soft-delete (archive) event"
    description: |
      Producer: chora-creation service.
      Consumers:
        - chora-consumption  -> remove from active learner queries
        - chora-sharing      -> remove from duel pool, archive in feeds
        - chora-delivery     -> notify Course/Booking owners
        - Meilisearch        -> remove from active index
        - audit log
    messages:
      - $ref: "#/channels/atomArchived/messages/atomArchived"

components:
  messages:
    AtomArchived:
      name: "AtomArchived"
      title: "Atom Archived"
      summary: "A LearningAtom has been soft-deleted (archived)"
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf;version=3
      payload:
        schemaFormat: "application/x-protobuf;version=3"
        schema:
          protoFile: "proto/events/creation/atom.proto"
          messageName: "chora.creation.v1.AtomArchived"
