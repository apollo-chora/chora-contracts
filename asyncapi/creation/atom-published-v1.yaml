asyncapi: "3.0.0"
info:
  title: "Chora Content Creation — atom.published.v1"
  version: "1.0.0"
  description: |
    Published when an atom transitions DRAFT -> PUBLISHED. Marks the atom
    available to learners (Consumption domain) and to collection
    aggregates (LearningPath in Consumption, Course/Booking in Delivery).

    Publish requires at least one published AtomRevision; consumers should
    pin against the `current_revision_id` carried in the payload for
    version-stable reads.

    Owning team    : Team 1 (Content)
    Owning domain  : Content Creation (chora_creation database)

    Source-of-truth: docs/architecture-review-inputs-2026-05-07.md Tier 2 D8
    + .claude/rules/ddd-enforcement.md (Aggregate Invariant #1: collections
    QUERY atoms; they NEVER own them)
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  atomPublished:
    address: "chora.creation.atom.published.v1"
    description: |
      Pub/Sub topic for AtomPublished events. High-fanout — most domains
      subscribe.
    messages:
      atomPublished:
        $ref: "#/components/messages/AtomPublished"

operations:
  publishAtomPublished:
    action: send
    channel:
      $ref: "#/channels/atomPublished"
    summary: "Publish an atom DRAFT -> PUBLISHED transition event"
    description: |
      Producer: chora-creation service.
      Consumers:
        - chora-consumption  -> KG materialisation, learner discovery feed
        - chora-sharing      -> mark atom as duel-eligible (after PvP screen)
        - chora-delivery     -> notify Course/Booking owners that the atom
                                is now live
        - AI Kernel          -> classifier / difficulty-scorer agents
        - Meilisearch        -> publish-tier index push
        - audit log
    messages:
      - $ref: "#/channels/atomPublished/messages/atomPublished"

components:
  messages:
    AtomPublished:
      name: "AtomPublished"
      title: "Atom Published"
      summary: "A LearningAtom has transitioned DRAFT -> PUBLISHED"
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf;version=3
      payload:
        schemaFormat: "application/x-protobuf;version=3"
        schema:
          protoFile: "proto/events/creation/atom.proto"
          messageName: "chora.creation.v1.AtomPublished"
