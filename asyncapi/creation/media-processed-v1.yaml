asyncapi: "3.0.0"
info:
  title: "Chora Content Creation — media.processed.v1"
  version: "1.0.0"
  description: |
    Published when the full media-processing pipeline reaches
    MEDIA_PROCESSING_STATUS_READY. The asset is safe to serve.

    The published `gcs_uri` points to the canonical processed asset.
    Variants (image responsive sizes, video HLS renditions) are addressed
    via Media query APIs — emitting all variant URIs in the event would
    bloat the payload.

    Owning team    : Team 1 (Content)
    Owning domain  : Content Creation (chora_creation database)

    Source-of-truth: docs/architecture-review-inputs-2026-05-07.md Tier 2 D8
    + ADR-134 (legacy media-processor pipeline; topic taxonomy migrated).
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/vnd.google.protobuf

servers:
  production:
    host: "pubsub.googleapis.com"
    protocol: googlepubsub
    description: "Google Cloud Pub/Sub (production)"
  emulator:
    host: "localhost:8085"
    protocol: googlepubsub
    description: "Cloud Pub/Sub Emulator (local dev)"

channels:
  mediaProcessed:
    address: "chora.creation.media.processed.v1"
    description: |
      Pub/Sub topic for MediaProcessed events.
    messages:
      mediaProcessed:
        $ref: "#/components/messages/MediaProcessed"

operations:
  publishMediaProcessed:
    action: send
    channel:
      $ref: "#/channels/mediaProcessed"
    summary: "Publish a media-processing READY event"
    description: |
      Producer: media-processor Cloud Run Job.
      Consumers:
        - chora-creation     -> mark Media as READY in chora_creation DB
        - chora-consumption  -> warm CDN cache for atom-bound assets
        - audit log
    messages:
      - $ref: "#/channels/mediaProcessed/messages/mediaProcessed"

components:
  messages:
    MediaProcessed:
      name: "MediaProcessed"
      title: "Media Processed"
      summary: "Media-processing pipeline completed — asset ready to serve"
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf;version=3
      payload:
        schemaFormat: "application/vnd.google.protobuf;version=3"
        schema:
          protoFile: "proto/events/creation/media.proto"
          messageName: "chora.creation.v1.MediaProcessed"
