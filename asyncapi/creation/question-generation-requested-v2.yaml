asyncapi: "3.0.0"
info:
  title: "Chora Content Creation — question.generation_requested.v2"
  version: "1.0.0"
  description: |
    Published by the chora-creation outbox when a compose job row transitions
    REQUESTED -> published-to-outbox. The .v2 (ADR-195 WS7 / D7) REPLACES the
    retired `job_type` (QuestionGenerationJobType) discriminant with the unified
    compose model carried explicitly as three new fields:

      - operation  — always "compose" (the single unified authoring operation).
      - intent     — "new_question" | "model_answer_fill" | "image_regen".
      - input_kind — "prompt" | "source_files" | "by_hand".

    The agent layer is UNCHANGED (ADR-195 D2): the chora-creation
    question-generation worker maps (intent, input, plan) to the same composer
    TaskContextQuestion fields it already consumed from v1.

    Cutover — PARALLEL-PUBLISH (ADR-195 D7): chora-creation publishes BOTH v1
    (with `job_type`) and v2 (with the compose trio) during the migration
    window; the worker's WS4 runCompose dispatch reads `intent` directly and
    falls back to the legacy `job_type` only on a v1 payload. Once all readers
    consume v2, v1 is drained + retired.

    Wire-compat: every non-discriminant field keeps its v1 proto tag, so a v1
    reader of a v2 payload sees fields 2-13 unchanged (and ignores 14-16). Proto
    tag 5 is RESERVED (was `job_type`) and is NEVER reused.

    Publisher invariants (chora-creation):
      - the compose job row + the outbox row commit in the SAME transaction;
      - AT MOST ONE generation_requested.v2 per job_id (job-status guard);
      - BINARY-encoded at the outbox publish bridge against the Schema Registry
        flat schema (proto/events-flat/creation/question/generation_requested.v2.proto).

    Subscriber invariants (chora-creation question-generation worker):
      - intra-domain ONLY — NO consumer outside chora-creation reads the
        discriminant;
      - idempotent on job_id; the worker updates the job row in place and emits
        chora.creation.question.generation_completed.v2 on terminal status.

    Owning team    : Team 1 (Content)
    Owning domain  : Content Creation (chora_creation database)
    Surface (admin): A+ Creator mode

    Source-of-truth: docs/architecture/adrs/adr-195 (D1 compose model, D2 agent
    layer unchanged, D7 .v2 cutover) + proto/events/creation/question.proto
    + .claude/rules/ddd-enforcement.md
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  questionGenerationRequested:
    address: "chora.creation.question.generation_requested.v2"
    description: |
      Pub/Sub topic for QuestionGenerationRequestedV2 events. Topic resides in
      the centralised platform host project (`chora-local`) with a paired
      dead-letter topic `chora.dlq.creation.question.generation_requested.v2`.
      Schema Registry validates the BINARY Protobuf payload at publish time
      (flat schema: proto/events-flat/creation/question/generation_requested.v2.proto).
      Parallel-published alongside the v1 topic during the ADR-195 D7 cutover.
    messages:
      questionGenerationRequested:
        $ref: "#/components/messages/QuestionGenerationRequestedV2"

operations:
  publishQuestionGenerationRequested:
    action: send
    channel:
      $ref: "#/channels/questionGenerationRequested"
    summary: "Publish a compose question-generation request (compose model, v2)"
    description: |
      Producer: chora-creation service (transactional outbox, BINARY encode at
      the publish bridge, at-most-once per job_id by status guard).
      Consumers:
        - chora-creation question-generation worker -> WS4 runCompose dispatch
          reads `intent` directly (falls back to legacy `job_type` only on a v1
          payload). Intra-domain ONLY — no consumer outside chora-creation reads
          the discriminant.
    messages:
      - $ref: "#/channels/questionGenerationRequested/messages/questionGenerationRequested"

components:
  messages:
    QuestionGenerationRequestedV2:
      name: "QuestionGenerationRequestedV2"
      title: "Question Generation Requested (v2 — compose model)"
      summary: "A compose question-generation job was requested (replaces the retired job_type discriminant)"
      description: |
        Payload fields (proto/events/creation/question.proto ->
        chora.creation.v1.QuestionGenerationRequestedV2). The leading `f{N}` is
        the proto field tag. Tag 5 is RESERVED (was `job_type`) and never reused.

          f1  envelope (chora.common.v1.EventEnvelope)
              Mandatory event envelope — tenant_id, gcid, occurred_at,
              published_at, traceparent, tracestate, schema_version, IMDA
              dimension tagging.

          f2  job_id (string)
              UUIDv7 of the compose job row (the ComposeJob aggregate — ADR-195
              D1).

          f3  atom_id (string)
              UUIDv7 of the target LearningAtom.

          f4  author_gcid (string)
              GCID (UUIDv7) of the author who initiated the job.

          f5  RESERVED (was `job_type`)
              The retired QuestionGenerationJobType discriminant. Reserved so it
              is never reused; its information is now carried by `intent` +
              `input_kind` (ADR-195 D1/D7).

          f6  question_type (QuestionType)
              For new_question + model_answer_fill: the target QuestionType. For
              a mixed-type plan the per-candidate type rides in settings_json's
              type_plan.

          f7  target_question_id (string)
              For model_answer_fill: the existing question_id being filled (FK to
              questions.question_id). Empty for new_question + image_regen.

          f8  source_blob_uri (string)
              Source-files input: GCS URI of the (first) uploaded source
              material. The canonical multi-file list rides in
              settings_json.source_files; this mirrors entry 0 for back-compat.
              Empty for prompt / by-hand input.

          f9  source_mime_type (string)
              MIME type of source_blob_uri. Empty when source_blob_uri is empty.

          f10 mana_action_code (string)
              mana_action_pricing key the up-front debit was booked under.

          f11 mana_charged (int32)
              Units already debited at job creation time.

          f12 settings_json (string)
              Settings JSON echoed from the API request — requested_count,
              type_plan, difficulty, rubric, source_files[], image opt-ins, ...
              JSON-encoded to keep the proto schema additive.

          f13 requested_at (google.protobuf.Timestamp)
              When the job was requested at the producer's domain database.

        -- ADR-195 WS7 compose model (replaces the retired job_type discriminant) --

          f14 operation (string)
              Operation discriminant. Always "compose" — the single unified
              authoring operation (ADR-195 D1).

          f15 intent (string)
              The compose Intent (the domain discriminant). One of:
              "new_question" (mint N question atoms from the seed) |
              "model_answer_fill" (fill an existing question's model answer) |
              "image_regen" (re-render ONE image of a parent candidate in place).

          f16 input_kind (string)
              The compose Input kind (the generation-seed classification). One
              of: "prompt" (pure-LLM) | "source_files" (RAG / grounding) |
              "by_hand" (author-inline, no LLM). Folded from Input via precedence
              by_hand > source_files > prompt.
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf;version=3
      payload:
        schemaFormat: "application/x-protobuf;version=3"
        schema:
          protoFile: "proto/events/creation/question.proto"
          messageName: "chora.creation.v1.QuestionGenerationRequestedV2"
