asyncapi: 3.0.0
info:
  title: Chora Delivery — ApplicationPaid
  version: 1.0.0
  description: |
    Stripe PaymentIntent captured (Accepted -> Paid). Carries funding-source
    breakdown (FundingLine[]) for tax-invoice line generation.

    - Domain: Content Delivery (`chora_delivery` DB)
    - Topic: `chora.delivery.application.paid.v1`
    - Source proto: `proto/events/delivery/application.proto`
       message `chora.delivery.v1.ApplicationPaid`
    - IMDA: tag envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Delivery Team (Team 2)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  applicationPaid:
    address: chora.delivery.application.paid.v1
    messages:
      applicationPaid:
        $ref: '#/components/messages/ApplicationPaid'

operations:
  publishApplicationPaid:
    action: send
    channel:
      $ref: '#/channels/applicationPaid'
    messages:
      - $ref: '#/channels/applicationPaid/messages/applicationPaid'

  consumeApplicationPaid:
    action: receive
    channel:
      $ref: '#/channels/applicationPaid'
    description: |
      Consumers:
        - chora-delivery (state transition Paid -> Enrolled)
        - chora-notifications (tax-invoice email with PDF)
        - chora-observability (revenue ledger)
        - chora-governance (compliance audit — IMDA D1 evidence)
        - chora-tenancy (SkillsFutures claim if FUNDING_SOURCE_SKILLSFUTURES present)
    messages:
      - $ref: '#/channels/applicationPaid/messages/applicationPaid'

components:
  messages:
    ApplicationPaid:
      name: ApplicationPaid
      title: Course Application payment captured
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/delivery/application.proto#/chora.delivery.v1.ApplicationPaid'
