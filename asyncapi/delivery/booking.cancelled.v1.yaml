asyncapi: "3.0.0"
info:
  title: "chora.delivery.booking.cancelled.v1"
  version: "1.0.0"
  description: |
    Published when a learner or admin cancels a booking. Triggers refund
    flow in Tenancy + roster removal + notifications.
    Companion to `proto/events/delivery/booking.proto` message `BookingCancelled`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  bookingCancelled:
    address: chora.delivery.booking.cancelled.v1
    description: |
      Carries BookingCancelled Protobuf payload.

      Downstream consumers:
        - chora-tenancy        : refund flow
        - chora-delivery (roster) : remove from roster
        - chora-notifications  : cancellation email
    messages:
      bookingCancelled:
        $ref: "#/components/messages/BookingCancelled"

operations:
  publishBookingCancelled:
    action: send
    channel: { $ref: "#/channels/bookingCancelled" }
    summary: "Publish BookingCancelled"
    messages: [ { $ref: "#/channels/bookingCancelled/messages/bookingCancelled" } ]
  consumeBookingCancelled:
    action: receive
    channel: { $ref: "#/channels/bookingCancelled" }
    summary: "Consume BookingCancelled"
    messages: [ { $ref: "#/channels/bookingCancelled/messages/bookingCancelled" } ]

components:
  messages:
    BookingCancelled:
      name: BookingCancelled
      title: "Booking Cancelled"
      summary: "A booking has been cancelled."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.BookingCancelled."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          booking_id: { type: string, format: uuid }
          course_id: { type: string, format: uuid }
          learner_gcid: { type: string }
          status: { $ref: "#/components/schemas/BookingStatus" }
          seat_number: { type: integer }
          cancelled_by_gcid: { type: string }
          reason: { type: string, maxLength: 512 }
          cancelled_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
    BookingStatus:
      type: string
      enum: [BOOKING_STATUS_UNSPECIFIED, BOOKING_STATUS_PENDING, BOOKING_STATUS_CONFIRMED, BOOKING_STATUS_CANCELLED, BOOKING_STATUS_NO_SHOW, BOOKING_STATUS_COMPLETED]
