asyncapi: "3.0.0"
info:
  title: "chora.delivery.booking.created.v1"
  version: "1.0.0"
  description: |
    Published when a learner reserves a seat (PENDING). For paid courses,
    payment confirmation in Tenancy will trigger a follow-up confirmation.
    Companion to `proto/events/delivery/booking.proto` message `BookingCreated`.

    Owning domain : Content Delivery (chora_delivery DB)
    Owning team   : Team 2 (Delivery)

    Per ADR-129/130/131 collapse mandate, supersedes legacy
    `chora.training.enrollment.confirmed`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  bookingCreated:
    address: chora.delivery.booking.created.v1
    description: |
      Carries BookingCreated Protobuf payload.

      Downstream consumers:
        - chora-tenancy        : kick off payment flow (paid courses)
        - chora-notifications  : "we got your booking" email
    messages:
      bookingCreated:
        $ref: "#/components/messages/BookingCreated"

operations:
  publishBookingCreated:
    action: send
    channel: { $ref: "#/channels/bookingCreated" }
    summary: "Publish BookingCreated"
    messages: [ { $ref: "#/channels/bookingCreated/messages/bookingCreated" } ]
  consumeBookingCreated:
    action: receive
    channel: { $ref: "#/channels/bookingCreated" }
    summary: "Consume BookingCreated"
    messages: [ { $ref: "#/channels/bookingCreated/messages/bookingCreated" } ]

components:
  messages:
    BookingCreated:
      name: BookingCreated
      title: "Booking Created"
      summary: "A learner has reserved a seat (PENDING)."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.BookingCreated."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          booking_id: { type: string, format: uuid }
          course_id: { type: string, format: uuid }
          learner_gcid: { type: string }
          status: { $ref: "#/components/schemas/BookingStatus" }
          seat_number: { type: integer }
          created_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
    BookingStatus:
      type: string
      enum: [BOOKING_STATUS_UNSPECIFIED, BOOKING_STATUS_PENDING, BOOKING_STATUS_CONFIRMED, BOOKING_STATUS_CANCELLED, BOOKING_STATUS_NO_SHOW, BOOKING_STATUS_COMPLETED]
