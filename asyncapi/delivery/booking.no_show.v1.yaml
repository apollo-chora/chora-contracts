asyncapi: "3.0.0"
info:
  title: "chora.delivery.booking.no_show.v1"
  version: "1.0.0"
  description: |
    Auto-emitted by the attendance reconciliation job after class start when
    an enrolled learner failed to attend. Triggers makeup-eligibility check
    and instructor notification.
    Companion to `proto/events/delivery/booking.proto` message `BookingNoShow`.

    Per ADR-129/130/131 collapse mandate, supersedes legacy
    `chora.training.attendance.recorded` for the no-show case.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  local: { host: "localhost:8085", protocol: googlepubsub, description: "Pub/Sub Emulator" }
  production: { host: "pubsub.googleapis.com", protocol: googlepubsub, description: "Google Cloud Pub/Sub" }

channels:
  bookingNoShow:
    address: chora.delivery.booking.no_show.v1
    description: |
      Carries BookingNoShow Protobuf payload.

      Downstream consumers:
        - chora-delivery (makeup) : makeup eligibility
        - chora-notifications     : instructor + admin alerts
    messages:
      bookingNoShow:
        $ref: "#/components/messages/BookingNoShow"

operations:
  publishBookingNoShow:
    action: send
    channel: { $ref: "#/channels/bookingNoShow" }
    summary: "Publish BookingNoShow"
    messages: [ { $ref: "#/channels/bookingNoShow/messages/bookingNoShow" } ]
  consumeBookingNoShow:
    action: receive
    channel: { $ref: "#/channels/bookingNoShow" }
    summary: "Consume BookingNoShow"
    messages: [ { $ref: "#/channels/bookingNoShow/messages/bookingNoShow" } ]

components:
  messages:
    BookingNoShow:
      name: BookingNoShow
      title: "Booking No-Show"
      summary: "An enrolled learner did not attend."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.BookingNoShow."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          booking_id: { type: string, format: uuid }
          course_id: { type: string, format: uuid }
          learner_gcid: { type: string }
          status: { $ref: "#/components/schemas/BookingStatus" }
          seat_number: { type: integer }
          marked_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
    BookingStatus:
      type: string
      enum: [BOOKING_STATUS_UNSPECIFIED, BOOKING_STATUS_PENDING, BOOKING_STATUS_CONFIRMED, BOOKING_STATUS_CANCELLED, BOOKING_STATUS_NO_SHOW, BOOKING_STATUS_COMPLETED]
