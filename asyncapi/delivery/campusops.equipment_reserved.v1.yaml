asyncapi: "3.0.0"
info:
  title: "chora.delivery.campusops.equipment_reserved.v1"
  version: "1.0.0"
  description: |
    Published when shared equipment is reserved (projector, lab kit, etc.).
    Companion to `proto/events/delivery/campusops.proto` message `EquipmentReserved`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  local: { host: "localhost:8085", protocol: googlepubsub, description: "Pub/Sub Emulator" }
  production: { host: "pubsub.googleapis.com", protocol: googlepubsub, description: "Google Cloud Pub/Sub" }

channels:
  equipmentReserved:
    address: chora.delivery.campusops.equipment_reserved.v1
    description: |
      Carries EquipmentReserved Protobuf payload.

      Downstream consumers:
        - chora-notifications : reservation confirmation
        - chora-delivery (inventory) : check-out tracking
    messages:
      equipmentReserved:
        $ref: "#/components/messages/EquipmentReserved"

operations:
  publishEquipmentReserved:
    action: send
    channel: { $ref: "#/channels/equipmentReserved" }
    summary: "Publish EquipmentReserved"
    messages: [ { $ref: "#/channels/equipmentReserved/messages/equipmentReserved" } ]
  consumeEquipmentReserved:
    action: receive
    channel: { $ref: "#/channels/equipmentReserved" }
    summary: "Consume EquipmentReserved"
    messages: [ { $ref: "#/channels/equipmentReserved/messages/equipmentReserved" } ]

components:
  messages:
    EquipmentReserved:
      name: EquipmentReserved
      title: "Equipment Reserved"
      summary: "Shared equipment was reserved."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.EquipmentReserved."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          booking_id: { type: string, format: uuid }
          resource_id: { type: string, format: uuid }
          course_id: { type: string }
          starts_at: { type: string, format: date-time }
          ends_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
