asyncapi: "3.0.0"
info:
  title: "chora.delivery.campusops.room_booked.v1"
  version: "1.0.0"
  description: |
    Published when a physical room is reserved for a Course / Class instance.
    Companion to `proto/events/delivery/campusops.proto` message `RoomBooked`.

    Per ADR-129/130/131 collapse mandate, supersedes legacy `chora.campusops.*`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  roomBooked:
    address: chora.delivery.campusops.room_booked.v1
    description: |
      Carries RoomBooked Protobuf payload.

      Downstream consumers:
        - chora-notifications : room confirmation
        - chora-delivery (signage) : digital signage update
    messages:
      roomBooked:
        $ref: "#/components/messages/RoomBooked"

operations:
  publishRoomBooked:
    action: send
    channel: { $ref: "#/channels/roomBooked" }
    summary: "Publish RoomBooked"
    messages: [ { $ref: "#/channels/roomBooked/messages/roomBooked" } ]
  consumeRoomBooked:
    action: receive
    channel: { $ref: "#/channels/roomBooked" }
    summary: "Consume RoomBooked"
    messages: [ { $ref: "#/channels/roomBooked/messages/roomBooked" } ]

components:
  messages:
    RoomBooked:
      name: RoomBooked
      title: "Room Booked"
      summary: "A physical room was reserved."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.RoomBooked."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          booking_id: { type: string, format: uuid }
          resource_id: { type: string, format: uuid }
          course_id: { type: string }
          starts_at: { type: string, format: date-time }
          ends_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
