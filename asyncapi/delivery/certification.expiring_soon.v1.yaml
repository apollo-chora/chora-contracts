asyncapi: "3.0.0"
info:
  title: "chora.delivery.certification.expiring_soon.v1"
  version: "1.0.0"
  description: |
    Emitted by the cert-expiry reconciliation job when an issued cert is
    approaching its expires_at horizon. Drives renewal reminders.
    Companion to `proto/events/delivery/certification.proto` message `CertExpiringSoon`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  local: { host: "localhost:8085", protocol: googlepubsub, description: "Pub/Sub Emulator" }
  production: { host: "pubsub.googleapis.com", protocol: googlepubsub, description: "Google Cloud Pub/Sub" }

channels:
  certExpiringSoon:
    address: chora.delivery.certification.expiring_soon.v1
    description: |
      Carries CertExpiringSoon Protobuf payload.

      Downstream consumers:
        - chora-notifications : renewal reminder email
    messages:
      certExpiringSoon:
        $ref: "#/components/messages/CertExpiringSoon"

operations:
  publishCertExpiringSoon:
    action: send
    channel: { $ref: "#/channels/certExpiringSoon" }
    summary: "Publish CertExpiringSoon"
    messages: [ { $ref: "#/channels/certExpiringSoon/messages/certExpiringSoon" } ]
  consumeCertExpiringSoon:
    action: receive
    channel: { $ref: "#/channels/certExpiringSoon" }
    summary: "Consume CertExpiringSoon"
    messages: [ { $ref: "#/channels/certExpiringSoon/messages/certExpiringSoon" } ]

components:
  messages:
    CertExpiringSoon:
      name: CertExpiringSoon
      title: "Certification Expiring Soon"
      summary: "An issued certification is approaching its expires_at horizon."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.CertExpiringSoon."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          cert_id: { type: string, format: uuid }
          learner_gcid: { type: string }
          course_id: { type: string, format: uuid }
          cert_type: { $ref: "#/components/schemas/CertType" }
          issued_at: { type: string, format: date-time }
          expires_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
    CertType:
      type: string
      enum: [CERT_TYPE_UNSPECIFIED, CERT_TYPE_COMPLETION, CERT_TYPE_COMPETENCY, CERT_TYPE_ACCREDITED, CERT_TYPE_MICRO_CREDENTIAL]
