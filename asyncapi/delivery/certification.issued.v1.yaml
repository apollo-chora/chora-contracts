asyncapi: "3.0.0"
info:
  title: "chora.delivery.certification.issued.v1"
  version: "1.0.0"
  description: |
    Published on cert issuance. Drives Sharing (brag post), Notifications,
    and Tenancy (verifiable-credential record).
    Companion to `proto/events/delivery/certification.proto` message `CertIssued`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  certIssued:
    address: chora.delivery.certification.issued.v1
    description: |
      Carries CertIssued Protobuf payload.

      Downstream consumers:
        - chora-sharing       : auto brag post
        - chora-notifications : email + cert link
        - chora-tenancy       : verifiable-credential record
    messages:
      certIssued:
        $ref: "#/components/messages/CertIssued"

operations:
  publishCertIssued:
    action: send
    channel: { $ref: "#/channels/certIssued" }
    summary: "Publish CertIssued"
    messages: [ { $ref: "#/channels/certIssued/messages/certIssued" } ]
  consumeCertIssued:
    action: receive
    channel: { $ref: "#/channels/certIssued" }
    summary: "Consume CertIssued"
    messages: [ { $ref: "#/channels/certIssued/messages/certIssued" } ]

components:
  messages:
    CertIssued:
      name: CertIssued
      title: "Certification Issued"
      summary: "A certification was issued to a learner."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.CertIssued."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          cert_id: { type: string, format: uuid }
          learner_gcid: { type: string }
          course_id: { type: string, format: uuid }
          cert_type: { $ref: "#/components/schemas/CertType" }
          issued_at: { type: string, format: date-time }
          expires_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
    CertType:
      type: string
      enum: [CERT_TYPE_UNSPECIFIED, CERT_TYPE_COMPLETION, CERT_TYPE_COMPETENCY, CERT_TYPE_ACCREDITED, CERT_TYPE_MICRO_CREDENTIAL]
