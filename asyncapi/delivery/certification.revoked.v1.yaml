asyncapi: "3.0.0"
info:
  title: "chora.delivery.certification.revoked.v1"
  version: "1.0.0"
  description: |
    Published when an issued cert is invalidated. CertIssuance row preserved
    with revoked_at — never hard-deleted.
    Companion to `proto/events/delivery/certification.proto` message `CertRevoked`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  certRevoked:
    address: chora.delivery.certification.revoked.v1
    description: |
      Carries CertRevoked Protobuf payload.

      Downstream consumers:
        - chora-sharing       : remove brag post
        - chora-notifications : revocation email
    messages:
      certRevoked:
        $ref: "#/components/messages/CertRevoked"

operations:
  publishCertRevoked:
    action: send
    channel: { $ref: "#/channels/certRevoked" }
    summary: "Publish CertRevoked"
    messages: [ { $ref: "#/channels/certRevoked/messages/certRevoked" } ]
  consumeCertRevoked:
    action: receive
    channel: { $ref: "#/channels/certRevoked" }
    summary: "Consume CertRevoked"
    messages: [ { $ref: "#/channels/certRevoked/messages/certRevoked" } ]

components:
  messages:
    CertRevoked:
      name: CertRevoked
      title: "Certification Revoked"
      summary: "An issued certification was revoked."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.CertRevoked."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          cert_id: { type: string, format: uuid }
          learner_gcid: { type: string }
          course_id: { type: string, format: uuid }
          cert_type: { $ref: "#/components/schemas/CertType" }
          issued_at: { type: string, format: date-time }
          revocation_reason: { type: string, maxLength: 512 }
          revoked_by_gcid: { type: string }
          revoked_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
    CertType:
      type: string
      enum: [CERT_TYPE_UNSPECIFIED, CERT_TYPE_COMPLETION, CERT_TYPE_COMPETENCY, CERT_TYPE_ACCREDITED, CERT_TYPE_MICRO_CREDENTIAL]
