asyncapi: "3.0.0"
info:
  title: "chora.delivery.course.cancelled.v1"
  version: "1.0.0"
  description: |
    Published when a Course is cancelled before completion. Triggers booking
    cancellations, refunds (Tenancy), and learner notifications.
    Companion to `proto/events/delivery/course.proto` message `CourseCancelled`.

    Owning domain : Content Delivery (chora_delivery DB)
    Owning team   : Team 2 (Delivery)
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  courseCancelled:
    address: chora.delivery.course.cancelled.v1
    description: |
      Carries CourseCancelled Protobuf payload.

      Downstream consumers:
        - chora-delivery (booking)   : cascade-cancel bookings
        - chora-tenancy              : refund flow
        - chora-notifications        : learner notifications
    messages:
      courseCancelled:
        $ref: "#/components/messages/CourseCancelled"

operations:
  publishCourseCancelled:
    action: send
    channel: { $ref: "#/channels/courseCancelled" }
    summary: "Publish CourseCancelled"
    messages: [ { $ref: "#/channels/courseCancelled/messages/courseCancelled" } ]
  consumeCourseCancelled:
    action: receive
    channel: { $ref: "#/channels/courseCancelled" }
    summary: "Consume CourseCancelled"
    messages: [ { $ref: "#/channels/courseCancelled/messages/courseCancelled" } ]

components:
  messages:
    CourseCancelled:
      name: CourseCancelled
      title: "Course Cancelled"
      summary: "A Course has been cancelled."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.CourseCancelled."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          course_id: { type: string, format: uuid }
          title: { type: string, minLength: 1, maxLength: 256 }
          instructor_gcid: { type: string }
          atom_path_id: { type: string }
          modality: { $ref: "#/components/schemas/Modality" }
          starts_at: { type: string, format: date-time }
          ends_at: { type: string, format: date-time }
          capacity: { type: integer }
          cancelled_by_gcid: { type: string }
          reason: { type: string, maxLength: 512 }
          cancelled_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
    Modality:
      type: string
      enum: [MODALITY_UNSPECIFIED, MODALITY_IN_PERSON, MODALITY_ONLINE_SYNC, MODALITY_ONLINE_ASYNC, MODALITY_BLENDED]
