asyncapi: "3.0.0"
info:
  title: "chora.delivery.course.completed.v1"
  version: "1.0.0"
  description: |
    Published when a Course finishes (all sessions delivered, attendance
    closed). Triggers downstream certification + post-course surveys.
    Companion to `proto/events/delivery/course.proto` message `CourseCompleted`.

    Owning domain : Content Delivery (chora_delivery DB)
    Owning team   : Team 2 (Delivery)
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  courseCompleted:
    address: chora.delivery.course.completed.v1
    description: |
      Carries CourseCompleted Protobuf payload.

      Downstream consumers:
        - chora-delivery (cert issuer) : trigger cert flow
        - chora-delivery (survey)      : distribute end-of-course survey
        - chora-sharing                : XP award
        - chora-notifications          : completion email
    messages:
      courseCompleted:
        $ref: "#/components/messages/CourseCompleted"

operations:
  publishCourseCompleted:
    action: send
    channel: { $ref: "#/channels/courseCompleted" }
    summary: "Publish CourseCompleted"
    messages: [ { $ref: "#/channels/courseCompleted/messages/courseCompleted" } ]
  consumeCourseCompleted:
    action: receive
    channel: { $ref: "#/channels/courseCompleted" }
    summary: "Consume CourseCompleted"
    messages: [ { $ref: "#/channels/courseCompleted/messages/courseCompleted" } ]

components:
  messages:
    CourseCompleted:
      name: CourseCompleted
      title: "Course Completed"
      summary: "A Course has finished."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.CourseCompleted."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          course_id: { type: string, format: uuid }
          title: { type: string, minLength: 1, maxLength: 256 }
          instructor_gcid: { type: string }
          atom_path_id: { type: string }
          modality: { $ref: "#/components/schemas/Modality" }
          starts_at: { type: string, format: date-time }
          ends_at: { type: string, format: date-time }
          capacity: { type: integer }
          completed_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
    Modality:
      type: string
      enum: [MODALITY_UNSPECIFIED, MODALITY_IN_PERSON, MODALITY_ONLINE_SYNC, MODALITY_ONLINE_ASYNC, MODALITY_BLENDED]
