asyncapi: "3.0.0"
info:
  title: "chora.delivery.exam.proctored.v1"
  version: "1.0.0"
  description: |
    Published when proctoring concludes. Carries no fine-grained incident
    detail — those live in ExamIncidentLog inside chora_delivery.
    Companion to `proto/events/delivery/exam.proto` message `ExamProctored`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  examProctored:
    address: chora.delivery.exam.proctored.v1
    description: |
      Carries ExamProctored Protobuf payload.

      Downstream consumers:
        - chora-delivery (grader) : trigger grading flow
    messages:
      examProctored:
        $ref: "#/components/messages/ExamProctored"

operations:
  publishExamProctored:
    action: send
    channel: { $ref: "#/channels/examProctored" }
    summary: "Publish ExamProctored"
    messages: [ { $ref: "#/channels/examProctored/messages/examProctored" } ]
  consumeExamProctored:
    action: receive
    channel: { $ref: "#/channels/examProctored" }
    summary: "Consume ExamProctored"
    messages: [ { $ref: "#/channels/examProctored/messages/examProctored" } ]

components:
  messages:
    ExamProctored:
      name: ExamProctored
      title: "Exam Proctored"
      summary: "Proctoring concluded."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.ExamProctored."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          exam_id: { type: string, format: uuid }
          course_id: { type: string, format: uuid }
          candidate_gcid: { type: string }
          scheduled_for: { type: string, format: date-time }
          proctor_method: { $ref: "#/components/schemas/ProctorMethod" }
          proctored_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
    ProctorMethod:
      type: string
      enum: [PROCTOR_METHOD_UNSPECIFIED, PROCTOR_METHOD_NONE, PROCTOR_METHOD_AUTO_AI, PROCTOR_METHOD_HUMAN_LIVE, PROCTOR_METHOD_HUMAN_RECORDED]
