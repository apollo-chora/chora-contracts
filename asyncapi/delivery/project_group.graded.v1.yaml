asyncapi: "3.0.0"
info:
  title: "chora.delivery.project_group.graded.v1"
  version: "1.0.0"
  description: |
    Published when an instructor finalises the group grade.
    Companion to `proto/events/delivery/project_group.proto` message `ProjectGroupGraded`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  local: { host: "localhost:8085", protocol: googlepubsub, description: "Pub/Sub Emulator" }
  production: { host: "pubsub.googleapis.com", protocol: googlepubsub, description: "Google Cloud Pub/Sub" }

channels:
  projectGroupGraded:
    address: chora.delivery.project_group.graded.v1
    description: |
      Carries ProjectGroupGraded Protobuf payload.

      Downstream consumers:
        - chora-consumption   : path progress update
        - chora-notifications : grade release email
    messages:
      projectGroupGraded:
        $ref: "#/components/messages/ProjectGroupGraded"

operations:
  publishProjectGroupGraded:
    action: send
    channel: { $ref: "#/channels/projectGroupGraded" }
    summary: "Publish ProjectGroupGraded"
    messages: [ { $ref: "#/channels/projectGroupGraded/messages/projectGroupGraded" } ]
  consumeProjectGroupGraded:
    action: receive
    channel: { $ref: "#/channels/projectGroupGraded" }
    summary: "Consume ProjectGroupGraded"
    messages: [ { $ref: "#/channels/projectGroupGraded/messages/projectGroupGraded" } ]

components:
  messages:
    ProjectGroupGraded:
      name: ProjectGroupGraded
      title: "Project Group Graded"
      summary: "A project group's grade was finalized."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.ProjectGroupGraded."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          group_id: { type: string, format: uuid }
          course_id: { type: string, format: uuid }
          member_gcids:
            type: array
            items: { type: string }
          grade: { type: integer, minimum: 0, maximum: 100 }
          graded_by_gcid: { type: string }
          graded_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
