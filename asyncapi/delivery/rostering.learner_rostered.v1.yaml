asyncapi: "3.0.0"
info:
  title: "chora.delivery.rostering.learner_rostered.v1"
  version: "1.0.0"
  description: |
    Published when a single learner is added to a roster. Drives notification
    + path entitlement provisioning. Idempotent on (roster_id, learner_gcid).
    Companion to `proto/events/delivery/rostering.proto` message `LearnerRostered`.

    Per ADR-129/130/131 collapse mandate, supersedes legacy
    `chora.training.roster.entry_added`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  local: { host: "localhost:8085", protocol: googlepubsub, description: "Pub/Sub Emulator" }
  production: { host: "pubsub.googleapis.com", protocol: googlepubsub, description: "Google Cloud Pub/Sub" }

channels:
  learnerRostered:
    address: chora.delivery.rostering.learner_rostered.v1
    description: |
      Carries LearnerRostered Protobuf payload.

      Downstream consumers:
        - chora-notifications : welcome email + calendar invite
        - chora-consumption   : path entitlement
    messages:
      learnerRostered:
        $ref: "#/components/messages/LearnerRostered"

operations:
  publishLearnerRostered:
    action: send
    channel: { $ref: "#/channels/learnerRostered" }
    summary: "Publish LearnerRostered"
    messages: [ { $ref: "#/channels/learnerRostered/messages/learnerRostered" } ]
  consumeLearnerRostered:
    action: receive
    channel: { $ref: "#/channels/learnerRostered" }
    summary: "Consume LearnerRostered"
    messages: [ { $ref: "#/channels/learnerRostered/messages/learnerRostered" } ]

components:
  messages:
    LearnerRostered:
      name: LearnerRostered
      title: "Learner Rostered"
      summary: "A learner was added to a roster."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.LearnerRostered."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          roster_id: { type: string, format: uuid }
          course_id: { type: string, format: uuid }
          learner_gcid: { type: string }
          assignment_type: { $ref: "#/components/schemas/AssignmentType" }
          rostered_by_gcid: { type: string }
          rostered_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
    AssignmentType:
      type: string
      enum: [ASSIGNMENT_TYPE_UNSPECIFIED, ASSIGNMENT_TYPE_MANUAL, ASSIGNMENT_TYPE_BULK_IMPORT, ASSIGNMENT_TYPE_AUTO_ALLOCATED]
