asyncapi: "3.0.0"
info:
  title: "chora.delivery.rostering.learner_unrostered.v1"
  version: "1.0.0"
  description: |
    Published when a learner is removed from a roster. Triggers notification +
    path entitlement revocation. Soft-state — assignment row preserved.
    Companion to `proto/events/delivery/rostering.proto` message `LearnerUnrostered`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  learnerUnrostered:
    address: chora.delivery.rostering.learner_unrostered.v1
    description: |
      Carries LearnerUnrostered Protobuf payload.

      Downstream consumers:
        - chora-notifications : removal email
        - chora-consumption   : revoke path entitlement
    messages:
      learnerUnrostered:
        $ref: "#/components/messages/LearnerUnrostered"

operations:
  publishLearnerUnrostered:
    action: send
    channel: { $ref: "#/channels/learnerUnrostered" }
    summary: "Publish LearnerUnrostered"
    messages: [ { $ref: "#/channels/learnerUnrostered/messages/learnerUnrostered" } ]
  consumeLearnerUnrostered:
    action: receive
    channel: { $ref: "#/channels/learnerUnrostered" }
    summary: "Consume LearnerUnrostered"
    messages: [ { $ref: "#/channels/learnerUnrostered/messages/learnerUnrostered" } ]

components:
  messages:
    LearnerUnrostered:
      name: LearnerUnrostered
      title: "Learner Unrostered"
      summary: "A learner was removed from a roster."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.LearnerUnrostered."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          roster_id: { type: string, format: uuid }
          course_id: { type: string, format: uuid }
          learner_gcid: { type: string }
          assignment_type: { $ref: "#/components/schemas/AssignmentType" }
          unrostered_by_gcid: { type: string }
          reason: { type: string, maxLength: 512 }
          unrostered_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
    AssignmentType:
      type: string
      enum: [ASSIGNMENT_TYPE_UNSPECIFIED, ASSIGNMENT_TYPE_MANUAL, ASSIGNMENT_TYPE_BULK_IMPORT, ASSIGNMENT_TYPE_AUTO_ALLOCATED]
