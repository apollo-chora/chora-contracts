asyncapi: "3.0.0"
info:
  title: "chora.delivery.skillsfutures.disbursed.v1"
  version: "1.0.0"
  description: |
    Published when SSG funds are disbursed. This is Delivery's own SFA
    workflow event — separate chora.tenancy.* billing/payment events handle
    the Stripe-side ledger.
    Companion to `proto/events/delivery/skillsfutures.proto` message `SkillsFutureClaimDisbursed`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  local: { host: "localhost:8085", protocol: googlepubsub, description: "Pub/Sub Emulator" }
  production: { host: "pubsub.googleapis.com", protocol: googlepubsub, description: "Google Cloud Pub/Sub" }

channels:
  skillsFutureDisbursed:
    address: chora.delivery.skillsfutures.disbursed.v1
    description: |
      Carries SkillsFutureClaimDisbursed Protobuf payload.

      Downstream consumers:
        - chora-tenancy       : reconcile against Stripe ledger
        - chora-notifications : disbursement confirmation
    messages:
      skillsFutureDisbursed:
        $ref: "#/components/messages/SkillsFutureClaimDisbursed"

operations:
  publishSkillsFutureDisbursed:
    action: send
    channel: { $ref: "#/channels/skillsFutureDisbursed" }
    summary: "Publish SkillsFutureClaimDisbursed"
    messages: [ { $ref: "#/channels/skillsFutureDisbursed/messages/skillsFutureDisbursed" } ]
  consumeSkillsFutureDisbursed:
    action: receive
    channel: { $ref: "#/channels/skillsFutureDisbursed" }
    summary: "Consume SkillsFutureClaimDisbursed"
    messages: [ { $ref: "#/channels/skillsFutureDisbursed/messages/skillsFutureDisbursed" } ]

components:
  messages:
    SkillsFutureClaimDisbursed:
      name: SkillsFutureClaimDisbursed
      title: "SkillsFutures Claim Disbursed"
      summary: "SSG funds were disbursed."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.SkillsFutureClaimDisbursed."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          claim_id: { type: string, format: uuid }
          learner_gcid: { type: string }
          course_id: { type: string, format: uuid }
          claim_amount: { type: integer }
          claim_status: { $ref: "#/components/schemas/ClaimStatus" }
          ssg_reference_id: { type: string }
          disbursed_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
    ClaimStatus:
      type: string
      enum: [CLAIM_STATUS_UNSPECIFIED, CLAIM_STATUS_SUBMITTED, CLAIM_STATUS_UNDER_REVIEW, CLAIM_STATUS_APPROVED, CLAIM_STATUS_REJECTED, CLAIM_STATUS_DISBURSED]
