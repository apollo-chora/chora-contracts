asyncapi: "3.0.0"
info:
  title: "chora.delivery.skillsfutures.rejected.v1"
  version: "1.0.0"
  description: |
    Published when SSG rejects a SkillsFutures claim. Drives learner
    notification + remediation flow.
    Companion to `proto/events/delivery/skillsfutures.proto` message `SkillsFutureClaimRejected`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  skillsFutureRejected:
    address: chora.delivery.skillsfutures.rejected.v1
    description: |
      Carries SkillsFutureClaimRejected Protobuf payload.

      Downstream consumers:
        - chora-notifications : rejection email
        - chora-delivery (sfa) : remediation flow
    messages:
      skillsFutureRejected:
        $ref: "#/components/messages/SkillsFutureClaimRejected"

operations:
  publishSkillsFutureRejected:
    action: send
    channel: { $ref: "#/channels/skillsFutureRejected" }
    summary: "Publish SkillsFutureClaimRejected"
    messages: [ { $ref: "#/channels/skillsFutureRejected/messages/skillsFutureRejected" } ]
  consumeSkillsFutureRejected:
    action: receive
    channel: { $ref: "#/channels/skillsFutureRejected" }
    summary: "Consume SkillsFutureClaimRejected"
    messages: [ { $ref: "#/channels/skillsFutureRejected/messages/skillsFutureRejected" } ]

components:
  messages:
    SkillsFutureClaimRejected:
      name: SkillsFutureClaimRejected
      title: "SkillsFutures Claim Rejected"
      summary: "SSG rejected the claim."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.SkillsFutureClaimRejected."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          claim_id: { type: string, format: uuid }
          learner_gcid: { type: string }
          course_id: { type: string, format: uuid }
          claim_amount: { type: integer }
          claim_status: { $ref: "#/components/schemas/ClaimStatus" }
          ssg_reference_id: { type: string }
          rejection_reason: { type: string, maxLength: 512 }
          rejected_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
    ClaimStatus:
      type: string
      enum: [CLAIM_STATUS_UNSPECIFIED, CLAIM_STATUS_SUBMITTED, CLAIM_STATUS_UNDER_REVIEW, CLAIM_STATUS_APPROVED, CLAIM_STATUS_REJECTED, CLAIM_STATUS_DISBURSED]
