asyncapi: "3.0.0"
info:
  title: "chora.delivery.survey.closed.v1"
  version: "1.0.0"
  description: |
    Published when a survey is closed (no further responses accepted).
    Companion to `proto/events/delivery/survey.proto` message `SurveyClosed`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  local: { host: "localhost:8085", protocol: googlepubsub, description: "Pub/Sub Emulator" }
  production: { host: "pubsub.googleapis.com", protocol: googlepubsub, description: "Google Cloud Pub/Sub" }

channels:
  surveyClosed:
    address: chora.delivery.survey.closed.v1
    description: |
      Carries SurveyClosed Protobuf payload.

      Downstream consumers:
        - chora-observability : final aggregation
        - chora-notifications : "results ready" email
    messages:
      surveyClosed:
        $ref: "#/components/messages/SurveyClosed"

operations:
  publishSurveyClosed:
    action: send
    channel: { $ref: "#/channels/surveyClosed" }
    summary: "Publish SurveyClosed"
    messages: [ { $ref: "#/channels/surveyClosed/messages/surveyClosed" } ]
  consumeSurveyClosed:
    action: receive
    channel: { $ref: "#/channels/surveyClosed" }
    summary: "Consume SurveyClosed"
    messages: [ { $ref: "#/channels/surveyClosed/messages/surveyClosed" } ]

components:
  messages:
    SurveyClosed:
      name: SurveyClosed
      title: "Survey Closed"
      summary: "A survey was closed."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.SurveyClosed."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          survey_id: { type: string, format: uuid }
          course_id: { type: string }
          closed_by_gcid: { type: string }
          closed_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
