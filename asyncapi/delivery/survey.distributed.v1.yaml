asyncapi: "3.0.0"
info:
  title: "chora.delivery.survey.distributed.v1"
  version: "1.0.0"
  description: |
    Published when a survey is distributed to a respondent population.
    Companion to `proto/events/delivery/survey.proto` message `SurveyDistributed`.

    Per ADR-129/130/131 collapse mandate, supersedes legacy `chora.survey.*`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  surveyDistributed:
    address: chora.delivery.survey.distributed.v1
    description: |
      Carries SurveyDistributed Protobuf payload.

      Downstream consumers:
        - chora-notifications : invite emails
        - chora-observability : analytics ingestion
    messages:
      surveyDistributed:
        $ref: "#/components/messages/SurveyDistributed"

operations:
  publishSurveyDistributed:
    action: send
    channel: { $ref: "#/channels/surveyDistributed" }
    summary: "Publish SurveyDistributed"
    messages: [ { $ref: "#/channels/surveyDistributed/messages/surveyDistributed" } ]
  consumeSurveyDistributed:
    action: receive
    channel: { $ref: "#/channels/surveyDistributed" }
    summary: "Consume SurveyDistributed"
    messages: [ { $ref: "#/channels/surveyDistributed/messages/surveyDistributed" } ]

components:
  messages:
    SurveyDistributed:
      name: SurveyDistributed
      title: "Survey Distributed"
      summary: "A survey was distributed."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.SurveyDistributed."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          survey_id: { type: string, format: uuid }
          course_id: { type: string }
          distributed_by_gcid: { type: string }
          distributed_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
