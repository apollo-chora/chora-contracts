asyncapi: "3.0.0"
info:
  title: "chora.delivery.survey.response_submitted.v1"
  version: "1.0.0"
  description: |
    Published when a respondent submits a response. response_summary is a
    compact denormalised representation; the full structured response lives
    inside chora_delivery.
    Companion to `proto/events/delivery/survey.proto` message `SurveyResponseSubmitted`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  local: { host: "localhost:8085", protocol: googlepubsub, description: "Pub/Sub Emulator" }
  production: { host: "pubsub.googleapis.com", protocol: googlepubsub, description: "Google Cloud Pub/Sub" }

channels:
  surveyResponseSubmitted:
    address: chora.delivery.survey.response_submitted.v1
    description: |
      Carries SurveyResponseSubmitted Protobuf payload.

      Downstream consumers:
        - chora-observability : aggregation + dashboards
    messages:
      surveyResponseSubmitted:
        $ref: "#/components/messages/SurveyResponseSubmitted"

operations:
  publishSurveyResponseSubmitted:
    action: send
    channel: { $ref: "#/channels/surveyResponseSubmitted" }
    summary: "Publish SurveyResponseSubmitted"
    messages: [ { $ref: "#/channels/surveyResponseSubmitted/messages/surveyResponseSubmitted" } ]
  consumeSurveyResponseSubmitted:
    action: receive
    channel: { $ref: "#/channels/surveyResponseSubmitted" }
    summary: "Consume SurveyResponseSubmitted"
    messages: [ { $ref: "#/channels/surveyResponseSubmitted/messages/surveyResponseSubmitted" } ]

components:
  messages:
    SurveyResponseSubmitted:
      name: SurveyResponseSubmitted
      title: "Survey Response Submitted"
      summary: "A respondent submitted a survey response."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.SurveyResponseSubmitted."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          survey_id: { type: string, format: uuid }
          course_id: { type: string }
          respondent_gcid: { type: string }
          response_summary: { type: string, maxLength: 1024 }
          submitted_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
