asyncapi: "3.0.0"
info:
  title: "chora.delivery.wbl.placement_completed.v1"
  version: "1.0.0"
  description: |
    Published on placement completion. hours_completed feeds Certification +
    Consumption path-progress flows.
    Companion to `proto/events/delivery/wbl.proto` message `WblPlacementCompleted`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  local: { host: "localhost:8085", protocol: googlepubsub, description: "Pub/Sub Emulator" }
  production: { host: "pubsub.googleapis.com", protocol: googlepubsub, description: "Google Cloud Pub/Sub" }

channels:
  wblPlacementCompleted:
    address: chora.delivery.wbl.placement_completed.v1
    description: |
      Carries WblPlacementCompleted Protobuf payload.

      Downstream consumers:
        - chora-delivery (cert issuer) : credit hours toward cert
        - chora-consumption            : path progress
        - chora-notifications          : completion email
    messages:
      wblPlacementCompleted:
        $ref: "#/components/messages/WblPlacementCompleted"

operations:
  publishWblPlacementCompleted:
    action: send
    channel: { $ref: "#/channels/wblPlacementCompleted" }
    summary: "Publish WblPlacementCompleted"
    messages: [ { $ref: "#/channels/wblPlacementCompleted/messages/wblPlacementCompleted" } ]
  consumeWblPlacementCompleted:
    action: receive
    channel: { $ref: "#/channels/wblPlacementCompleted" }
    summary: "Consume WblPlacementCompleted"
    messages: [ { $ref: "#/channels/wblPlacementCompleted/messages/wblPlacementCompleted" } ]

components:
  messages:
    WblPlacementCompleted:
      name: WblPlacementCompleted
      title: "WBL Placement Completed"
      summary: "A WBL placement completed."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.WblPlacementCompleted."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          placement_id: { type: string, format: uuid }
          learner_gcid: { type: string }
          host_org_id: { type: string }
          mentor_gcid: { type: string }
          scheduled_start: { type: string, format: date-time }
          scheduled_end: { type: string, format: date-time }
          hours_completed: { type: number, format: float }
          completed_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
