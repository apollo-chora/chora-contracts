asyncapi: "3.0.0"
info:
  title: "chora.delivery.wbl.placement_created.v1"
  version: "1.0.0"
  description: |
    Published when a WBL placement is provisioned (learner + host + mentor
    assigned). Drives intro emails + workspace setup.
    Companion to `proto/events/delivery/wbl.proto` message `WblPlacementCreated`.

    Per ADR-129/130/131 collapse mandate, supersedes legacy `chora.wbl.*`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  wblPlacementCreated:
    address: chora.delivery.wbl.placement_created.v1
    description: |
      Carries WblPlacementCreated Protobuf payload.

      Downstream consumers:
        - chora-notifications : intro emails to learner + mentor
        - chora-delivery (workspace) : workspace provisioning
    messages:
      wblPlacementCreated:
        $ref: "#/components/messages/WblPlacementCreated"

operations:
  publishWblPlacementCreated:
    action: send
    channel: { $ref: "#/channels/wblPlacementCreated" }
    summary: "Publish WblPlacementCreated"
    messages: [ { $ref: "#/channels/wblPlacementCreated/messages/wblPlacementCreated" } ]
  consumeWblPlacementCreated:
    action: receive
    channel: { $ref: "#/channels/wblPlacementCreated" }
    summary: "Consume WblPlacementCreated"
    messages: [ { $ref: "#/channels/wblPlacementCreated/messages/wblPlacementCreated" } ]

components:
  messages:
    WblPlacementCreated:
      name: WblPlacementCreated
      title: "WBL Placement Created"
      summary: "A WBL placement was provisioned."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.WblPlacementCreated."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          placement_id: { type: string, format: uuid }
          learner_gcid: { type: string }
          host_org_id: { type: string }
          mentor_gcid: { type: string }
          scheduled_start: { type: string, format: date-time }
          scheduled_end: { type: string, format: date-time }
          created_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
