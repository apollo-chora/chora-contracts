asyncapi: "3.0.0"
info:
  title: "chora.delivery.wbl.placement_started.v1"
  version: "1.0.0"
  description: |
    Published on placement start. Marks the beginning of hours accrual.
    Companion to `proto/events/delivery/wbl.proto` message `WblPlacementStarted`.
  contact: { name: "Chora Platform Team" }
  license: { name: "Proprietary" }

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  wblPlacementStarted:
    address: chora.delivery.wbl.placement_started.v1
    description: |
      Carries WblPlacementStarted Protobuf payload.

      Downstream consumers:
        - chora-delivery (timesheet) : begin hours accrual
    messages:
      wblPlacementStarted:
        $ref: "#/components/messages/WblPlacementStarted"

operations:
  publishWblPlacementStarted:
    action: send
    channel: { $ref: "#/channels/wblPlacementStarted" }
    summary: "Publish WblPlacementStarted"
    messages: [ { $ref: "#/channels/wblPlacementStarted/messages/wblPlacementStarted" } ]
  consumeWblPlacementStarted:
    action: receive
    channel: { $ref: "#/channels/wblPlacementStarted" }
    summary: "Consume WblPlacementStarted"
    messages: [ { $ref: "#/channels/wblPlacementStarted/messages/wblPlacementStarted" } ]

components:
  messages:
    WblPlacementStarted:
      name: WblPlacementStarted
      title: "WBL Placement Started"
      summary: "A WBL placement started."
      contentType: application/x-protobuf
      payload:
        type: object
        description: "Mirrors chora.delivery.v1.WblPlacementStarted."
        properties:
          envelope: { $ref: "#/components/schemas/EventEnvelope" }
          placement_id: { type: string, format: uuid }
          learner_gcid: { type: string }
          host_org_id: { type: string }
          mentor_gcid: { type: string }
          scheduled_start: { type: string, format: date-time }
          scheduled_end: { type: string, format: date-time }
          started_at: { type: string, format: date-time }
  schemas:
    EventEnvelope:
      type: object
      description: "Mirrors chora.common.v1.EventEnvelope."
      required: [event_id, idempotency_key, tenant_id, occurred_at, published_at, traceparent, source_project, source_service, schema_version]
      properties:
        event_id: { type: string, format: uuid }
        idempotency_key: { type: string }
        tenant_id: { type: string }
        gcid: { type: string }
        occurred_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        traceparent: { type: string }
        tracestate: { type: string }
        source_project: { type: string }
        source_service: { type: string }
        schema_version: { type: integer }
        correlation_id: { type: string }
        causation_id: { type: string }
