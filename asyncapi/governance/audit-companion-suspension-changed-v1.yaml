asyncapi: 3.0.0
info:
  title: Chora Governance - CompanionSuspensionChanged (audit)
  version: 1.0.0
  description: |
    IMDA human-oversight trail for the Learning Companion containment control
    (ADR-252 D4; wire fields and placement in ADR-254 D4/D11). An O+ operator,
    or a tenant admin / owner for their own tenant, contains the companion
    platform-wide, per tenant, or per skill WITHOUT a deploy; chora-model-gateway
    reads the result uncached on every companion turn and refuses contained
    turns before any debit. Emitted by chora-observability through its outbox in
    the SAME transaction as the suspension row: one event per engage and one per
    release. Denied turns are NOT individually audited (counted + spanned at the
    gateway), so one platform-wide suspension never floods the hash-chained log.

    JSON-wire (ADR-254 D4): the body is the protojson of the message below,
    schema-less on the bus (topics.yaml `schema: null`); envelope fields ride
    in the Pub/Sub attributes AND in field 1. `"engaged": false` is emitted
    explicitly (EmitUnpopulated) so a release is never an absent field.

    - Domain: Governance (`chora_governance` DB) - producer: chora-observability
    - Topic: `chora.governance.audit.companion_suspension_changed.v1`
    - Source proto: `proto/events/governance/audit.proto`
       message `chora.governance.v1.CompanionSuspensionChanged`
    - Flat twin: `proto/events-flat/governance/audit/companion_suspension_changed.proto`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/json

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  companionSuspensionChanged:
    address: chora.governance.audit.companion_suspension_changed.v1
    messages:
      companionSuspensionChanged:
        $ref: '#/components/messages/CompanionSuspensionChanged'

operations:
  publishCompanionSuspensionChanged:
    action: send
    channel:
      $ref: '#/channels/companionSuspensionChanged'
    description: |
      chora-observability publishes one event per engage and one per release
      (PATCH /api/v1/admin/companion/suspension), written into outbox_events in
      the same transaction as the row; idempotent on the envelope
      idempotency_key = "<suspension_id>:<version>" (engage = 1, release = 2).
    messages:
      - $ref: '#/channels/companionSuspensionChanged/messages/companionSuspensionChanged'

  consumeCompanionSuspensionChanged:
    action: receive
    channel:
      $ref: '#/channels/companionSuspensionChanged'
    description: |
      Consumers: chora-governance audit ingest (hash-chained audit_log row,
      sibling of the external-egress audit; subscription
      chora-governance.audit-companion-suspension-changed) and chora-consumption
      (advisory projection rendering the learner-facing `paused` status,
      ADR-254 D11; subscription
      chora-consumption.governance-audit-companion-suspension-changed). The
      gateway stays the control; neither consumer enforces anything.
    messages:
      - $ref: '#/channels/companionSuspensionChanged/messages/companionSuspensionChanged'

components:
  messages:
    CompanionSuspensionChanged:
      name: CompanionSuspensionChanged
      title: Learning Companion containment engaged or released
      summary: One audit record per operator engage / release of a companion suspension
      contentType: application/json
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/governance/audit.proto#/chora.governance.v1.CompanionSuspensionChanged'
      examples:
        - name: tenantSkillEngaged
          summary: A tenant admin contains one skill in their tenant
          payload:
            envelope:
              eventId: "01990000-0000-7000-8000-0000000000ee"
              idempotencyKey: "01990000-0000-7000-8000-00000000c0de:1"
              tenantId: "11111111-1111-7111-8111-111111111111"
              gcid: "00000000-0000-7000-8000-000000001999"
              sourceService: "chora-observability"
              schemaVersion: 1
              choraImdaDimension: "fairness_and_human_oversight"
              imdaLifecycleStage: "runtime"
            suspensionId: "01990000-0000-7000-8000-00000000c0de"
            scope: "tenant"
            tenantId: "11111111-1111-7111-8111-111111111111"
            skillKey: "companion_chat_turn_basic"
            engaged: true
            version: 1
            reason: "persona drift reported by two learners"
            actorGcid: "00000000-0000-7000-8000-000000001999"
            changedAt: "2026-08-22T15:00:00Z"
