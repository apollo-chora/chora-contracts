asyncapi: 3.0.0
info:
  title: Chora Identity — AccountActivated
  version: 1.0.0
  description: |
    Published on first successful login (email verification / passkey
    enrolment complete).

    - Domain: Identity (`chora_identity` DB)
    - Topic: `chora.identity.account.activated.v1`
    - Source proto: `proto/events/identity/account.proto`
       message `chora.identity.v1.AccountActivated`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  accountActivated:
    address: chora.identity.account.activated.v1
    messages:
      accountActivated:
        $ref: '#/components/messages/AccountActivated'

operations:
  publishAccountActivated:
    action: send
    channel:
      $ref: '#/channels/accountActivated'
    messages:
      - $ref: '#/channels/accountActivated/messages/accountActivated'

  consumeAccountActivated:
    action: receive
    channel:
      $ref: '#/channels/accountActivated'
    description: |
      Consumers: Tenancy (entitlement resolution), Observability
      (activation funnel), Notifications.
    messages:
      - $ref: '#/channels/accountActivated/messages/accountActivated'

components:
  messages:
    AccountActivated:
      name: AccountActivated
      title: Account Activated
      summary: An Account has been activated (first login)
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/identity/account.proto#/chora.identity.v1.AccountActivated'
