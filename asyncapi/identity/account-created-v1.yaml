asyncapi: 3.0.0
info:
  title: Chora Identity — AccountCreated
  version: 1.0.0
  description: |
    Published when an Account record is provisioned (typically immediately
    after GcidIssued). Account holds PII fields (name, email, locale prefs);
    GCID is the opaque cross-tenant identifier.

    - Domain: Identity (`chora_identity` DB)
    - Topic: `chora.identity.account.created.v1`
    - Source proto: `proto/events/identity/account.proto`
       message `chora.identity.v1.AccountCreated`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  accountCreated:
    address: chora.identity.account.created.v1
    messages:
      accountCreated:
        $ref: '#/components/messages/AccountCreated'

operations:
  publishAccountCreated:
    action: send
    channel:
      $ref: '#/channels/accountCreated'
    messages:
      - $ref: '#/channels/accountCreated/messages/accountCreated'

  consumeAccountCreated:
    action: receive
    channel:
      $ref: '#/channels/accountCreated'
    description: |
      Consumers: Notifications (welcome email),
      AI Kernel (Companion persona init), Observability.
    messages:
      - $ref: '#/channels/accountCreated/messages/accountCreated'

components:
  messages:
    AccountCreated:
      name: AccountCreated
      title: Account Created
      summary: An Account record has been provisioned
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/identity/account.proto#/chora.identity.v1.AccountCreated'
