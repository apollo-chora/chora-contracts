asyncapi: 3.0.0
info:
  title: Chora Identity — AccountLifecycleChanged
  version: 1.0.0
  description: |
    Generic lifecycle transition event for the federated closure saga.
    Carries the full state transition (prior_state -> new_state) and is
    the canonical signal downstream domains subscribe to for federated
    pseudonymisation / crypto-shred orchestration.

    Covers: ACTIVE -> CLOSING -> SUSPENDED -> PSEUDONYMIZED -> COLD_ARCHIVED -> CRYPTO_SHREDDED

    Domains MUST subscribe and consult their local `PII_Closure_Map.yaml`
    to determine fields-to-tokenize / retention behaviour per state.

    - Domain: Identity (`chora_identity` DB)
    - Topic: `chora.identity.account.lifecycle_changed.v1`
    - Source proto: `proto/events/identity/account.proto`
       message `chora.identity.v1.AccountLifecycleChanged`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  accountLifecycleChanged:
    address: chora.identity.account.lifecycle_changed.v1
    messages:
      accountLifecycleChanged:
        $ref: '#/components/messages/AccountLifecycleChanged'

operations:
  publishAccountLifecycleChanged:
    action: send
    channel:
      $ref: '#/channels/accountLifecycleChanged'
    messages:
      - $ref: '#/channels/accountLifecycleChanged/messages/accountLifecycleChanged'

  consumeAccountLifecycleChanged:
    action: receive
    channel:
      $ref: '#/channels/accountLifecycleChanged'
    description: |
      Consumers: EVERY domain (Creation, Consumption, Delivery, Sharing,
      A2A, Tenancy, Governance, Observability, Notifications, AI Kernel)
      subscribes and triggers per-domain pseudonymisation per their
      PII_Closure_Map.yaml.
    messages:
      - $ref: '#/channels/accountLifecycleChanged/messages/accountLifecycleChanged'

components:
  messages:
    AccountLifecycleChanged:
      name: AccountLifecycleChanged
      title: Account Lifecycle Changed
      summary: Federated closure saga state transition
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/identity/account.proto#/chora.identity.v1.AccountLifecycleChanged'
