asyncapi: 3.0.0
info:
  title: Chora Identity — AccountSuspended
  version: 1.0.0
  description: |
    Published on admin-initiated suspension OR policy-driven (governance)
    suspension. Reversible until CLOSING / PSEUDONYMIZED transitions.

    - Domain: Identity (`chora_identity` DB)
    - Topic: `chora.identity.account.suspended.v1`
    - Source proto: `proto/events/identity/account.proto`
       message `chora.identity.v1.AccountSuspended`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  accountSuspended:
    address: chora.identity.account.suspended.v1
    messages:
      accountSuspended:
        $ref: '#/components/messages/AccountSuspended'

operations:
  publishAccountSuspended:
    action: send
    channel:
      $ref: '#/channels/accountSuspended'
    messages:
      - $ref: '#/channels/accountSuspended/messages/accountSuspended'

  consumeAccountSuspended:
    action: receive
    channel:
      $ref: '#/channels/accountSuspended'
    description: |
      Consumers: ALL surfaces (revoke active sessions),
      Notifications (suspension notice), Audit log.
    messages:
      - $ref: '#/channels/accountSuspended/messages/accountSuspended'

components:
  messages:
    AccountSuspended:
      name: AccountSuspended
      title: Account Suspended
      summary: An Account has been suspended (reversible)
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/identity/account.proto#/chora.identity.v1.AccountSuspended'
