asyncapi: 3.0.0
info:
  title: Chora Identity — UserManaDebited
  version: 1.0.0
  description: |
    Published when mana is debited for a Companion action (e.g., chat,
    question generation, coach session). May produce MULTIPLE debit
    events for a single action when subsidy + personal balance are both
    touched (deterministic FIFO spend order per ADR-142).

    HIGH-VOLUME topic. Consumers MUST be idempotent on entry_id and
    SHOULD batch-aggregate at the BigQuery streaming layer.

    - Domain: Identity (`chora_identity` DB)
    - Topic: `chora.identity.user_mana.debited.v1`
    - Source proto: `proto/events/identity/user_mana.proto`
       message `chora.identity.v1.UserManaDebited`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  userManaDebited:
    address: chora.identity.user_mana.debited.v1
    messages:
      userManaDebited:
        $ref: '#/components/messages/UserManaDebited'

operations:
  publishUserManaDebited:
    action: send
    channel:
      $ref: '#/channels/userManaDebited'
    messages:
      - $ref: '#/channels/userManaDebited/messages/userManaDebited'

  consumeUserManaDebited:
    action: receive
    channel:
      $ref: '#/channels/userManaDebited'
    description: |
      Consumers: Observability (mana spend dashboards + per-action
      cost analysis), BigQuery streaming, Tenancy (mark
      TenantManaAllocation `claimed` when source_allocation_id set),
      AI Kernel (cost-tracking dual-axis ledger correlation).
    messages:
      - $ref: '#/channels/userManaDebited/messages/userManaDebited'

components:
  messages:
    UserManaDebited:
      name: UserManaDebited
      title: User Mana Debited
      summary: Mana has been debited from a user's wallet (Companion action)
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/identity/user_mana.proto#/chora.identity.v1.UserManaDebited'
