asyncapi: 3.0.0
info:
  title: Chora Notifications — EmailDelivered
  version: 1.0.0
  description: |
    Published from SendGrid webhook "delivered" event — final positive
    outcome.

    - Domain: Notifications (`chora_notifications` DB)
    - Topic: `chora.notifications.email.delivered.v1`
    - Source proto: `proto/events/notifications/email.proto`
       message `chora.notifications.v1.EmailDelivered`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  emailDelivered:
    address: chora.notifications.email.delivered.v1
    messages:
      emailDelivered:
        $ref: '#/components/messages/EmailDelivered'

operations:
  publishEmailDelivered:
    action: send
    channel:
      $ref: '#/channels/emailDelivered'
    messages:
      - $ref: '#/channels/emailDelivered/messages/emailDelivered'

  consumeEmailDelivered:
    action: receive
    channel:
      $ref: '#/channels/emailDelivered'
    description: |
      Consumers: Observability (deliverability KPI), Audit log.
    messages:
      - $ref: '#/channels/emailDelivered/messages/emailDelivered'

components:
  messages:
    EmailDelivered:
      name: EmailDelivered
      title: Email Delivered
      summary: An email has been delivered to the recipient mailbox
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/notifications/email.proto#/chora.notifications.v1.EmailDelivered'
