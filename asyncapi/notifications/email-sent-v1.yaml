asyncapi: 3.0.0
info:
  title: Chora Notifications — EmailSent
  version: 1.0.0
  description: |
    Published when SendGrid accepts the email for delivery (HTTP 202 from
    SendGrid v3 API). Carries sendgrid_message_id for downstream
    correlation with delivered / bounced events.

    - Domain: Notifications (`chora_notifications` DB)
    - Topic: `chora.notifications.email.sent.v1`
    - Source proto: `proto/events/notifications/email.proto`
       message `chora.notifications.v1.EmailSent`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  emailSent:
    address: chora.notifications.email.sent.v1
    messages:
      emailSent:
        $ref: '#/components/messages/EmailSent'

operations:
  publishEmailSent:
    action: send
    channel:
      $ref: '#/channels/emailSent'
    messages:
      - $ref: '#/channels/emailSent/messages/emailSent'

  consumeEmailSent:
    action: receive
    channel:
      $ref: '#/channels/emailSent'
    description: |
      Consumers: Notifications event tracker, Observability (delivery KPI).
    messages:
      - $ref: '#/channels/emailSent/messages/emailSent'

components:
  messages:
    EmailSent:
      name: EmailSent
      title: Email Sent
      summary: An email has been accepted by SendGrid for delivery
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/notifications/email.proto#/chora.notifications.v1.EmailSent'
