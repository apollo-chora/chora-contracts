asyncapi: 3.0.0
info:
  title: Chora Notifications — PushFailed
  version: 1.0.0
  description: |
    Published when FCM rejects the push (invalid token, quota exceeded,
    payload too large). Persistent UNREGISTERED / INVALID_ARGUMENT
    failures should mark the FCM token as inactive.

    - Domain: Notifications (`chora_notifications` DB)
    - Topic: `chora.notifications.push.failed.v1`
    - Source proto: `proto/events/notifications/push.proto`
       message `chora.notifications.v1.PushFailed`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  pushFailed:
    address: chora.notifications.push.failed.v1
    messages:
      pushFailed:
        $ref: '#/components/messages/PushFailed'

operations:
  publishPushFailed:
    action: send
    channel:
      $ref: '#/channels/pushFailed'
    messages:
      - $ref: '#/channels/pushFailed/messages/pushFailed'

  consumePushFailed:
    action: receive
    channel:
      $ref: '#/channels/pushFailed'
    description: |
      Consumers: Notifications token cleanup, Observability (failure KPI).
    messages:
      - $ref: '#/channels/pushFailed/messages/pushFailed'

components:
  messages:
    PushFailed:
      name: PushFailed
      title: Push Failed
      summary: A push notification dispatch has failed
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/notifications/push.proto#/chora.notifications.v1.PushFailed'
