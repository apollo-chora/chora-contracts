asyncapi: 3.0.0
info:
  title: Chora Notifications — PushQueued
  version: 1.0.0
  description: |
    Published when a push notification is enqueued for FCM dispatch.
    FCM token is hashed (SHA-256) — plaintext token NEVER leaves
    chora_notifications.

    - Domain: Notifications (`chora_notifications` DB)
    - Topic: `chora.notifications.push.queued.v1`
    - Source proto: `proto/events/notifications/push.proto`
       message `chora.notifications.v1.PushQueued`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  pushQueued:
    address: chora.notifications.push.queued.v1
    messages:
      pushQueued:
        $ref: '#/components/messages/PushQueued'

operations:
  publishPushQueued:
    action: send
    channel:
      $ref: '#/channels/pushQueued'
    messages:
      - $ref: '#/channels/pushQueued/messages/pushQueued'

  consumePushQueued:
    action: receive
    channel:
      $ref: '#/channels/pushQueued'
    description: |
      Consumers: Notifications FCM dispatcher, Observability.
    messages:
      - $ref: '#/channels/pushQueued/messages/pushQueued'

components:
  messages:
    PushQueued:
      name: PushQueued
      title: Push Queued
      summary: A push notification has been enqueued for FCM
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/notifications/push.proto#/chora.notifications.v1.PushQueued'
