asyncapi: 3.0.0
info:
  title: Chora Payments — ApplicationPaymentExpired
  version: 1.0.0
  description: |
    Stripe `checkout.session.expired` for an unpaid application
    Checkout. chora-delivery closes the in-progress payment intent.

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.application_payment.expired.v1`
    - Source proto: `proto/events/payments/application_payment.proto`
       message `chora.payments.v1.ApplicationPaymentExpired`
    - Aggregate: ApplicationPayment
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  applicationPaymentExpired:
    address: chora.payments.application_payment.expired.v1
    messages:
      applicationPaymentExpired:
        $ref: '#/components/messages/ApplicationPaymentExpired'

operations:
  publishApplicationPaymentExpired:
    action: send
    channel:
      $ref: '#/channels/applicationPaymentExpired'
    messages:
      - $ref: '#/channels/applicationPaymentExpired/messages/applicationPaymentExpired'

  consumeApplicationPaymentExpired:
    action: receive
    channel:
      $ref: '#/channels/applicationPaymentExpired'
    messages:
      - $ref: '#/channels/applicationPaymentExpired/messages/applicationPaymentExpired'

components:
  messages:
    ApplicationPaymentExpired:
      name: ApplicationPaymentExpired
      title: Stripe Checkout Session expired for a course-application payment
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/payments/application_payment.proto#/chora.payments.v1.ApplicationPaymentExpired'
