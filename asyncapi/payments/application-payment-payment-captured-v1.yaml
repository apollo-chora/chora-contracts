asyncapi: 3.0.0
info:
  title: Chora Payments — ApplicationPaymentPaymentCaptured
  version: 1.0.0
  description: |
    Stripe payment captured — chora-delivery's existing
    `subscribers.go::HandlePaymentCaptured` consumes (rewired from the
    legacy `chora.tenancy.payment.captured.v1` topic) and advances
    the Application aggregate Accepted → Paid → Enrolled.

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.application_payment.payment_captured.v1`
    - Source proto: `proto/events/payments/application_payment.proto`
       message `chora.payments.v1.ApplicationPaymentPaymentCaptured`
    - Aggregate: ApplicationPayment
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  applicationPaymentPaymentCaptured:
    address: chora.payments.application_payment.payment_captured.v1
    messages:
      applicationPaymentPaymentCaptured:
        $ref: '#/components/messages/ApplicationPaymentPaymentCaptured'

operations:
  publishApplicationPaymentPaymentCaptured:
    action: send
    channel:
      $ref: '#/channels/applicationPaymentPaymentCaptured'
    messages:
      - $ref: '#/channels/applicationPaymentPaymentCaptured/messages/applicationPaymentPaymentCaptured'

  consumeApplicationPaymentPaymentCaptured:
    action: receive
    channel:
      $ref: '#/channels/applicationPaymentPaymentCaptured'
    messages:
      - $ref: '#/channels/applicationPaymentPaymentCaptured/messages/applicationPaymentPaymentCaptured'

components:
  messages:
    ApplicationPaymentPaymentCaptured:
      name: ApplicationPaymentPaymentCaptured
      title: Stripe payment confirmed for a course application
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/payments/application_payment.proto#/chora.payments.v1.ApplicationPaymentPaymentCaptured'
