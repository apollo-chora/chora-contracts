asyncapi: 3.0.0
info:
  title: Chora Payments — CompanionEggPurchaseCheckoutStarted
  version: 1.0.0
  description: |
    chora-payments created a Stripe Checkout Session for a Companion-egg
    purchase per ADR-149. Free-egg paths (trial / subscription_inclusion /
    tenant_grant) DO NOT flow through this event — they go straight to
    `chora.consumption.companion.egg_purchased.v1`.

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.companion_egg_purchase.checkout_started.v1`
    - Source proto: `proto/events/payments/companion_egg_purchase.proto`
       message `chora.payments.v1.CompanionEggPurchaseCheckoutStarted`
    - Aggregate: CompanionEggPurchase
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  companionEggPurchaseCheckoutStarted:
    address: chora.payments.companion_egg_purchase.checkout_started.v1
    messages:
      companionEggPurchaseCheckoutStarted:
        $ref: '#/components/messages/CompanionEggPurchaseCheckoutStarted'

operations:
  publishCompanionEggPurchaseCheckoutStarted:
    action: send
    channel:
      $ref: '#/channels/companionEggPurchaseCheckoutStarted'
    messages:
      - $ref: '#/channels/companionEggPurchaseCheckoutStarted/messages/companionEggPurchaseCheckoutStarted'

  consumeCompanionEggPurchaseCheckoutStarted:
    action: receive
    channel:
      $ref: '#/channels/companionEggPurchaseCheckoutStarted'
    messages:
      - $ref: '#/channels/companionEggPurchaseCheckoutStarted/messages/companionEggPurchaseCheckoutStarted'

components:
  messages:
    CompanionEggPurchaseCheckoutStarted:
      name: CompanionEggPurchaseCheckoutStarted
      title: Stripe Checkout Session created for a Companion-egg purchase (ADR-149)
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/payments/companion_egg_purchase.proto#/chora.payments.v1.CompanionEggPurchaseCheckoutStarted'
