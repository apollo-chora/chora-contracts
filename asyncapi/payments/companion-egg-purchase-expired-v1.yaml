asyncapi: 3.0.0
info:
  title: Chora Payments — CompanionEggPurchaseExpired
  version: 1.0.0
  description: |
    Stripe `checkout.session.expired` — distinct from the ADR-149
    60-day post-purchase hard-expiry (that one fires `refunded.v1`
    with `reason=expired_unhatched`).

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.companion_egg_purchase.expired.v1`
    - Source proto: `proto/events/payments/companion_egg_purchase.proto`
       message `chora.payments.v1.CompanionEggPurchaseExpired`
    - Aggregate: CompanionEggPurchase
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  companionEggPurchaseExpired:
    address: chora.payments.companion_egg_purchase.expired.v1
    messages:
      companionEggPurchaseExpired:
        $ref: '#/components/messages/CompanionEggPurchaseExpired'

operations:
  publishCompanionEggPurchaseExpired:
    action: send
    channel:
      $ref: '#/channels/companionEggPurchaseExpired'
    messages:
      - $ref: '#/channels/companionEggPurchaseExpired/messages/companionEggPurchaseExpired'

  consumeCompanionEggPurchaseExpired:
    action: receive
    channel:
      $ref: '#/channels/companionEggPurchaseExpired'
    messages:
      - $ref: '#/channels/companionEggPurchaseExpired/messages/companionEggPurchaseExpired'

components:
  messages:
    CompanionEggPurchaseExpired:
      name: CompanionEggPurchaseExpired
      title: Stripe Checkout Session expired for a Companion-egg purchase
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/payments/companion_egg_purchase.proto#/chora.payments.v1.CompanionEggPurchaseExpired'
