asyncapi: 3.0.0
info:
  title: Chora Payments — CompanionEggPurchasePaymentCaptured
  version: 1.0.0
  description: |
    Stripe `checkout.session.completed` — chora-tenancy advances the
    CompanionEggPurchase aggregate to PAID + emits
    `chora.consumption.companion.egg_purchased.v1` for chora-consumption
    to provision the Stage-0 `companion_instances` row.

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.companion_egg_purchase.payment_captured.v1`
    - Source proto: `proto/events/payments/companion_egg_purchase.proto`
       message `chora.payments.v1.CompanionEggPurchasePaymentCaptured`
    - Aggregate: CompanionEggPurchase
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  companionEggPurchasePaymentCaptured:
    address: chora.payments.companion_egg_purchase.payment_captured.v1
    messages:
      companionEggPurchasePaymentCaptured:
        $ref: '#/components/messages/CompanionEggPurchasePaymentCaptured'

operations:
  publishCompanionEggPurchasePaymentCaptured:
    action: send
    channel:
      $ref: '#/channels/companionEggPurchasePaymentCaptured'
    messages:
      - $ref: '#/channels/companionEggPurchasePaymentCaptured/messages/companionEggPurchasePaymentCaptured'

  consumeCompanionEggPurchasePaymentCaptured:
    action: receive
    channel:
      $ref: '#/channels/companionEggPurchasePaymentCaptured'
    messages:
      - $ref: '#/channels/companionEggPurchasePaymentCaptured/messages/companionEggPurchasePaymentCaptured'

components:
  messages:
    CompanionEggPurchasePaymentCaptured:
      name: CompanionEggPurchasePaymentCaptured
      title: Stripe payment confirmed for a Companion-egg purchase (ADR-149)
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/payments/companion_egg_purchase.proto#/chora.payments.v1.CompanionEggPurchasePaymentCaptured'
