asyncapi: 3.0.0
info:
  title: Chora Payments — CompanionEggPurchaseRefunded
  version: 1.0.0
  description: |
    Stripe `charge.refunded` — chora-tenancy marks the egg purchase
    voided and chora-consumption frees the Companion slot. Includes the
    ADR-149 60-day hard-expiry auto-refund-credit path (`reason=
    expired_unhatched`, `credit_only=true`).

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.companion_egg_purchase.refunded.v1`
    - Source proto: `proto/events/payments/companion_egg_purchase.proto`
       message `chora.payments.v1.CompanionEggPurchaseRefunded`
    - Aggregate: CompanionEggPurchase
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  companionEggPurchaseRefunded:
    address: chora.payments.companion_egg_purchase.refunded.v1
    messages:
      companionEggPurchaseRefunded:
        $ref: '#/components/messages/CompanionEggPurchaseRefunded'

operations:
  publishCompanionEggPurchaseRefunded:
    action: send
    channel:
      $ref: '#/channels/companionEggPurchaseRefunded'
    messages:
      - $ref: '#/channels/companionEggPurchaseRefunded/messages/companionEggPurchaseRefunded'

  consumeCompanionEggPurchaseRefunded:
    action: receive
    channel:
      $ref: '#/channels/companionEggPurchaseRefunded'
    messages:
      - $ref: '#/channels/companionEggPurchaseRefunded/messages/companionEggPurchaseRefunded'

components:
  messages:
    CompanionEggPurchaseRefunded:
      name: CompanionEggPurchaseRefunded
      title: Stripe refund issued for a Companion-egg purchase (incl. ADR-149 hard-expiry)
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/payments/companion_egg_purchase.proto#/chora.payments.v1.CompanionEggPurchaseRefunded'
