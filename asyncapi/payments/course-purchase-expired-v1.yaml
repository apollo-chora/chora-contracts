asyncapi: 3.0.0
info:
  title: Chora Payments — CoursePurchaseExpired
  version: 1.0.0
  description: |
    Stripe `checkout.session.expired` (learner abandoned the Checkout
    past Stripe's 24h window) or chora-payments expiry sweeper marked a
    stuck `checkout_started` row as expired. Funnel abandonment signal.

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.course_purchase.expired.v1`
    - Source proto: `proto/events/payments/course_purchase.proto`
       message `chora.payments.v1.CoursePurchaseExpired`
    - Aggregate: CoursePurchase
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  coursePurchaseExpired:
    address: chora.payments.course_purchase.expired.v1
    messages:
      coursePurchaseExpired:
        $ref: '#/components/messages/CoursePurchaseExpired'

operations:
  publishCoursePurchaseExpired:
    action: send
    channel:
      $ref: '#/channels/coursePurchaseExpired'
    messages:
      - $ref: '#/channels/coursePurchaseExpired/messages/coursePurchaseExpired'

  consumeCoursePurchaseExpired:
    action: receive
    channel:
      $ref: '#/channels/coursePurchaseExpired'
    messages:
      - $ref: '#/channels/coursePurchaseExpired/messages/coursePurchaseExpired'

components:
  messages:
    CoursePurchaseExpired:
      name: CoursePurchaseExpired
      title: Stripe Checkout Session expired for a course-enrolment purchase
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/payments/course_purchase.proto#/chora.payments.v1.CoursePurchaseExpired'
