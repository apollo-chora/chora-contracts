asyncapi: 3.0.0
info:
  title: Chora Payments — CoursePurchasePaymentFailed
  version: 1.0.0
  description: |
    Stripe `payment_intent.payment_failed` or
    `checkout.session.async_payment_failed` — chora-delivery does NOT
    provision an enrolment for this purchase.

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.course_purchase.payment_failed.v1`
    - Source proto: `proto/events/payments/course_purchase.proto`
       message `chora.payments.v1.CoursePurchasePaymentFailed`
    - Aggregate: CoursePurchase
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  coursePurchasePaymentFailed:
    address: chora.payments.course_purchase.payment_failed.v1
    messages:
      coursePurchasePaymentFailed:
        $ref: '#/components/messages/CoursePurchasePaymentFailed'

operations:
  publishCoursePurchasePaymentFailed:
    action: send
    channel:
      $ref: '#/channels/coursePurchasePaymentFailed'
    messages:
      - $ref: '#/channels/coursePurchasePaymentFailed/messages/coursePurchasePaymentFailed'

  consumeCoursePurchasePaymentFailed:
    action: receive
    channel:
      $ref: '#/channels/coursePurchasePaymentFailed'
    messages:
      - $ref: '#/channels/coursePurchasePaymentFailed/messages/coursePurchasePaymentFailed'

components:
  messages:
    CoursePurchasePaymentFailed:
      name: CoursePurchasePaymentFailed
      title: Stripe reported a payment failure for a course-enrolment Checkout
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/payments/course_purchase.proto#/chora.payments.v1.CoursePurchasePaymentFailed'
