asyncapi: 3.0.0
info:
  title: Chora Payments — CoursePurchaseRefunded
  version: 1.0.0
  description: |
    Stripe `charge.refunded` — chora-delivery revokes the enrolment if
    one was created. Triggered by support, customer request, duplicate
    charge, or fraud chargeback.

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.course_purchase.refunded.v1`
    - Source proto: `proto/events/payments/course_purchase.proto`
       message `chora.payments.v1.CoursePurchaseRefunded`
    - Aggregate: CoursePurchase
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  coursePurchaseRefunded:
    address: chora.payments.course_purchase.refunded.v1
    messages:
      coursePurchaseRefunded:
        $ref: '#/components/messages/CoursePurchaseRefunded'

operations:
  publishCoursePurchaseRefunded:
    action: send
    channel:
      $ref: '#/channels/coursePurchaseRefunded'
    messages:
      - $ref: '#/channels/coursePurchaseRefunded/messages/coursePurchaseRefunded'

  consumeCoursePurchaseRefunded:
    action: receive
    channel:
      $ref: '#/channels/coursePurchaseRefunded'
    messages:
      - $ref: '#/channels/coursePurchaseRefunded/messages/coursePurchaseRefunded'

components:
  messages:
    CoursePurchaseRefunded:
      name: CoursePurchaseRefunded
      title: Stripe refund issued for a course-enrolment payment
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/payments/course_purchase.proto#/chora.payments.v1.CoursePurchaseRefunded'
