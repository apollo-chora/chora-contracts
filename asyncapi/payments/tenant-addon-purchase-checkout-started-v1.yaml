asyncapi: 3.0.0
info:
  title: Chora Payments — TenantAddonPurchaseCheckoutStarted
  version: 1.0.0
  description: |
    chora-payments created a Stripe Checkout Session for a H+ Marketplace
    tenant-add-on subscription; the FE will redirect the browser to
    Stripe-hosted Checkout. The tenant admin has NOT yet paid.
    Pre-fulfilment funnel telemetry.

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.tenant_addon_purchase.checkout_started.v1`
    - Source proto: `proto/events/payments/tenant_addon_purchase.proto`
       message `chora.payments.v1.TenantAddonPurchaseCheckoutStarted`
    - Aggregate: TenantAddonPurchase (CHO-1736 H+ Marketplace Subscribe)
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  tenantAddonPurchaseCheckoutStarted:
    address: chora.payments.tenant_addon_purchase.checkout_started.v1
    messages:
      tenantAddonPurchaseCheckoutStarted:
        $ref: '#/components/messages/TenantAddonPurchaseCheckoutStarted'

operations:
  publishTenantAddonPurchaseCheckoutStarted:
    action: send
    channel:
      $ref: '#/channels/tenantAddonPurchaseCheckoutStarted'
    messages:
      - $ref: '#/channels/tenantAddonPurchaseCheckoutStarted/messages/tenantAddonPurchaseCheckoutStarted'

  consumeTenantAddonPurchaseCheckoutStarted:
    action: receive
    channel:
      $ref: '#/channels/tenantAddonPurchaseCheckoutStarted'
    messages:
      - $ref: '#/channels/tenantAddonPurchaseCheckoutStarted/messages/tenantAddonPurchaseCheckoutStarted'

components:
  messages:
    TenantAddonPurchaseCheckoutStarted:
      name: TenantAddonPurchaseCheckoutStarted
      title: Stripe Checkout Session created for a H+ Marketplace tenant-add-on subscription (CHO-1736)
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/payments/tenant_addon_purchase.proto#/chora.payments.v1.TenantAddonPurchaseCheckoutStarted'
