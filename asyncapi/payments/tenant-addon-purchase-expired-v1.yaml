asyncapi: 3.0.0
info:
  title: Chora Payments — TenantAddonPurchaseExpired
  version: 1.0.0
  description: |
    chora-payments observed Stripe `checkout.session.expired` for a H+
    Marketplace tenant-add-on subscription (Session abandoned past
    Stripe's 24-hour window without payment) OR the chora-payments
    expiry sweeper marked a stuck `checkout_started` row as expired.

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.tenant_addon_purchase.expired.v1`
    - Source proto: `proto/events/payments/tenant_addon_purchase.proto`
       message `chora.payments.v1.TenantAddonPurchaseExpired`
    - Aggregate: TenantAddonPurchase (CHO-1736 H+ Marketplace Subscribe)
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  tenantAddonPurchaseExpired:
    address: chora.payments.tenant_addon_purchase.expired.v1
    messages:
      tenantAddonPurchaseExpired:
        $ref: '#/components/messages/TenantAddonPurchaseExpired'

operations:
  publishTenantAddonPurchaseExpired:
    action: send
    channel:
      $ref: '#/channels/tenantAddonPurchaseExpired'
    messages:
      - $ref: '#/channels/tenantAddonPurchaseExpired/messages/tenantAddonPurchaseExpired'

  consumeTenantAddonPurchaseExpired:
    action: receive
    channel:
      $ref: '#/channels/tenantAddonPurchaseExpired'
    messages:
      - $ref: '#/channels/tenantAddonPurchaseExpired/messages/tenantAddonPurchaseExpired'

components:
  messages:
    TenantAddonPurchaseExpired:
      name: TenantAddonPurchaseExpired
      title: Stripe Checkout Session expired for a H+ Marketplace tenant-add-on subscription (CHO-1736)
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/payments/tenant_addon_purchase.proto#/chora.payments.v1.TenantAddonPurchaseExpired'
