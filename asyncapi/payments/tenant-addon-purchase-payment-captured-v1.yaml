asyncapi: 3.0.0
info:
  title: Chora Payments — TenantAddonPurchasePaymentCaptured
  version: 1.0.0
  description: |
    chora-payments observed Stripe `checkout.session.completed` for a
    H+ Marketplace tenant-add-on subscription; the tenant has paid.
    PRIMARY consumer is chora-tenancy, which flips the `AddonSubscription`
    aggregate to ACTIVE + emits `chora.tenancy.tenant_addon.activated.v1`.

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.tenant_addon_purchase.payment_captured.v1`
    - Source proto: `proto/events/payments/tenant_addon_purchase.proto`
       message `chora.payments.v1.TenantAddonPurchasePaymentCaptured`
    - Aggregate: TenantAddonPurchase (CHO-1736 H+ Marketplace Subscribe)
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  tenantAddonPurchasePaymentCaptured:
    address: chora.payments.tenant_addon_purchase.payment_captured.v1
    messages:
      tenantAddonPurchasePaymentCaptured:
        $ref: '#/components/messages/TenantAddonPurchasePaymentCaptured'

operations:
  publishTenantAddonPurchasePaymentCaptured:
    action: send
    channel:
      $ref: '#/channels/tenantAddonPurchasePaymentCaptured'
    messages:
      - $ref: '#/channels/tenantAddonPurchasePaymentCaptured/messages/tenantAddonPurchasePaymentCaptured'

  consumeTenantAddonPurchasePaymentCaptured:
    action: receive
    channel:
      $ref: '#/channels/tenantAddonPurchasePaymentCaptured'
    messages:
      - $ref: '#/channels/tenantAddonPurchasePaymentCaptured/messages/tenantAddonPurchasePaymentCaptured'

components:
  messages:
    TenantAddonPurchasePaymentCaptured:
      name: TenantAddonPurchasePaymentCaptured
      title: Stripe payment captured for a H+ Marketplace tenant-add-on subscription (CHO-1736)
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/payments/tenant_addon_purchase.proto#/chora.payments.v1.TenantAddonPurchasePaymentCaptured'
