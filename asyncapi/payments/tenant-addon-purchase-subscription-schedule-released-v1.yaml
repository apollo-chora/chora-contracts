asyncapi: 3.0.0
info:
  title: Chora Payments — TenantAddonPurchaseSubscriptionScheduleReleased
  version: 1.0.0
  description: |
    chora-payments observed Stripe `subscription_schedule.released` for a
    H+ Marketplace tenant-add-on's deferred (end-of-cycle) tier change.
    The Schedule's Phase 1 activated at the cycle anchor; Stripe drops
    the Schedule + the underlying Subscription continues at the new
    Price. chora-payments' dispatcher already promoted ScheduledTierCode
    → TierCode on its local TAP row. This event lets chora-tenancy call
    SubscriptionRegistry.PromoteScheduledTier so the in-memory registry
    + /h/addons render the new current tier without a restart.

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.tenant_addon_purchase.subscription_schedule_released.v1`
    - Source proto: `proto/events/payments/tenant_addon_purchase.proto`
       message `chora.payments.v1.TenantAddonPurchaseSubscriptionScheduleReleased`
    - Aggregate: TenantAddonPurchase (CHO-1736 H+ Marketplace Subscribe)
    - CHO-1772 + CHO-1779 — Stripe SubscriptionSchedule lifecycle.
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  tenantAddonPurchaseSubscriptionScheduleReleased:
    address: chora.payments.tenant_addon_purchase.subscription_schedule_released.v1
    messages:
      tenantAddonPurchaseSubscriptionScheduleReleased:
        $ref: '#/components/messages/TenantAddonPurchaseSubscriptionScheduleReleased'

operations:
  publishTenantAddonPurchaseSubscriptionScheduleReleased:
    action: send
    channel:
      $ref: '#/channels/tenantAddonPurchaseSubscriptionScheduleReleased'
    messages:
      - $ref: '#/channels/tenantAddonPurchaseSubscriptionScheduleReleased/messages/tenantAddonPurchaseSubscriptionScheduleReleased'

  consumeTenantAddonPurchaseSubscriptionScheduleReleased:
    action: receive
    channel:
      $ref: '#/channels/tenantAddonPurchaseSubscriptionScheduleReleased'
    messages:
      - $ref: '#/channels/tenantAddonPurchaseSubscriptionScheduleReleased/messages/tenantAddonPurchaseSubscriptionScheduleReleased'

components:
  messages:
    TenantAddonPurchaseSubscriptionScheduleReleased:
      name: TenantAddonPurchaseSubscriptionScheduleReleased
      title: Stripe SubscriptionSchedule released — deferred tier change activated (CHO-1779)
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/payments/tenant_addon_purchase.proto#/chora.payments.v1.TenantAddonPurchaseSubscriptionScheduleReleased'
