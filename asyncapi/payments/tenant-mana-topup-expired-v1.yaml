asyncapi: 3.0.0
info:
  title: Chora Payments — TenantManaTopUpExpired
  version: 1.0.0
  description: |
    Stripe `checkout.session.expired` — admin abandoned the
    Checkout flow past Stripe's 24h window.

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.tenant_mana_topup.expired.v1`
    - Source proto: `proto/events/payments/tenant_mana_topup.proto`
       message `chora.payments.v1.TenantManaTopUpExpired`
    - Aggregate: TenantManaTopUp
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  tenantManaTopUpExpired:
    address: chora.payments.tenant_mana_topup.expired.v1
    messages:
      tenantManaTopUpExpired:
        $ref: '#/components/messages/TenantManaTopUpExpired'

operations:
  publishTenantManaTopUpExpired:
    action: send
    channel:
      $ref: '#/channels/tenantManaTopUpExpired'
    messages:
      - $ref: '#/channels/tenantManaTopUpExpired/messages/tenantManaTopUpExpired'

  consumeTenantManaTopUpExpired:
    action: receive
    channel:
      $ref: '#/channels/tenantManaTopUpExpired'
    messages:
      - $ref: '#/channels/tenantManaTopUpExpired/messages/tenantManaTopUpExpired'

components:
  messages:
    TenantManaTopUpExpired:
      name: TenantManaTopUpExpired
      title: Stripe Checkout Session expired for a tenant mana pool top-up
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/payments/tenant_mana_topup.proto#/chora.payments.v1.TenantManaTopUpExpired'
