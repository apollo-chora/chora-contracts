asyncapi: 3.0.0
info:
  title: Chora Payments — TenantManaTopUpPaymentCaptured
  version: 1.0.0
  description: |
    Stripe payment captured — chora-tenancy credits
    `tenant_mana_pool.balance_units += mana_units` and emits the legacy
    bridge `chora.tenancy.tenant_mana_pool.topped_up.v1` for downstream
    consumers during the 1-release rollback window (ADR-164 Stage G).

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.tenant_mana_topup.payment_captured.v1`
    - Source proto: `proto/events/payments/tenant_mana_topup.proto`
       message `chora.payments.v1.TenantManaTopUpPaymentCaptured`
    - Aggregate: TenantManaTopUp
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  tenantManaTopUpPaymentCaptured:
    address: chora.payments.tenant_mana_topup.payment_captured.v1
    messages:
      tenantManaTopUpPaymentCaptured:
        $ref: '#/components/messages/TenantManaTopUpPaymentCaptured'

operations:
  publishTenantManaTopUpPaymentCaptured:
    action: send
    channel:
      $ref: '#/channels/tenantManaTopUpPaymentCaptured'
    messages:
      - $ref: '#/channels/tenantManaTopUpPaymentCaptured/messages/tenantManaTopUpPaymentCaptured'

  consumeTenantManaTopUpPaymentCaptured:
    action: receive
    channel:
      $ref: '#/channels/tenantManaTopUpPaymentCaptured'
    messages:
      - $ref: '#/channels/tenantManaTopUpPaymentCaptured/messages/tenantManaTopUpPaymentCaptured'

components:
  messages:
    TenantManaTopUpPaymentCaptured:
      name: TenantManaTopUpPaymentCaptured
      title: Stripe payment confirmed for a tenant mana pool top-up
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/payments/tenant_mana_topup.proto#/chora.payments.v1.TenantManaTopUpPaymentCaptured'
