asyncapi: 3.0.0
info:
  title: Chora Payments — TenantManaTopUpRefunded
  version: 1.0.0
  description: |
    Stripe `charge.refunded` — chora-tenancy debits
    `tenant_mana_pool.balance_units` proportionally to the refund.

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.tenant_mana_topup.refunded.v1`
    - Source proto: `proto/events/payments/tenant_mana_topup.proto`
       message `chora.payments.v1.TenantManaTopUpRefunded`
    - Aggregate: TenantManaTopUp
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  tenantManaTopUpRefunded:
    address: chora.payments.tenant_mana_topup.refunded.v1
    messages:
      tenantManaTopUpRefunded:
        $ref: '#/components/messages/TenantManaTopUpRefunded'

operations:
  publishTenantManaTopUpRefunded:
    action: send
    channel:
      $ref: '#/channels/tenantManaTopUpRefunded'
    messages:
      - $ref: '#/channels/tenantManaTopUpRefunded/messages/tenantManaTopUpRefunded'

  consumeTenantManaTopUpRefunded:
    action: receive
    channel:
      $ref: '#/channels/tenantManaTopUpRefunded'
    messages:
      - $ref: '#/channels/tenantManaTopUpRefunded/messages/tenantManaTopUpRefunded'

components:
  messages:
    TenantManaTopUpRefunded:
      name: TenantManaTopUpRefunded
      title: Stripe refund issued for a tenant mana pool top-up
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/payments/tenant_mana_topup.proto#/chora.payments.v1.TenantManaTopUpRefunded'
