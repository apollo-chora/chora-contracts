asyncapi: 3.0.0
info:
  title: Chora Payments — UserSubscriptionCheckoutStarted
  version: 1.0.0
  description: |
    chora-payments created a Stripe Checkout Session for a new
    per-learner Companion mana subscription (Basic / Standard / Premium
    monthly or annual per ADR-142). Customer has NOT yet paid the initial
    invoice.

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.user_subscription.checkout_started.v1`
    - Source proto: `proto/events/payments/user_subscription.proto`
       message `chora.payments.v1.UserSubscriptionCheckoutStarted`
    - Aggregate: UserSubscription
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  userSubscriptionCheckoutStarted:
    address: chora.payments.user_subscription.checkout_started.v1
    messages:
      userSubscriptionCheckoutStarted:
        $ref: '#/components/messages/UserSubscriptionCheckoutStarted'

operations:
  publishUserSubscriptionCheckoutStarted:
    action: send
    channel:
      $ref: '#/channels/userSubscriptionCheckoutStarted'
    messages:
      - $ref: '#/channels/userSubscriptionCheckoutStarted/messages/userSubscriptionCheckoutStarted'

  consumeUserSubscriptionCheckoutStarted:
    action: receive
    channel:
      $ref: '#/channels/userSubscriptionCheckoutStarted'
    messages:
      - $ref: '#/channels/userSubscriptionCheckoutStarted/messages/userSubscriptionCheckoutStarted'

components:
  messages:
    UserSubscriptionCheckoutStarted:
      name: UserSubscriptionCheckoutStarted
      title: Stripe Checkout Session created for a Companion mana subscription
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/payments/user_subscription.proto#/chora.payments.v1.UserSubscriptionCheckoutStarted'
