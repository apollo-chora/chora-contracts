asyncapi: 3.0.0
info:
  title: Chora Payments — UserSubscriptionPaused
  version: 1.0.0
  description: |
    Stripe `customer.subscription.paused` — chora-identity
    transitions UserSubscription to PAUSED and freezes mana allowance.
    May resume automatically at `resumes_at` if scheduled.

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.user_subscription.paused.v1`
    - Source proto: `proto/events/payments/user_subscription.proto`
       message `chora.payments.v1.UserSubscriptionPaused`
    - Aggregate: UserSubscription
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  userSubscriptionPaused:
    address: chora.payments.user_subscription.paused.v1
    messages:
      userSubscriptionPaused:
        $ref: '#/components/messages/UserSubscriptionPaused'

operations:
  publishUserSubscriptionPaused:
    action: send
    channel:
      $ref: '#/channels/userSubscriptionPaused'
    messages:
      - $ref: '#/channels/userSubscriptionPaused/messages/userSubscriptionPaused'

  consumeUserSubscriptionPaused:
    action: receive
    channel:
      $ref: '#/channels/userSubscriptionPaused'
    messages:
      - $ref: '#/channels/userSubscriptionPaused/messages/userSubscriptionPaused'

components:
  messages:
    UserSubscriptionPaused:
      name: UserSubscriptionPaused
      title: Stripe Subscription paused (admin or smart-retry exhausted)
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/payments/user_subscription.proto#/chora.payments.v1.UserSubscriptionPaused'
