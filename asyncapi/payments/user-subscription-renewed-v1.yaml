asyncapi: 3.0.0
info:
  title: Chora Payments — UserSubscriptionRenewed
  version: 1.0.0
  description: |
    Stripe `customer.subscription.updated` with period rollover
    (`current_period_end` advanced). Distinct from `payment_captured`
    (per-invoice). Fires only on the rollover transition so chora-identity
    can run rollover-specific logic (e.g., reset per-period mana allowance).

    - Domain: Payments (`chora_payments` DB)
    - Topic: `chora.payments.user_subscription.renewed.v1`
    - Source proto: `proto/events/payments/user_subscription.proto`
       message `chora.payments.v1.UserSubscriptionRenewed`
    - Aggregate: UserSubscription
    - Per ADR-164 (chora-payments service + 13th DB).
    - IMDA: envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  userSubscriptionRenewed:
    address: chora.payments.user_subscription.renewed.v1
    messages:
      userSubscriptionRenewed:
        $ref: '#/components/messages/UserSubscriptionRenewed'

operations:
  publishUserSubscriptionRenewed:
    action: send
    channel:
      $ref: '#/channels/userSubscriptionRenewed'
    messages:
      - $ref: '#/channels/userSubscriptionRenewed/messages/userSubscriptionRenewed'

  consumeUserSubscriptionRenewed:
    action: receive
    channel:
      $ref: '#/channels/userSubscriptionRenewed'
    messages:
      - $ref: '#/channels/userSubscriptionRenewed/messages/userSubscriptionRenewed'

components:
  messages:
    UserSubscriptionRenewed:
      name: UserSubscriptionRenewed
      title: Stripe Subscription rolled over to the next billing period
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/payments/user_subscription.proto#/chora.payments.v1.UserSubscriptionRenewed'
