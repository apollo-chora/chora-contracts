asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — leaderboard.season_rolled.v1"
  version: "1.0.0"
  description: |
    Published when a Leaderboard season ends and a new season opens. The
    final top-N of the closed season is captured in the payload (frozen);
    the new season's ranking starts empty.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/vnd.google.protobuf

servers:
  production:
    host: "pubsub.googleapis.com"
    protocol: googlepubsub
    description: "Google Cloud Pub/Sub (production)"
  emulator:
    host: "localhost:8085"
    protocol: googlepubsub
    description: "Cloud Pub/Sub Emulator (local dev)"

channels:
  leaderboardSeasonRolled:
    address: "chora.sharing.leaderboard.season_rolled.v1"
    messages:
      leaderboardSeasonRolled:
        $ref: "#/components/messages/LeaderboardSeasonRolled"

operations:
  publishLeaderboardSeasonRolled:
    action: send
    channel:
      $ref: "#/channels/leaderboardSeasonRolled"
    summary: "Publish a Leaderboard season rollover event"
    description: |
      Producer: chora-sharing (Cloud Run Job, season cron).
      Consumers: Sharing (skin awards for season winners),
                 Notifications (season-end summary),
                 Observability (cohort retention rollups).
    messages:
      - $ref: "#/channels/leaderboardSeasonRolled/messages/leaderboardSeasonRolled"

components:
  messages:
    LeaderboardSeasonRolled:
      name: "LeaderboardSeasonRolled"
      title: "Leaderboard Season Rolled"
      summary: "A Leaderboard season ended and a new season opened"
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf;version=3
      payload:
        schemaFormat: "application/vnd.google.protobuf;version=3"
        schema:
          protoFile: "proto/events/sharing/leaderboard.proto"
          messageName: "chora.sharing.v1.LeaderboardSeasonRolled"
