asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — post.created.v1"
  version: "1.0.0"
  description: |
    Published when a learner authors a new Post in chora_sharing.
    Drives feed fan-out, mention notifications, full-text indexing, and
    pre-flight content moderation by the Governance Gatekeeper.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+ (Surface-3) — "curiosity meets connection"

    Source-of-truth: docs/architecture-review-inputs-2026-05-07.md Tier 2 D8
    + .claude/skills/domain-content-sharing/SKILL.md
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  postCreated:
    address: "chora.sharing.post.created.v1"
    description: |
      Pub/Sub topic for PostCreated events. Topic resides in the centralised
      platform host project (`chora-489812`); subscriptions are owned by
      consuming projects via cross-project IAM. Schema Registry validates
      the Protobuf payload at publish time.
    messages:
      postCreated:
        $ref: "#/components/messages/PostCreated"

operations:
  publishPostCreated:
    action: send
    channel:
      $ref: "#/channels/postCreated"
    summary: "Publish a new Post creation event"
    description: |
      Producer: chora-sharing service.
      Consumers: Notifications (mention/follower fan-out),
                 Meilisearch indexer,
                 Governance Gatekeeper (content-moderation pre-flight),
                 Observability.
    messages:
      - $ref: "#/channels/postCreated/messages/postCreated"

components:
  messages:
    PostCreated:
      name: "PostCreated"
      title: "Post Created"
      summary: "A new Post has been authored"
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf;version=3
      payload:
        schemaFormat: "application/x-protobuf;version=3"
        schema:
          protoFile: "proto/events/sharing/post.proto"
          messageName: "chora.sharing.v1.PostCreated"
