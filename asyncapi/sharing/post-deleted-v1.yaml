asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — post.deleted.v1"
  version: "1.0.0"
  description: |
    Published when a Post is soft-deleted. Per ddd-enforcement aggregate
    invariant #5 this is NEVER a hard delete — `deleted_at` is set; audit +
    reactions remain.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/vnd.google.protobuf

servers:
  production:
    host: "pubsub.googleapis.com"
    protocol: googlepubsub
    description: "Google Cloud Pub/Sub (production)"
  emulator:
    host: "localhost:8085"
    protocol: googlepubsub
    description: "Cloud Pub/Sub Emulator (local dev)"

channels:
  postDeleted:
    address: "chora.sharing.post.deleted.v1"
    description: |
      Pub/Sub topic for PostDeleted events. Subscribers must filter active
      feed queries with `WHERE deleted_at IS NULL`.
    messages:
      postDeleted:
        $ref: "#/components/messages/PostDeleted"

operations:
  publishPostDeleted:
    action: send
    channel:
      $ref: "#/channels/postDeleted"
    summary: "Publish a Post soft-delete event"
    description: |
      Producer: chora-sharing.
      Consumers: Notifications (thread participants),
                 Meilisearch reindexer,
                 Audit log,
                 Governance dashboard (moderation outcome).
    messages:
      - $ref: "#/channels/postDeleted/messages/postDeleted"

components:
  messages:
    PostDeleted:
      name: "PostDeleted"
      title: "Post Deleted"
      summary: "A Post has been soft-deleted"
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf;version=3
      payload:
        schemaFormat: "application/vnd.google.protobuf;version=3"
        schema:
          protoFile: "proto/events/sharing/post.proto"
          messageName: "chora.sharing.v1.PostDeleted"
