asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — post.flagged.v1"
  version: "1.0.0"
  description: |
    Published when a Post is flagged — by another learner via report, OR by
    the Governance Gatekeeper auto-moderation pipeline. Drives the O+
    moderation queue. Does NOT remove the Post (PostDeleted does that).

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ (origin) → O+ Observability+ (moderation queue)
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/vnd.google.protobuf

servers:
  production:
    host: "pubsub.googleapis.com"
    protocol: googlepubsub
    description: "Google Cloud Pub/Sub (production)"
  emulator:
    host: "localhost:8085"
    protocol: googlepubsub
    description: "Cloud Pub/Sub Emulator (local dev)"

channels:
  postFlagged:
    address: "chora.sharing.post.flagged.v1"
    description: |
      Pub/Sub topic for PostFlagged events. Schema Registry validates the
      payload at publish time. Consumers fan-out to the moderation queue
      and the ContentPolicyViolationLog (immutable audit).
    messages:
      postFlagged:
        $ref: "#/components/messages/PostFlagged"

operations:
  publishPostFlagged:
    action: send
    channel:
      $ref: "#/channels/postFlagged"
    summary: "Publish a Post flag event"
    description: |
      Producer: chora-sharing OR Governance Gatekeeper agent.
      Consumers: O+ moderation queue,
                 ContentPolicyViolationLog,
                 Notifications (notify moderators),
                 Observability.
    messages:
      - $ref: "#/channels/postFlagged/messages/postFlagged"

components:
  messages:
    PostFlagged:
      name: "PostFlagged"
      title: "Post Flagged"
      summary: "A Post has been flagged for moderation"
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf;version=3
      payload:
        schemaFormat: "application/vnd.google.protobuf;version=3"
        schema:
          protoFile: "proto/events/sharing/post.proto"
          messageName: "chora.sharing.v1.PostFlagged"
