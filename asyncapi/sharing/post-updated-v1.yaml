asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — post.updated.v1"
  version: "1.0.0"
  description: |
    Published when an existing Post body / media / visibility is edited.
    Audit log retains pre-edit state; consumers receive the updated record.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  postUpdated:
    address: "chora.sharing.post.updated.v1"
    description: |
      Pub/Sub topic for PostUpdated events. Schema Registry validates
      payload at publish time.
    messages:
      postUpdated:
        $ref: "#/components/messages/PostUpdated"

operations:
  publishPostUpdated:
    action: send
    channel:
      $ref: "#/channels/postUpdated"
    summary: "Publish a Post update event"
    description: |
      Producer: chora-sharing.
      Consumers: Notifications (thread participants),
                 Meilisearch reindexer,
                 Observability.
    messages:
      - $ref: "#/channels/postUpdated/messages/postUpdated"

components:
  messages:
    PostUpdated:
      name: "PostUpdated"
      title: "Post Updated"
      summary: "An existing Post has been edited"
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf;version=3
      payload:
        schemaFormat: "application/x-protobuf;version=3"
        schema:
          protoFile: "proto/events/sharing/post.proto"
          messageName: "chora.sharing.v1.PostUpdated"
