asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — reaction.added.v1"
  version: "1.0.0"
  description: |
    Published when a learner adds a positive Reaction to a Post. Idempotent
    on (target_post_id, actor_gcid, reaction_type) — duplicate adds collapse
    upstream.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/vnd.google.protobuf

servers:
  production:
    host: "pubsub.googleapis.com"
    protocol: googlepubsub
    description: "Google Cloud Pub/Sub (production)"
  emulator:
    host: "localhost:8085"
    protocol: googlepubsub
    description: "Cloud Pub/Sub Emulator (local dev)"

channels:
  reactionAdded:
    address: "chora.sharing.reaction.added.v1"
    messages:
      reactionAdded:
        $ref: "#/components/messages/ReactionAdded"

operations:
  publishReactionAdded:
    action: send
    channel:
      $ref: "#/channels/reactionAdded"
    summary: "Publish a Reaction add event"
    description: |
      Producer: chora-sharing.
      Consumers: Notifications (notify post author),
                 Sharing (XP / streak / combo rules),
                 Observability (engagement funnel).
    messages:
      - $ref: "#/channels/reactionAdded/messages/reactionAdded"

components:
  messages:
    ReactionAdded:
      name: "ReactionAdded"
      title: "Reaction Added"
      summary: "A learner reacted to a Post"
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf;version=3
      payload:
        schemaFormat: "application/vnd.google.protobuf;version=3"
        schema:
          protoFile: "proto/events/sharing/reaction.proto"
          messageName: "chora.sharing.v1.ReactionAdded"
