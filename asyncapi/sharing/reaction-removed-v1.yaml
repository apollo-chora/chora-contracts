asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — reaction.removed.v1"
  version: "1.0.0"
  description: |
    Published when a learner withdraws a previously added Reaction (toggle
    off). Soft-delete via deleted_at — historical reaction is preserved.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/vnd.google.protobuf

servers:
  production:
    host: "pubsub.googleapis.com"
    protocol: googlepubsub
    description: "Google Cloud Pub/Sub (production)"
  emulator:
    host: "localhost:8085"
    protocol: googlepubsub
    description: "Cloud Pub/Sub Emulator (local dev)"

channels:
  reactionRemoved:
    address: "chora.sharing.reaction.removed.v1"
    messages:
      reactionRemoved:
        $ref: "#/components/messages/ReactionRemoved"

operations:
  publishReactionRemoved:
    action: send
    channel:
      $ref: "#/channels/reactionRemoved"
    summary: "Publish a Reaction removal event"
    description: |
      Producer: chora-sharing.
      Consumers: Sharing (XP rollback),
                 Observability.
    messages:
      - $ref: "#/channels/reactionRemoved/messages/reactionRemoved"

components:
  messages:
    ReactionRemoved:
      name: "ReactionRemoved"
      title: "Reaction Removed"
      summary: "A learner withdrew a previously added Reaction"
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf;version=3
      payload:
        schemaFormat: "application/vnd.google.protobuf;version=3"
        schema:
          protoFile: "proto/events/sharing/reaction.proto"
          messageName: "chora.sharing.v1.ReactionRemoved"
