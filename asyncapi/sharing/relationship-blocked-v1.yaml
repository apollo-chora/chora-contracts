asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — relationship.blocked.v1"
  version: "1.0.0"
  description: |
    Published when a learner blocks another. SEVERANCE CONTRACT: both follow
    edges, any friendship, and any pending requests were deleted in the same SoR
    transaction — consumers mirroring relationship state MUST apply the same
    removals on this single event. Block existence is never disclosed to the
    blocked party.

    Part of the complete relationship lifecycle spine (ADR-230 D4, upgrade
    seam 2): every committed transition publishes exactly one relationship
    event through the sharing outbox, written in the SAME transaction as the
    state change. Supersedes the never-published follow.* family.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  relationshipBlocked:
    address: "chora.sharing.relationship.blocked.v1"
    messages:
      relationshipBlocked:
        $ref: "#/components/messages/RelationshipBlocked"

operations:
  publishRelationshipBlocked:
    action: send
    channel:
      $ref: "#/channels/relationshipBlocked"
    summary: "Publish a Relationship Blocked event"
    description: |
      Producer: chora-sharing (RelationshipRepo outbox enqueue, ADR-230 D4).
      Consumers: future graph projector (edge removals), Observability.
    messages:
      - $ref: "#/channels/relationshipBlocked/messages/relationshipBlocked"

components:
  messages:
    RelationshipBlocked:
      name: "RelationshipBlocked"
      title: "Relationship Blocked"
      summary: "A learner blocked another learner — severance"
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf;version=3
      payload:
        schemaFormat: "application/x-protobuf;version=3"
        schema:
          protoFile: "proto/events/sharing/relationship.proto"
          messageName: "chora.sharing.v1.RelationshipBlocked"
