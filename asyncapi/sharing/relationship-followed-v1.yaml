asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — relationship.followed.v1"
  version: "1.0.0"
  description: |
    Published when a learner follows another learner (actual edge creation only —
    duplicate follows emit nothing).

    Part of the complete relationship lifecycle spine (ADR-230 D4, upgrade
    seam 2): every committed transition publishes exactly one relationship
    event through the sharing outbox, written in the SAME transaction as the
    state change. Supersedes the never-published follow.* family.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  relationshipFollowed:
    address: "chora.sharing.relationship.followed.v1"
    messages:
      relationshipFollowed:
        $ref: "#/components/messages/RelationshipFollowed"

operations:
  publishRelationshipFollowed:
    action: send
    channel:
      $ref: "#/channels/relationshipFollowed"
    summary: "Publish a Relationship Followed event"
    description: |
      Producer: chora-sharing (RelationshipRepo outbox enqueue, ADR-230 D4).
      Consumers: Notifications (notify followee), Observability (graph-growth metrics),
                 future graph projector (CHO-2112).
    messages:
      - $ref: "#/channels/relationshipFollowed/messages/relationshipFollowed"

components:
  messages:
    RelationshipFollowed:
      name: "RelationshipFollowed"
      title: "Relationship Followed"
      summary: "A learner began following another learner"
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf;version=3
      payload:
        schemaFormat: "application/x-protobuf;version=3"
        schema:
          protoFile: "proto/events/sharing/relationship.proto"
          messageName: "chora.sharing.v1.RelationshipFollowed"
