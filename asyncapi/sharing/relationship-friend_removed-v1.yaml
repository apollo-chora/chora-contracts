asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — relationship.friend_removed.v1"
  version: "1.0.0"
  description: |
    Published on unfriend. Follow edges are an independent plane and are NOT
    touched by an unfriend.

    Part of the complete relationship lifecycle spine (ADR-230 D4, upgrade
    seam 2): every committed transition publishes exactly one relationship
    event through the sharing outbox, written in the SAME transaction as the
    state change. Supersedes the never-published follow.* family.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/vnd.google.protobuf

servers:
  production:
    host: "pubsub.googleapis.com"
    protocol: googlepubsub
    description: "Google Cloud Pub/Sub (production)"
  emulator:
    host: "localhost:8085"
    protocol: googlepubsub
    description: "Cloud Pub/Sub Emulator (local dev)"

channels:
  relationshipFriendRemoved:
    address: "chora.sharing.relationship.friend_removed.v1"
    messages:
      relationshipFriendRemoved:
        $ref: "#/components/messages/RelationshipFriendRemoved"

operations:
  publishRelationshipFriendRemoved:
    action: send
    channel:
      $ref: "#/channels/relationshipFriendRemoved"
    summary: "Publish a Relationship Friend Removed event"
    description: |
      Producer: chora-sharing (RelationshipRepo outbox enqueue, ADR-230 D4).
      Consumers: Observability, future graph projector.
    messages:
      - $ref: "#/channels/relationshipFriendRemoved/messages/relationshipFriendRemoved"

components:
  messages:
    RelationshipFriendRemoved:
      name: "RelationshipFriendRemoved"
      title: "Relationship Friend Removed"
      summary: "A friendship was removed (unfriend)"
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf;version=3
      payload:
        schemaFormat: "application/vnd.google.protobuf;version=3"
        schema:
          protoFile: "proto/events/sharing/relationship.proto"
          messageName: "chora.sharing.v1.RelationshipFriendRemoved"
