asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — relationship.friend_requested.v1"
  version: "1.0.0"
  description: |
    Published when a learner sends a friend request. Decline/cancel of a pending
    request emits NOTHING (never-materialised intent).

    Part of the complete relationship lifecycle spine (ADR-230 D4, upgrade
    seam 2): every committed transition publishes exactly one relationship
    event through the sharing outbox, written in the SAME transaction as the
    state change. Supersedes the never-published follow.* family.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  relationshipFriendRequested:
    address: "chora.sharing.relationship.friend_requested.v1"
    messages:
      relationshipFriendRequested:
        $ref: "#/components/messages/RelationshipFriendRequested"

operations:
  publishRelationshipFriendRequested:
    action: send
    channel:
      $ref: "#/channels/relationshipFriendRequested"
    summary: "Publish a Relationship Friend Requested event"
    description: |
      Producer: chora-sharing (RelationshipRepo outbox enqueue, ADR-230 D4).
      Consumers: Notifications (notify addressee).
    messages:
      - $ref: "#/channels/relationshipFriendRequested/messages/relationshipFriendRequested"

components:
  messages:
    RelationshipFriendRequested:
      name: "RelationshipFriendRequested"
      title: "Relationship Friend Requested"
      summary: "A learner sent a friend request"
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf;version=3
      payload:
        schemaFormat: "application/x-protobuf;version=3"
        schema:
          protoFile: "proto/events/sharing/relationship.proto"
          messageName: "chora.sharing.v1.RelationshipFriendRequested"
