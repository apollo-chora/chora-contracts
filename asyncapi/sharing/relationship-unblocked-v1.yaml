asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — relationship.unblocked.v1"
  version: "1.0.0"
  description: |
    Published when the blocker lifts the block. RESTORES NOTHING — follows and
    friendship must be re-earned from scratch (ADR-230 D1).

    Part of the complete relationship lifecycle spine (ADR-230 D4, upgrade
    seam 2): every committed transition publishes exactly one relationship
    event through the sharing outbox, written in the SAME transaction as the
    state change. Supersedes the never-published follow.* family.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/vnd.google.protobuf

servers:
  production:
    host: "pubsub.googleapis.com"
    protocol: googlepubsub
    description: "Google Cloud Pub/Sub (production)"
  emulator:
    host: "localhost:8085"
    protocol: googlepubsub
    description: "Cloud Pub/Sub Emulator (local dev)"

channels:
  relationshipUnblocked:
    address: "chora.sharing.relationship.unblocked.v1"
    messages:
      relationshipUnblocked:
        $ref: "#/components/messages/RelationshipUnblocked"

operations:
  publishRelationshipUnblocked:
    action: send
    channel:
      $ref: "#/channels/relationshipUnblocked"
    summary: "Publish a Relationship Unblocked event"
    description: |
      Producer: chora-sharing (RelationshipRepo outbox enqueue, ADR-230 D4).
      Consumers: future graph projector, Observability.
    messages:
      - $ref: "#/channels/relationshipUnblocked/messages/relationshipUnblocked"

components:
  messages:
    RelationshipUnblocked:
      name: "RelationshipUnblocked"
      title: "Relationship Unblocked"
      summary: "A block was lifted — nothing is restored"
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf;version=3
      payload:
        schemaFormat: "application/vnd.google.protobuf;version=3"
        schema:
          protoFile: "proto/events/sharing/relationship.proto"
          messageName: "chora.sharing.v1.RelationshipUnblocked"
