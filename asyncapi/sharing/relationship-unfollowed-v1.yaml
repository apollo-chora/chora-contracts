asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — relationship.unfollowed.v1"
  version: "1.0.0"
  description: |
    Published when a learner unfollows (actual edge removal only).

    Part of the complete relationship lifecycle spine (ADR-230 D4, upgrade
    seam 2): every committed transition publishes exactly one relationship
    event through the sharing outbox, written in the SAME transaction as the
    state change. Supersedes the never-published follow.* family.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  relationshipUnfollowed:
    address: "chora.sharing.relationship.unfollowed.v1"
    messages:
      relationshipUnfollowed:
        $ref: "#/components/messages/RelationshipUnfollowed"

operations:
  publishRelationshipUnfollowed:
    action: send
    channel:
      $ref: "#/channels/relationshipUnfollowed"
    summary: "Publish a Relationship Unfollowed event"
    description: |
      Producer: chora-sharing (RelationshipRepo outbox enqueue, ADR-230 D4).
      Consumers: Observability (graph metrics), future graph projector (CHO-2112).
    messages:
      - $ref: "#/channels/relationshipUnfollowed/messages/relationshipUnfollowed"

components:
  messages:
    RelationshipUnfollowed:
      name: "RelationshipUnfollowed"
      title: "Relationship Unfollowed"
      summary: "A learner unfollowed another learner"
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf;version=3
      payload:
        schemaFormat: "application/x-protobuf;version=3"
        schema:
          protoFile: "proto/events/sharing/relationship.proto"
          messageName: "chora.sharing.v1.RelationshipUnfollowed"
