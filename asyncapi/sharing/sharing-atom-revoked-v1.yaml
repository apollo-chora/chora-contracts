asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — atom.revoked.v1"
  version: "1.0.0"
  description: |
    Published when an AtomUsageGrant is revoked — the grantee loses
    usage rights to an atom. Carries the grant ID, owner, grantee, atom,
    the revoking GCID, reason, and timestamp.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  atomRevoked:
    address: "chora.sharing.atom.revoked.v1"
    messages:
      atomRevoked:
        $ref: "#/components/messages/AtomGrantRevoked"

operations:
  publishAtomRevoked:
    action: send
    channel:
      $ref: "#/channels/atomRevoked"
    summary: "Publish an atom grant revoked event"
    description: |
      Producer: chora-sharing service (grant revocation).
      Consumers: Consumption (usage rights invalidation),
                 Notifications (revoke notification to grantee),
                 Governance (grant audit),
                 Observability.
    messages:
      - $ref: "#/channels/atomRevoked/messages/atomRevoked"

components:
  messages:
    AtomGrantRevoked:
      name: "AtomGrantRevoked"
      title: "Atom Grant Revoked"
      summary: "An atom usage grant was revoked"
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf;version=3
      payload:
        schemaFormat: "application/x-protobuf;version=3"
        schema:
          protoFile: "proto/events-flat/sharing/atom/revoked.proto"
          messageName: "chora.sharing.v1.AtomGrantRevoked"
