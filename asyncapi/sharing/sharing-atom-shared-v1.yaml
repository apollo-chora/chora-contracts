asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — atom.shared.v1"
  version: "1.0.0"
  description: |
    Published when an author shares an atom to the feed with a per-atom
    license. Carries the share entry ID, author display name, caption, and
    license/royalty snapshot. Drives feed fan-out, royalty accrual, and
    cross-domain notifications.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  atomShared:
    address: "chora.sharing.atom.shared.v1"
    messages:
      atomShared:
        $ref: "#/components/messages/AtomShared"

operations:
  publishAtomShared:
    action: send
    channel:
      $ref: "#/channels/atomShared"
    summary: "Publish an atom share event"
    description: |
      Producer: chora-sharing service (outbox dispatcher).
      Consumers: Notifications (feed fan-out to followers),
                 Consumption (royalty accrual on reuse),
                 Observability.
    messages:
      - $ref: "#/channels/atomShared/messages/atomShared"

components:
  messages:
    AtomShared:
      name: "AtomShared"
      title: "Atom Shared"
      summary: "An author shared an atom to the feed"
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf;version=3
      payload:
        schemaFormat: "application/x-protobuf;version=3"
        schema:
          protoFile: "proto/events-flat/sharing/atom/shared.proto"
          messageName: "chora.sharing.v1.AtomShared"
