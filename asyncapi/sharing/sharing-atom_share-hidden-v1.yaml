asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — atom_share.hidden.v1"
  version: "1.0.0"
  description: |
    Published when a shared atom is hidden from the feed (moderation or
    author action). The feed entry is not deleted — it is excluded from
    feed reads via derived status. Carries the share entry ID, the GCID
    of the actor, and a reason.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/vnd.google.protobuf

servers:
  production:
    host: "pubsub.googleapis.com"
    protocol: googlepubsub
    description: "Google Cloud Pub/Sub (production)"
  emulator:
    host: "localhost:8085"
    protocol: googlepubsub
    description: "Cloud Pub/Sub Emulator (local dev)"

channels:
  atomShareHidden:
    address: "chora.sharing.atom_share.hidden.v1"
    messages:
      atomShareHidden:
        $ref: "#/components/messages/AtomShareHidden"

operations:
  publishAtomShareHidden:
    action: send
    channel:
      $ref: "#/channels/atomShareHidden"
    summary: "Publish an atom share hidden event"
    description: |
      Producer: chora-sharing service (moderation or author action).
      Consumers: Notifications (feed cache invalidation),
                 Governance (moderation audit),
                 Observability.
    messages:
      - $ref: "#/channels/atomShareHidden/messages/atomShareHidden"

components:
  messages:
    AtomShareHidden:
      name: "AtomShareHidden"
      title: "Atom Share Hidden"
      summary: "A shared atom was hidden from the feed"
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf;version=3
      payload:
        schemaFormat: "application/vnd.google.protobuf;version=3"
        schema:
          protoFile: "proto/events-flat/sharing/atom_share/hidden.proto"
          messageName: "chora.sharing.v1.AtomShareHidden"
