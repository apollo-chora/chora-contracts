asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — atom_share.price_changed.v1"
  version: "1.0.0"
  description: |
    Published when the license terms / royalty rate of a shared atom are
    changed after the initial share. Carries the new license + royalty
    snapshot and the GCID of the author who changed it.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/vnd.google.protobuf

servers:
  production:
    host: "pubsub.googleapis.com"
    protocol: googlepubsub
    description: "Google Cloud Pub/Sub (production)"
  emulator:
    host: "localhost:8085"
    protocol: googlepubsub
    description: "Cloud Pub/Sub Emulator (local dev)"

channels:
  atomSharePriceChanged:
    address: "chora.sharing.atom_share.price_changed.v1"
    messages:
      atomSharePriceChanged:
        $ref: "#/components/messages/AtomSharePriceChanged"

operations:
  publishAtomSharePriceChanged:
    action: send
    channel:
      $ref: "#/channels/atomSharePriceChanged"
    summary: "Publish an atom share price-change event"
    description: |
      Producer: chora-sharing service.
      Consumers: Consumption (royalty recalculation),
                 Observability (pricing audit).
    messages:
      - $ref: "#/channels/atomSharePriceChanged/messages/atomSharePriceChanged"

components:
  messages:
    AtomSharePriceChanged:
      name: "AtomSharePriceChanged"
      title: "Atom Share Price Changed"
      summary: "The license/royalty of a shared atom was changed"
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf;version=3
      payload:
        schemaFormat: "application/vnd.google.protobuf;version=3"
        schema:
          protoFile: "proto/events-flat/sharing/atom_share/price_changed.proto"
          messageName: "chora.sharing.v1.AtomSharePriceChanged"
