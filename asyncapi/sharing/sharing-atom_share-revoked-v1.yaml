asyncapi: "3.0.0"
info:
  title: "Chora Content Sharing — atom_share.revoked.v1"
  version: "1.0.0"
  description: |
    Published when an author revokes their share of an atom from the feed.
    The feed entry is not deleted (immutable) — an EventRevoked is appended,
    excluding it from feed reads. Carries the share entry ID, atom ID, the
    revoking GCID, and a reason.

    Owning team   : Team 1 (Content)
    Owning domain : Content Sharing (chora_sharing database)
    Surface       : C+ Connect+
  contact:
    name: "Chora Platform Team — Content Track"
  license:
    name: "Proprietary"

defaultContentType: application/vnd.google.protobuf

servers:
  production:
    host: "pubsub.googleapis.com"
    protocol: googlepubsub
    description: "Google Cloud Pub/Sub (production)"
  emulator:
    host: "localhost:8085"
    protocol: googlepubsub
    description: "Cloud Pub/Sub Emulator (local dev)"

channels:
  atomShareRevoked:
    address: "chora.sharing.atom_share.revoked.v1"
    messages:
      atomShareRevoked:
        $ref: "#/components/messages/AtomShareRevoked"

operations:
  publishAtomShareRevoked:
    action: send
    channel:
      $ref: "#/channels/atomShareRevoked"
    summary: "Publish an atom share revoked event"
    description: |
      Producer: chora-sharing service (author-initiated revoke).
      Consumers: Notifications (feed cache invalidation),
                 Governance (audit trail),
                 Observability.
    messages:
      - $ref: "#/channels/atomShareRevoked/messages/atomShareRevoked"

components:
  messages:
    AtomShareRevoked:
      name: "AtomShareRevoked"
      title: "Atom Share Revoked"
      summary: "An author revoked their atom share from the feed"
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf;version=3
      payload:
        schemaFormat: "application/vnd.google.protobuf;version=3"
        schema:
          protoFile: "proto/events-flat/sharing/atom_share/revoked.proto"
          messageName: "chora.sharing.v1.AtomShareRevoked"
