asyncapi: 3.0.0
info:
  title: Chora Tenancy — AddonDowngraded
  version: 1.0.0
  description: |
    Published when a tenant downgrades an add-on tier in place.
    Mirrors AddonUpgraded; billing_delta_cents typically <= 0
    (credit) for downgrades.

    - Domain: Tenancy + Billing (`chora_tenancy` DB)
    - Topic: `chora.tenancy.addon.downgraded.v1`
    - Source proto: `proto/events/tenancy/addon.proto`
       message `chora.tenancy.v1.AddonDowngraded`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  addonDowngraded:
    address: chora.tenancy.addon.downgraded.v1
    messages:
      addonDowngraded:
        $ref: '#/components/messages/AddonDowngraded'

operations:
  publishAddonDowngraded:
    action: send
    channel:
      $ref: '#/channels/addonDowngraded'
    messages:
      - $ref: '#/channels/addonDowngraded/messages/addonDowngraded'

  consumeAddonDowngraded:
    action: receive
    channel:
      $ref: '#/channels/addonDowngraded'
    description: |
      Consumers: ALL surfaces (entitlement shrink), AI Kernel (LoRA
      quota shrink + adapter retirement triggers), Notifications,
      Billing (credit + BigQuery streaming for downgrade funnel).
    messages:
      - $ref: '#/channels/addonDowngraded/messages/addonDowngraded'

components:
  messages:
    AddonDowngraded:
      name: AddonDowngraded
      title: Add-On Downgraded
      summary: A tenant has downgraded an add-on tier in place
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/tenancy/addon.proto#/chora.tenancy.v1.AddonDowngraded'
