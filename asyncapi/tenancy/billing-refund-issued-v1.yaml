asyncapi: 3.0.0
info:
  title: Chora Tenancy — RefundIssued
  version: 1.0.0
  description: |
    Published when a refund is issued against a previously-paid invoice
    (full or partial). Stripe refund.created webhook drives this.

    - Domain: Tenancy + Billing (`chora_tenancy` DB)
    - Topic: `chora.tenancy.billing.refund_issued.v1`
    - Source proto: `proto/events/tenancy/billing.proto`
       message `chora.tenancy.v1.RefundIssued`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  refundIssued:
    address: chora.tenancy.billing.refund_issued.v1
    messages:
      refundIssued:
        $ref: '#/components/messages/RefundIssued'

operations:
  publishRefundIssued:
    action: send
    channel:
      $ref: '#/channels/refundIssued'
    messages:
      - $ref: '#/channels/refundIssued/messages/refundIssued'

  consumeRefundIssued:
    action: receive
    channel:
      $ref: '#/channels/refundIssued'
    description: |
      Consumers: Notifications (refund confirmation), Observability
      (revenue adjustment KPI), Audit log.
    messages:
      - $ref: '#/channels/refundIssued/messages/refundIssued'

components:
  messages:
    RefundIssued:
      name: RefundIssued
      title: Refund Issued
      summary: A refund has been issued against a paid tenant invoice
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/tenancy/billing.proto#/chora.tenancy.v1.RefundIssued'
