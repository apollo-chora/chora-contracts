asyncapi: 3.0.0
info:
  title: Chora Tenancy — CompanionEggCheckoutStarted
  version: 1.0.0
  description: |
    chora-tenancy has created a Stripe Checkout session for a Companion-egg
    purchase. The user has NOT yet paid; this is the funnel-top signal.

    - Domain: Tenancy + Billing (`chora_tenancy` DB)
    - Topic: `chora.tenancy.companion_egg.checkout_started.v1`
    - Source proto: `proto/events/tenancy/companion_egg.proto`
       message `chora.tenancy.v1.CompanionEggCheckoutStarted`
    - Aggregate: CompanionEggPurchase (1:1 with Stripe Checkout session)
    - Per ADR-149 §"Egg purchase". Breed is rolled at HATCH, not checkout,
      so this event carries no breed/species.
    - IMDA: tag envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  companionEggCheckoutStarted:
    address: chora.tenancy.companion_egg.checkout_started.v1
    messages:
      companionEggCheckoutStarted:
        $ref: '#/components/messages/CompanionEggCheckoutStarted'

operations:
  publishCompanionEggCheckoutStarted:
    action: send
    channel:
      $ref: '#/channels/companionEggCheckoutStarted'
    messages:
      - $ref: '#/channels/companionEggCheckoutStarted/messages/companionEggCheckoutStarted'

  consumeCompanionEggCheckoutStarted:
    action: receive
    channel:
      $ref: '#/channels/companionEggCheckoutStarted'
    description: |
      Consumers:
        - chora-observability (funnel telemetry: checkout-started → paid conversion)
        - chora-governance (audit trail for IMDA D1 accountability)
    messages:
      - $ref: '#/channels/companionEggCheckoutStarted/messages/companionEggCheckoutStarted'

components:
  messages:
    CompanionEggCheckoutStarted:
      name: CompanionEggCheckoutStarted
      title: Stripe Checkout session opened for a Companion-egg purchase
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/tenancy/companion_egg.proto#/chora.tenancy.v1.CompanionEggCheckoutStarted'
