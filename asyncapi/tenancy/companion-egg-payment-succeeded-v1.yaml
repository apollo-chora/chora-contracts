asyncapi: 3.0.0
info:
  title: Chora Tenancy — CompanionEggPaymentSucceeded
  version: 1.0.0
  description: |
    Stripe `checkout.session.completed` webhook has confirmed payment for a
    Companion-egg purchase. This is the load-bearing provisioning trigger —
    chora-consumption MUST subscribe and provision the Stage-0
    `companion_instances` row, then emit
    `chora.consumption.companion.egg_purchased.v1` to complete the chain.

    Free-egg paths (trial / subscription_inclusion / tenant_grant) DO NOT
    flow through this event — they go straight to
    `chora.consumption.companion.egg_purchased.v1` with `source != "purchase"`.

    - Domain: Tenancy + Billing (`chora_tenancy` DB)
    - Topic: `chora.tenancy.companion_egg.payment_succeeded.v1`
    - Source proto: `proto/events/tenancy/companion_egg.proto`
       message `chora.tenancy.v1.CompanionEggPaymentSucceeded`
    - Aggregate: CompanionEggPurchase (1:1 with Stripe Checkout session)
    - Per ADR-149 §"Egg purchase".
    - IMDA: tag envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  companionEggPaymentSucceeded:
    address: chora.tenancy.companion_egg.payment_succeeded.v1
    messages:
      companionEggPaymentSucceeded:
        $ref: '#/components/messages/CompanionEggPaymentSucceeded'

operations:
  publishCompanionEggPaymentSucceeded:
    action: send
    channel:
      $ref: '#/channels/companionEggPaymentSucceeded'
    messages:
      - $ref: '#/channels/companionEggPaymentSucceeded/messages/companionEggPaymentSucceeded'

  consumeCompanionEggPaymentSucceeded:
    action: receive
    channel:
      $ref: '#/channels/companionEggPaymentSucceeded'
    description: |
      Consumers:
        - chora-consumption (provisions Stage-0 companion_instances row,
          then emits chora.consumption.companion.egg_purchased.v1)
        - chora-notifications (receipt email)
        - chora-observability (revenue ledger; egg-purchase funnel conversion)
        - chora-governance (compliance audit — IMDA D1 evidence)
    messages:
      - $ref: '#/channels/companionEggPaymentSucceeded/messages/companionEggPaymentSucceeded'

components:
  messages:
    CompanionEggPaymentSucceeded:
      name: CompanionEggPaymentSucceeded
      title: Stripe payment confirmed for a Companion-egg purchase
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/tenancy/companion_egg.proto#/chora.tenancy.v1.CompanionEggPaymentSucceeded'
