asyncapi: 3.0.0
info:
  title: Chora Tenancy — CompanionEggRefunded
  version: 1.0.0
  description: |
    Stripe refund issued (full or partial) against a Companion-egg purchase.
    Triggered by:
      - hard-expiry of unhatched egg (ADR-149 §60d auto-refund-credit; the
        50% credit-only path emits `credit_only=true`),
      - support-initiated refund,
      - tenant policy refund (e.g., "trial mistakenly billed"),
      - customer request / duplicate-charge / fraud.

    chora-consumption MUST mark the Companion instance as voided and free
    up the slot in `CompanionRoster`.

    - Domain: Tenancy + Billing (`chora_tenancy` DB)
    - Topic: `chora.tenancy.companion_egg.refunded.v1`
    - Source proto: `proto/events/tenancy/companion_egg.proto`
       message `chora.tenancy.v1.CompanionEggRefunded`
    - Aggregate: CompanionEggPurchase
    - Per ADR-149 §"Unhatched egg expiry".
    - IMDA: tag envelope.chora_imda_dimension = "accountability"
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  companionEggRefunded:
    address: chora.tenancy.companion_egg.refunded.v1
    messages:
      companionEggRefunded:
        $ref: '#/components/messages/CompanionEggRefunded'

operations:
  publishCompanionEggRefunded:
    action: send
    channel:
      $ref: '#/channels/companionEggRefunded'
    messages:
      - $ref: '#/channels/companionEggRefunded/messages/companionEggRefunded'

  consumeCompanionEggRefunded:
    action: receive
    channel:
      $ref: '#/channels/companionEggRefunded'
    description: |
      Consumers:
        - chora-consumption (mark Companion instance voided, free roster slot)
        - chora-notifications (refund-confirmation email)
        - chora-observability (revenue-ledger reversal entry)
        - chora-governance (compliance audit — IMDA D1 evidence)
    messages:
      - $ref: '#/channels/companionEggRefunded/messages/companionEggRefunded'

components:
  messages:
    CompanionEggRefunded:
      name: CompanionEggRefunded
      title: Stripe refund issued against a Companion-egg purchase
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/tenancy/companion_egg.proto#/chora.tenancy.v1.CompanionEggRefunded'
