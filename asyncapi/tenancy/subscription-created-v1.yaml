asyncapi: 3.0.0
info:
  title: Chora Tenancy — SubscriptionCreated
  version: 1.0.0
  description: |
    Published when a new Subscription is established. Triggers
    AddonActivated events for each included addon_plan_id.

    - Domain: Tenancy + Billing (`chora_tenancy` DB)
    - Topic: `chora.tenancy.subscription.created.v1`
    - Source proto: `proto/events/tenancy/subscription.proto`
       message `chora.tenancy.v1.SubscriptionCreated`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/vnd.google.protobuf

servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub

channels:
  subscriptionCreated:
    address: chora.tenancy.subscription.created.v1
    messages:
      subscriptionCreated:
        $ref: '#/components/messages/SubscriptionCreated'

operations:
  publishSubscriptionCreated:
    action: send
    channel:
      $ref: '#/channels/subscriptionCreated'
    messages:
      - $ref: '#/channels/subscriptionCreated/messages/subscriptionCreated'

  consumeSubscriptionCreated:
    action: receive
    channel:
      $ref: '#/channels/subscriptionCreated'
    description: |
      Consumers: Tenancy (downstream AddonActivated emission),
      Notifications (welcome-to-plan), Observability (MRR KPI).
    messages:
      - $ref: '#/channels/subscriptionCreated/messages/subscriptionCreated'

components:
  messages:
    SubscriptionCreated:
      name: SubscriptionCreated
      title: Subscription Created
      summary: A new tenant subscription has been established
      contentType: application/vnd.google.protobuf
      schemaFormat: application/vnd.google.protobuf
      payload:
        schemaFormat: application/vnd.google.protobuf
        schema:
          $ref: '../../proto/events/tenancy/subscription.proto#/chora.tenancy.v1.SubscriptionCreated'
