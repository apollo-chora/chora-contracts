asyncapi: 3.0.0
info:
  title: Chora Tenancy — SubscriptionRenewed
  version: 1.0.0
  description: |
    Published when a subscription successfully renews (Stripe webhook
    invoice.paid -> InvoicePaid -> SubscriptionRenewed). Carries the new
    renews_at boundary.

    - Domain: Tenancy + Billing (`chora_tenancy` DB)
    - Topic: `chora.tenancy.subscription.renewed.v1`
    - Source proto: `proto/events/tenancy/subscription.proto`
       message `chora.tenancy.v1.SubscriptionRenewed`
  contact:
    name: Chora Platform Team (Team 3)
  license:
    name: Proprietary

defaultContentType: application/x-protobuf

servers:
  nats:
    host: nats://localhost:4222
    protocol: nats

channels:
  subscriptionRenewed:
    address: chora.tenancy.subscription.renewed.v1
    messages:
      subscriptionRenewed:
        $ref: '#/components/messages/SubscriptionRenewed'

operations:
  publishSubscriptionRenewed:
    action: send
    channel:
      $ref: '#/channels/subscriptionRenewed'
    messages:
      - $ref: '#/channels/subscriptionRenewed/messages/subscriptionRenewed'

  consumeSubscriptionRenewed:
    action: receive
    channel:
      $ref: '#/channels/subscriptionRenewed'
    description: |
      Consumers: Notifications (renewal confirmation),
      Observability (retention KPI), Audit log.
    messages:
      - $ref: '#/channels/subscriptionRenewed/messages/subscriptionRenewed'

components:
  messages:
    SubscriptionRenewed:
      name: SubscriptionRenewed
      title: Subscription Renewed
      summary: A tenant subscription has been renewed
      contentType: application/x-protobuf
      schemaFormat: application/x-protobuf
      payload:
        schemaFormat: application/x-protobuf
        schema:
          $ref: '../../proto/events/tenancy/subscription.proto#/chora.tenancy.v1.SubscriptionRenewed'
