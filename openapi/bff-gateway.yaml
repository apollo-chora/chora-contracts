openapi: "3.2.0"
info:
  title: "Chora BFF Gateway — Phyllis MVP"
  version: "0.8.0"
  description: |
    Backend-For-Frontend aggregation API for the Phyllis MVP happy-path per
    `docs/m13/phyllis-mvp-2026-05-08.md`. Each route fans out to one or more
    domain services (chora-identity, chora-tenancy, chora-creation,
    chora-delivery, chora-consumption, chora-model-broker-router) and returns
    a normalised JSON response.

    v0.7.0 (2026-06-10, CHO-1708 WP-4): add the me-style mana-pool
    `:auto-renew` proxy (`POST /api/v1/admin/tenants/me/mana-pool:auto-renew`
    → chora-tenancy parametric `setTenantManaPoolAutoRenew`). Like `:topup`,
    the colon suffix needs its own explicit route-table + mux entries.

    v0.4.0 (2026-06-01): add the HITL approve/reject verdict passthrough
    routes (`POST /bff/oplus/governance/hitl/{id}/{approve|reject}`) that
    proxy to chora-governance `POST /api/hitl/decisions/{id}/{approve|reject}`.
    Verdict actions accept an optional free-text `note` (operator rationale) —
    `HITLActionRequest` gains the field; claim/release accept but ignore it.
    Same write-action status mapping as claim/release (200/403/404/409/422/503).
    Contract catch-up — the handlers shipped in `handlers_oplus_hitl.go`; this
    documents them per AP-01.

    v0.3.0 (2026-05-26, N13): add the HITL self-claim + release passthrough
    routes (`POST /bff/oplus/governance/hitl/{id}/{claim|release}`) that
    proxy to chora-governance `POST /api/hitl/decisions/{id}/{claim|release}`
    (N7 wave). Unlike the 5 read routes, claim/release are WRITE actions and
    surface real HTTP status codes (200/403/404/409/422/503) so the FE can
    render targeted toast notifications + retry decisions.

    v0.2.0 (2026-05-26): backfill the 5 O+ Observability+ BFF routes
    (`/bff/oplus/dashboard|dimensions|agents|governance|a2a`) per the
    Phase-C wiring in `handlers_oplus.go`. Every O+ response is wrapped in
    the discriminated-union envelope (`state: live | stale | error |
    pending`); error variants are returned with HTTP 200 + an `error`
    field so the FE can render the in-page error variant rather than a
    5xx page. The 6 ISO 25059:2023 safety-risk tiles are a FE-canonical
    design-time invariant (`SAFETY_RISK_CATEGORIES`) — the BFF
    intentionally does NOT ship a `safety_risks` field on the dashboard
    envelope per audit finding #3.

    Owning service : `chora-bff-gateway`
    Owning team    : Team 3 (Platform)
    Surfaces       : A+ (apex `chora.site`) + H+ (`hplus.chora.site`) for the
                     Phyllis demo flow

    AP-01 (API-First Design): this contract precedes implementation. Routes
    are TDD-tested against `httptest.NewServer` mocks per
    `.claude/rules/development-execution.md`.

    Authorization (MVP): `Authorization: Bearer {gcid}`. The bearer is
    forwarded to chora-identity (and downstream services); full Identity
    Platform OIDC validation lands at M12+. Unknown / missing GCIDs surface
    as 401 from the downstream service via pass-through.

    Trace context: every request emits or propagates W3C `traceparent`. The
    BFF stamps `traceparent` on every outbound fan-out call so Cloud Trace
    can stitch the 8-step happy-path into one trace tree.

    Error model: 401/403/404 from any downstream pass through verbatim.
    5xx upstream cascades are normalised to `502 Bad Gateway`. Per-call
    timeouts (5s) and per-aggregation budgets (15s) surface as
    `504 Gateway Timeout`.
  contact:
    name: "Chora Platform Team (Team 3)"
  license:
    name: "Proprietary"

servers:
  - url: https://api.chora.site
    description: Production
  - url: https://api.dev.chora.site
    description: Development
  - url: http://localhost:8080
    description: Local

tags:
  - name: O+
    description: |
      O+ (Observability+) surface BFF routes — IMDA D1-D4 dashboard,
      per-dimension rubric drilldowns, crews + agents hierarchy,
      governance 3-tab feed, and the A2A console. All routes are
      auditor-role-gated (mounted AFTER chora-session JWT validation
      via `auditor_gate` middleware). Responses use the
      discriminated-union envelope `state: live | stale | error |
      pending` so the FE can render loading/error variants without
      observing HTTP 5xx.
  - name: Identity
    description: GCID + per-course role context (Step 1, 6 of Phyllis happy-path).
  - name: Tenancy
    description: Tenant resolution from auth context (Step 2).
  - name: Courses
    description: Course creation + public catalogue + enrolment (Steps 3, 5, 6).
  - name: Atoms
    description: Atom playback + Daily Dose feedback loop (Steps 7, 8).
  - name: AI
    description: AI Assist generation with Governance Gatekeeper screening (Step 4).
  - name: Companion
    description: RPG companion + daily-dose nudge (Step 8).
  - name: Social
    description: |
      C+ (Connect+) Phyllis MVP social paths — feed, profile, share-to-feed,
      reactions, comments. Per CHO-1457: contract gap closure surfaced by
      A-FE-CPlus audit. Phyllis MVP scope is intentionally narrow — basic
      social discovery only; Leaderboards, Three-Currency Economy,
      Reward Vault, Territory Conquest, Companion Missions, Refer-a-Friend
      are PARKED for M14+.

      Backend handlers are stubs returning 501 Not Implemented or empty
      collections so the C+ Angular surface compiles; full implementation
      lands when chora-sharing learner-facing API ships (M12+).
  - name: Discovery
    description: |
      Public course discovery (Phyllis Step 5, Mr. Chen visibility) — read
      side of public-catalog cross-link from C+ to A+ course detail.

paths:
  /api/me:
    get:
      operationId: getMe
      summary: Get the authenticated user's profile
      description: |
        Fans out to `chora-identity:/me`. Returns GCID, email, display name,
        and linked IdPs. Bearer `gcid` propagated to identity service.
      tags: [Identity]
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /api/me/roles:
    get:
      operationId: getMyRoles
      summary: Get the authenticated user's roles, optionally per course
      description: |
        Fans out to `chora-identity:/me/roles`. When `course_id` is supplied,
        returns the role context within that course (instructor / learner /
        tenant_admin) — Comic Ch4 P8 "Same account, different role per
        course." When omitted, returns ALL roles across courses + tenants.
      tags: [Identity]
      parameters:
        - name: course_id
          in: query
          required: false
          description: Course ID to scope the role query
          schema: { type: string }
      responses:
        "200":
          description: Role context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/tenants/me:
    get:
      operationId: getMyTenant
      summary: Resolve the active tenant from auth context
      description: |
        Reads `X-Tenant-Id` from the request and fans out to
        `chora-tenancy:/tenants/{tenant_id}`. Step 2 of Phyllis happy-path.
      tags: [Tenancy]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          description: Tenant UUID, resolved from session/JWT.
          schema: { type: string }
      responses:
        "200":
          description: Tenant detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        "400":
          description: X-Tenant-Id missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/courses:
    post:
      operationId: createCourse
      summary: Create a course (composite — atom root + course skeleton)
      description: |
        Composite operation per Step 3 of Phyllis happy-path. Sequentially
        calls `chora-creation:/atoms` (root atom) then `chora-delivery:/courses`
        (course skeleton). On success returns `course_id` + `root_atom_id`.
        On any failure short-circuits with 502.
      tags: [Courses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCourseResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /api/catalog:
    get:
      operationId: getCatalog
      summary: List public courses (Udemy moment per Step 5)
      description: |
        Fans out to `chora-delivery:/courses?public=true` — read-side public
        catalogue listing. Used in Step 5 of Phyllis happy-path.
      tags: [Courses]
      parameters:
        - name: public
          in: query
          required: false
          description: Filter to public courses only
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Catalogue listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/enrollments:
    post:
      operationId: createEnrollment
      summary: Enrol the caller in a course
      description: |
        Calls `chora-delivery:/enrollments` and on success emits
        `chora.delivery.enrollment.created.v1` Pub/Sub event. Step 6 of
        Phyllis happy-path — drives the role-flip from instructor (own
        course) to learner (Mr. Chen's course).
      tags: [Courses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnrollmentRequest"
      responses:
        "201":
          description: Enrolment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/atoms/{atom_id}:
    get:
      operationId: getAtom
      summary: Read an atom + parallel session metadata
      description: |
        Parallel fan-out to `chora-creation:/atoms/{id}` and
        `chora-consumption:/atoms/{id}/session`. Returns merged JSON with
        `atom` and `session` blocks. Step 7 of Phyllis happy-path.

        Graceful degradation: if the session call fails, atom is still
        returned with `session_error: upstream_unavailable`.
      tags: [Atoms]
      parameters:
        - name: atom_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Atom + session metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtomResponse"
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/atoms/{atom_id}/feedback:
    post:
      operationId: submitFeedback
      summary: Submit SM-2 spaced-repetition feedback for an atom
      description: |
        Calls `chora-consumption:/atoms/{atom_id}/feedback`. Used by Daily
        Dose to tune SM-2 retention scheduling per the Ebbinghaus formula
        `R(t) = e^(-t/S)`.
      tags: [Atoms]
      parameters:
        - name: atom_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "202":
          description: Feedback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/atoms/{atom_id}/revisions:
    get:
      operationId: listAtomRevisions
      summary: List revision history for an atom
      description: |
        Proxies `GET /api/atoms/{atom_id}/revisions` verbatim to
        `chora-creation` at the same path (per
        `chora-contracts/openapi/creation-admin.yaml::listAtomRevisions`).
        Returns an `AtomRevisionPage` with cursor-based pagination.
        Used by the A+ atom-revisions view (WS-7b).

        Auth: requires Bearer ChoraSession JWT. Tenant RLS enforced
        downstream by chora-creation via `X-Tenant-Id` mesh header.

        Status passthrough: 401 / 403 / 404 forwarded verbatim; 5xx
        normalised to 502 `GATEWAY_UPSTREAM_5XX`.
      tags: [Atoms]
      parameters:
        - name: atom_id
          in: path
          required: true
          schema: { type: string }
          description: "UUIDv7 atom identifier."
        - name: page_size
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
          description: "Number of revisions to return per page."
        - name: page_token
          in: query
          required: false
          schema: { type: string }
          description: "Opaque cursor returned in next_page_token from a previous response."
      responses:
        "200":
          description: "Revision page returned."
          content:
            application/json:
              schema:
                type: object
                description: "AtomRevisionPage — verbatim body from chora-creation (creation-admin.yaml::AtomRevisionPage)."
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "Forbidden — caller lacks AUTHOR / INSTRUCTOR / ADMIN role on the tenant."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  # ---------------------------------------------------------------------------
  # Personal Collections (CHO-1618, 2026-06-01) — 7 routes proxied verbatim to
  # chora-creation at the SAME path (per
  # `chora-contracts/openapi/creation-admin.yaml` §Collections). The gateway
  # forwards method + path + body + query unchanged; mesh-trust headers
  # (X-Tenant-Id + lowercase gcid) are stamped so chora-creation's
  # tenantContext middleware + RLS resolve the caller. Status passthrough:
  # 401 / 403 / 404 / 409 / 422 forwarded verbatim; 5xx normalised to 502
  # `GATEWAY_UPSTREAM_5XX`. Unblocks the A+ Collections FE (WS-6b-BE-A1).
  # ---------------------------------------------------------------------------
  /api/v1/collections:
    post:
      operationId: createCollection
      summary: "Create a new personal Collection"
      description: |
        Proxies `POST /api/v1/collections` verbatim to `chora-creation` at the
        same path (per `creation-admin.yaml::createCollection`). The owning
        gcid is resolved downstream from the stamped `gcid` mesh header.
      tags: [Collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionRequest"
      responses:
        "201":
          description: "Collection created."
          content:
            application/json:
              schema:
                type: object
                description: "Collection — verbatim body from chora-creation (creation-admin.yaml::Collection)."
                additionalProperties: true
        "400":
          description: "Invalid body (CREATION_INVALID_BODY / CREATION_COLLECTION_INVALID)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/me/collections:
    get:
      operationId: listMyCollections
      summary: "List the caller's personal Collections"
      description: |
        Proxies `GET /api/v1/me/collections` verbatim to `chora-creation` at
        the same path (per `creation-admin.yaml::listMyCollections`). Returns
        the caller's Collections in the active tenant; soft-deleted rows are
        filtered out downstream.
      tags: [Collections]
      responses:
        "200":
          description: "Collections listed."
          content:
            application/json:
              schema:
                type: object
                description: "CollectionListResponse — verbatim body from chora-creation (creation-admin.yaml::CollectionListResponse)."
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/collections/{collection_id}:
    parameters:
      - name: collection_id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: "UUIDv7 Collection identifier."
    get:
      operationId: getCollection
      summary: "Fetch a Collection by ID (visibility-gated)"
      description: |
        Proxies `GET /api/v1/collections/{collection_id}` verbatim to
        `chora-creation` at the same path (per
        `creation-admin.yaml::getCollection`).
      tags: [Collections]
      responses:
        "200":
          description: "Collection retrieved."
          content:
            application/json:
              schema:
                type: object
                description: "Collection — verbatim body from chora-creation (creation-admin.yaml::Collection)."
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
    patch:
      operationId: patchCollection
      summary: "Update Collection metadata (owner only)"
      description: |
        Proxies `PATCH /api/v1/collections/{collection_id}` verbatim to
        `chora-creation` at the same path (per
        `creation-admin.yaml::patchCollection`). Owner gate enforced downstream
        (403 when gcid != owner_gcid).
      tags: [Collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCollectionRequest"
      responses:
        "200":
          description: "Collection updated."
          content:
            application/json:
              schema:
                type: object
                description: "Collection — verbatim body from chora-creation (creation-admin.yaml::Collection)."
                additionalProperties: true
        "400":
          description: "Invalid body (CREATION_INVALID_BODY / CREATION_COLLECTION_INVALID)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "Forbidden — caller is not the Collection owner."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
    delete:
      operationId: deleteCollection
      summary: "Soft-delete a Collection (owner only)"
      description: |
        Proxies `DELETE /api/v1/collections/{collection_id}` verbatim to
        `chora-creation` at the same path (per
        `creation-admin.yaml::deleteCollection`). Owner gate enforced
        downstream. 204 (no body) passes through verbatim.
      tags: [Collections]
      responses:
        "204":
          description: "Collection soft-deleted."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "Forbidden — caller is not the Collection owner."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/collections/{collection_id}/atoms:
    parameters:
      - name: collection_id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: "UUIDv7 Collection identifier."
    post:
      operationId: addCollectionAtom
      summary: "Add an atom to a Collection"
      description: |
        Proxies `POST /api/v1/collections/{collection_id}/atoms` verbatim to
        `chora-creation` at the same path (per
        `creation-admin.yaml::addCollectionAtom`).
      tags: [Collections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCollectionAtomRequest"
      responses:
        "201":
          description: "Atom added; returns the updated Collection."
          content:
            application/json:
              schema:
                type: object
                description: "Collection — verbatim body from chora-creation (creation-admin.yaml::Collection)."
                additionalProperties: true
        "400":
          description: "Invalid body (atom_id required)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "Forbidden — caller is not owner OR cross-tenant atom on non-PUBLIC collection."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Atom is already in the Collection."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: "Atom cap exceeded."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/v1/collections/{collection_id}/atoms/{atom_id}:
    parameters:
      - name: collection_id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: "UUIDv7 Collection identifier."
      - name: atom_id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: "UUIDv7 LearningAtom identifier."
    delete:
      operationId: removeCollectionAtom
      summary: "Remove an atom from a Collection"
      description: |
        Proxies `DELETE /api/v1/collections/{collection_id}/atoms/{atom_id}`
        verbatim to `chora-creation` at the same path (per
        `creation-admin.yaml::removeCollectionAtom`). 204 (no body) passes
        through verbatim.
      tags: [Collections]
      responses:
        "204":
          description: "Atom removed."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "Forbidden — caller is not the Collection owner."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/ai/generate:
    post:
      operationId: aiGenerate
      summary: AI Assist generation with Governance Gatekeeper screening
      description: |
        Calls `chora-model-broker-router:/generate`. The router internally
        invokes `chora-guardrail:/screen` (Tier-4 risk class — Cloud Model
        Armor + DLP + regex baseline + output validators per
        `ai-runtime-guardrails` skill). Verdict pass-through:

        - `approved`: content is safe, return as-is.
        - `remediated`: original content was biased/harmful, return a
          replacement (Comic Ch6 P13 "Waterfall vs Agile" → balanced
          comparison).
        - `blocked`: refuse with 422 and a violation envelope.

        Step 4 of Phyllis happy-path.
      tags: [AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: Generation result (approved or remediated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /api/companion/me:
    get:
      operationId: getCompanionMe
      summary: Get the caller's Companion (RPG companion)
      description: |
        Calls `chora-consumption:/companion/me`. Companion is a domain entity
        in Content Consumption — distinct from the AI agent that powers it
        (per memory `feedback_companion_vs_agent`).
      tags: [Companion]
      responses:
        "200":
          description: Companion state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/companion/daily-dose:
    get:
      operationId: getDailyDose
      summary: Get the caller's Daily Dose composition (5 atoms)
      description: |
        Calls `chora-consumption:/companion/daily-dose`. Returns a
        deterministic 5-atom composition: 40% Ebbinghaus + 30% curiosity +
        30% weakness per `ux_engagement.md` §2. Step 8 of Phyllis happy-path
        — the closing nudge.

        Phase 2A — the optional `growth_edge_id` query param scopes the dose
        to a focused single-Growth-Edge practice session: the whole 5-atom
        budget drills that one edge (cached drill atoms first, then topic/tag
        matches). Omitted ⇒ the standard composition (additive, backward-
        compatible).
      tags: [Companion]
      parameters:
        - name: growth_edge_id
          in: query
