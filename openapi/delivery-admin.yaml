  # -----------------------------------------------------------------
  # WBL Placements
  # -----------------------------------------------------------------

  /api/v1/wbl-placements:
    get:
      operationId: listWblPlacements
      summary: "List WBL placements"
      tags: [WBL Placements]
      parameters:
        - in: query
          name: learner_gcid
          schema: { type: string }
        - in: query
          name: host_org_id
          schema: { type: string }
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: "Placements returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WblPlacementList"
    post:
      operationId: createWblPlacement
      summary: "Create a WBL placement"
      tags: [WBL Placements]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWblPlacementRequest"
      responses:
        "201":
          description: "Placement created — emits chora.delivery.wbl.placement_created.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WblPlacement"

  /api/v1/wbl-placements/{placement_id}:
    parameters:
      - $ref: "#/components/parameters/PlacementId"
    get:
      operationId: getWblPlacement
      summary: "Get a WBL placement"
      tags: [WBL Placements]
      responses:
        "200":
          description: "Placement returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WblPlacement"
    patch:
      operationId: updateWblPlacement
      summary: "Update a WBL placement (status, hours)"
      tags: [WBL Placements]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWblPlacementRequest"
      responses:
        "200":
          description: "Placement updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WblPlacement"
    delete:
      operationId: deleteWblPlacement
      summary: "Soft-delete a WBL placement"
