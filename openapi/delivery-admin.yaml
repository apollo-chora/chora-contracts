          description: "Project group returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGroup"
    delete:
      operationId: deleteProjectGroup
      summary: "Soft-delete a project group"
      tags: [Project Groups]
      responses:
        "204":
          description: "Project group soft-deleted"

  /api/v1/project-groups/{group_id}/submit:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: submitProjectGroup
      summary: "Submit the project group's deliverable"
      tags: [Project Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProjectRequest"
      responses:
        "200":
          description: "Submitted — emits chora.delivery.project_group.submitted.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGroup"

  /api/v1/project-groups/{group_id}/grade:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: gradeProjectGroup
      summary: "Grade a project group"
      tags: [Project Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeProjectRequest"
