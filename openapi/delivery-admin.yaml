  # -----------------------------------------------------------------
  # Phyllis MVP — Public Catalogue + Enrollment (Comic Ch5 P10, Ch4 P8)
  # -----------------------------------------------------------------

  /courses:
    get:
      operationId: listPublicCourses
      summary: "List public catalogue courses (Phyllis MVP)"
      description: |
        Public catalogue list (Comic Ch5 P10 — "300+ enrolled" headline).
        Supports public/private filter, free-text search across title +
        tags, and 1-indexed pagination.
      tags: [Catalogue]
      parameters:
        - in: query
          name: public
          schema: { type: string, enum: [true, false] }
        - in: query
          name: q
          schema: { type: string, maxLength: 256 }
        - $ref: "#/components/parameters/CataloguePage"
        - $ref: "#/components/parameters/CataloguePer"
      responses:
        "200":
          description: "Catalogue page returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCourseList"
    post:
      operationId: createPublicCourse
      summary: "Create a public catalogue course (instructor-only)"
      description: |
        Creates a Course with marketplace metadata. The `gcid` header is
        required and is recorded as the instructor identity. Emits
        `chora.delivery.course.created.v1`.
      tags: [Catalogue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublicCourseRequest"
      responses:
        "201":
          description: "Course created — emits chora.delivery.course.created.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCourse"
        "400":
          description: "Invalid input"
        "401":
          description: "gcid header missing"

  /courses/{course_id}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      operationId: getPublicCourse
      summary: "Get a single public catalogue course"
      tags: [Catalogue]
      responses:
        "200":
          description: "Public course returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCourse"
        "404":
          description: "Not found"

  /enrollments:
    post:
      operationId: createEnrollment
      summary: "Same-identity enrolment (Comic Ch4 P8)"
      description: |
        Stores an enrolment row linking gcid + course_id. Does NOT create
        a new user account. Idempotent on (course_id, gcid): a duplicate
        POST returns 200 with the existing row instead of 409. Emits
        `chora.delivery.enrollment.created.v1` ONLY on a fresh insert.
      tags: [Enrollments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnrollmentRequest"
      responses:
        "201":
          description: "Enrolment created — emits chora.delivery.enrollment.created.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "200":
          description: "Idempotent retry — existing enrolment returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "400":
          description: "Missing gcid or course_id"
        "404":
          description: "Course not found"

  /me/enrollments:
    get:
      operationId: listMyEnrollments
      summary: "List the current user's enrolments (Comic Ch4 P3 dual-card)"
      description: |
        Returns every active enrolment row for the current gcid + tenant.
        The dashboard uses this to render the dual-card view (CSPO →
        Instructor / CSM-Prep → Learner) per Comic Ch4 P3.
      tags: [Enrollments]
      responses:
        "200":
          description: "Enrolments returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentList"
        "401":
          description: "gcid header missing"

  # -----------------------------------------------------------------
  # Courses by instructor (FE A6 instructor-roster surface)
  # -----------------------------------------------------------------

  /api/v1/instructors/{instructor_gcid}/courses:
    parameters:
      - in: path
        name: instructor_gcid
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listCoursesByInstructor
      summary: "List courses authored by an instructor"
      description: |
        Returns the courses where `instructor_gcid` matches the path
        parameter, scoped to the caller's tenant. RLS on the `courses`
        table enforces the cross-tenant boundary.

        Closes debt #4 / A6 per docs/m13/handoff-fe-to-be-service-2026-05-14.md:
        FE expected a single by-instructor endpoint and was previously forced
        to fetch the full catalogue + client-filter (expensive + leaky).

        **Authorization**: caller must be either
          - the instructor themselves (`gcid` claim equals `instructor_gcid` path), OR
          - hold the `instructor` or `admin` role in the active tenant (read via
            the `x-mesh-user-roles` header per Bucket 4 servicemesh convention).

        Other authenticated callers receive `403`.

        **Soft-delete**: rows with `deleted_at IS NOT NULL` are filtered out.
        **Pagination**: 1-indexed page/per (mirrors `/courses` catalogue
        list pagination). Results are stable-sorted by course_id (UUIDv7 ⇒
        creation order, oldest first).
      tags: [Catalogue]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        "200":
          description: "Page of courses authored by the instructor"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCourseList"
        "401":
          description: "X-Tenant-Id or gcid header missing"
        "403":
          description: "Caller is not the instructor and lacks the instructor/admin role"
        "422":
          description: "Path parameter not a valid UUID"

  # -----------------------------------------------------------------
  # Health
  # -----------------------------------------------------------------

  /api/v1/health:
    get:
      operationId: healthCheck
      summary: "Service health check"
      tags: [Health]
      security: []
      responses:
        "200":
          description: "Healthy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "OIDC JWT issued by Identity Platform."

  parameters:
    CourseId:
      in: path
      name: course_id
      required: true
      schema: { type: string, format: uuid }
    BookingId:
      in: path
      name: booking_id
      required: true
      schema: { type: string, format: uuid }
    CertId:
      in: path
      name: cert_id
      required: true
      schema: { type: string, format: uuid }
    ClaimId:
      in: path
      name: claim_id
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      in: path
      name: group_id
      required: true
      schema: { type: string, format: uuid }
    ExamId:
      in: path
      name: exam_id
      required: true
      schema: { type: string, format: uuid }
    PlacementId:
      in: path
      name: placement_id
      required: true
      schema: { type: string, format: uuid }
    SurveyId:
      in: path
      name: survey_id
      required: true
      schema: { type: string, format: uuid }
    PageOffset:
      in: query
      name: offset
      schema: { type: integer, minimum: 0, default: 0 }
    PageLimit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    CataloguePage:
      in: query
      name: page
      description: "1-indexed page number (Phyllis MVP catalogue)."
      schema: { type: integer, minimum: 1, default: 1 }
    CataloguePer:
      in: query
      name: per
      description: "Items per page (Phyllis MVP catalogue)."
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }

  schemas:

    # ---- Enums (mirrors of proto enums) -------------------------------

    Modality:
      type: string
      enum: [MODALITY_IN_PERSON, MODALITY_ONLINE_SYNC, MODALITY_ONLINE_ASYNC, MODALITY_BLENDED]

    BookingStatus:
      type: string
      enum: [BOOKING_STATUS_PENDING, BOOKING_STATUS_CONFIRMED, BOOKING_STATUS_CANCELLED, BOOKING_STATUS_NO_SHOW, BOOKING_STATUS_COMPLETED]

    AssignmentType:
      type: string
      enum: [ASSIGNMENT_TYPE_MANUAL, ASSIGNMENT_TYPE_BULK_IMPORT, ASSIGNMENT_TYPE_AUTO_ALLOCATED]

    CertType:
      type: string
      enum: [CERT_TYPE_COMPLETION, CERT_TYPE_COMPETENCY, CERT_TYPE_ACCREDITED, CERT_TYPE_MICRO_CREDENTIAL]

    ClaimStatus:
      type: string
      enum: [CLAIM_STATUS_SUBMITTED, CLAIM_STATUS_UNDER_REVIEW, CLAIM_STATUS_APPROVED, CLAIM_STATUS_REJECTED, CLAIM_STATUS_DISBURSED]

    ProctorMethod:
      type: string
      enum: [PROCTOR_METHOD_NONE, PROCTOR_METHOD_AUTO_AI, PROCTOR_METHOD_HUMAN_LIVE, PROCTOR_METHOD_HUMAN_RECORDED]

    PassFail:
      type: string
      enum: [PASS_FAIL_PASS, PASS_FAIL_FAIL]

    IncidentSeverity:
      type: string
      enum: [INCIDENT_SEVERITY_LOW, INCIDENT_SEVERITY_MEDIUM, INCIDENT_SEVERITY_HIGH, INCIDENT_SEVERITY_CRITICAL]

    # ---- Course --------------------------------------------------------

    Course:
      type: object
      required: [course_id, title, modality, status, created_at]
      properties:
        course_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 256 }
        instructor_gcid: { type: string }
        atom_path_id: { type: string }
        modality: { $ref: "#/components/schemas/Modality" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        capacity: { type: integer }
        status:
          type: string
          enum: [DRAFT, SCHEDULED, COMPLETED, CANCELLED]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }

    CourseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Course" }
        total: { type: integer }

    CreateCourseRequest:
      type: object
      required: [title, modality]
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        instructor_gcid: { type: string }
        atom_path_id: { type: string }
        modality: { $ref: "#/components/schemas/Modality" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        capacity: { type: integer, minimum: 0 }

    UpdateCourseRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        instructor_gcid: { type: string }
        atom_path_id: { type: string }
        modality: { $ref: "#/components/schemas/Modality" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        capacity: { type: integer, minimum: 0 }

    CancelRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 512 }

    # ---- Booking -------------------------------------------------------

    Booking:
      type: object
      required: [booking_id, course_id, learner_gcid, status, created_at]
      properties:
        booking_id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        learner_gcid: { type: string }
        status: { $ref: "#/components/schemas/BookingStatus" }
        seat_number: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }

    BookingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Booking" }
        total: { type: integer }

    CreateBookingRequest:
      type: object
      required: [course_id, learner_gcid]
      properties:
        course_id: { type: string, format: uuid }
        learner_gcid: { type: string }
        seat_number: { type: integer, minimum: 0 }

    # ---- Roster --------------------------------------------------------

    RosterEntry:
      type: object
      required: [learner_gcid, assignment_type]
      properties:
        learner_gcid: { type: string }
        assignment_type: { $ref: "#/components/schemas/AssignmentType" }
        rostered_at: { type: string, format: date-time }

    Roster:
      type: object
      required: [roster_id, course_id, entries, finalized]
      properties:
        roster_id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        entries:
          type: array
          items: { $ref: "#/components/schemas/RosterEntry" }
        finalized: { type: boolean }
        finalized_at: { type: string, format: date-time }

    AddRosterEntryRequest:
      type: object
      required: [learner_gcid, assignment_type]
      properties:
        learner_gcid: { type: string }
        assignment_type: { $ref: "#/components/schemas/AssignmentType" }

    UpdateRosterRequest:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/RosterEntry" }
        finalize:
          type: boolean
          description: "Set true to finalize the roster — emits rostering.finalized.v1"

    # ---- Certification ------------------------------------------------

    Certification:
      type: object
      required: [cert_id, learner_gcid, course_id, cert_type, issued_at]
      properties:
        cert_id: { type: string, format: uuid }
        learner_gcid: { type: string }
        course_id: { type: string, format: uuid }
        cert_type: { $ref: "#/components/schemas/CertType" }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        revocation_reason: { type: string, maxLength: 512, nullable: true }

    CertificationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Certification" }
        total: { type: integer }

    IssueCertRequest:
      type: object
      required: [learner_gcid, course_id, cert_type]
      properties:
        learner_gcid: { type: string }
        course_id: { type: string, format: uuid }
        cert_type: { $ref: "#/components/schemas/CertType" }
        expires_at: { type: string, format: date-time }

    RevokeCertRequest:
      type: object
      required: [revocation_reason]
      properties:
        revocation_reason: { type: string, maxLength: 512 }

    # ---- SkillsFutures ------------------------------------------------

    SkillsFuturesClaim:
      type: object
      required: [claim_id, learner_gcid, course_id, claim_amount, claim_status, ssg_reference_id]
      properties:
        claim_id: { type: string, format: uuid }
        learner_gcid: { type: string }
        course_id: { type: string, format: uuid }
        claim_amount:
          type: integer
          description: "Amount in cents (e.g., 50000 = SGD 500.00)."
        claim_status: { $ref: "#/components/schemas/ClaimStatus" }
        ssg_reference_id: { type: string }
        rejection_reason: { type: string, maxLength: 512, nullable: true }
        claimed_at: { type: string, format: date-time }
        approved_at: { type: string, format: date-time, nullable: true }
        rejected_at: { type: string, format: date-time, nullable: true }
        disbursed_at: { type: string, format: date-time, nullable: true }

    SkillsFuturesClaimList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SkillsFuturesClaim" }
        total: { type: integer }

    CreateSkillsFuturesClaimRequest:
      type: object
      required: [learner_gcid, course_id, claim_amount, ssg_reference_id]
      properties:
        learner_gcid: { type: string }
        course_id: { type: string, format: uuid }
        claim_amount: { type: integer, minimum: 0 }
        ssg_reference_id: { type: string }

    RejectClaimRequest:
      type: object
      required: [rejection_reason]
      properties:
        rejection_reason: { type: string, maxLength: 512 }

    # ---- ProjectGroup -------------------------------------------------

    ProjectGroup:
      type: object
      required: [group_id, course_id, member_gcids, status]
      properties:
        group_id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        member_gcids:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [FORMED, SUBMITTED, GRADED]
        submission_url: { type: string, format: uri, nullable: true }
        grade: { type: integer, minimum: 0, maximum: 100, nullable: true }
        formed_at: { type: string, format: date-time }
        submitted_at: { type: string, format: date-time, nullable: true }
        graded_at: { type: string, format: date-time, nullable: true }

    ProjectGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectGroup" }
        total: { type: integer }

    CreateProjectGroupRequest:
      type: object
      required: [course_id, member_gcids]
      properties:
        course_id: { type: string, format: uuid }
        member_gcids:
          type: array
          items: { type: string }
          minItems: 1

    SubmitProjectRequest:
      type: object
      required: [submission_url]
      properties:
        submission_url: { type: string, format: uri }

    GradeProjectRequest:
      type: object
      required: [grade]
      properties:
        grade: { type: integer, minimum: 0, maximum: 100 }

    # ---- Exam ---------------------------------------------------------

    Exam:
      type: object
      required: [exam_id, course_id, candidate_gcid, status]
      properties:
        exam_id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        candidate_gcid: { type: string }
        scheduled_for: { type: string, format: date-time, nullable: true }
        proctor_method: { $ref: "#/components/schemas/ProctorMethod" }
        score: { type: integer, minimum: 0, maximum: 100, nullable: true }
        pass_fail: { $ref: "#/components/schemas/PassFail" }
        status:
          type: string
          enum: [DRAFT, SCHEDULED, ADMINISTERED, GRADED]
        graded_at: { type: string, format: date-time, nullable: true }

    ExamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Exam" }
        total: { type: integer }

    CreateExamRequest:
      type: object
      required: [course_id, candidate_gcid, proctor_method]
      properties:
        course_id: { type: string, format: uuid }
        candidate_gcid: { type: string }
        proctor_method: { $ref: "#/components/schemas/ProctorMethod" }

    ScheduleExamRequest:
      type: object
      required: [scheduled_for]
      properties:
        scheduled_for: { type: string, format: date-time }

    GradeExamRequest:
      type: object
      required: [score, pass_fail]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        pass_fail: { $ref: "#/components/schemas/PassFail" }

    # ---- WblPlacement -------------------------------------------------

    WblPlacement:
      type: object
      required: [placement_id, learner_gcid, host_org_id, mentor_gcid, status]
      properties:
        placement_id: { type: string, format: uuid }
        learner_gcid: { type: string }
        host_org_id: { type: string }
        mentor_gcid: { type: string }
        scheduled_start: { type: string, format: date-time }
        scheduled_end: { type: string, format: date-time }
        hours_completed: { type: number, format: float, nullable: true }
        status:
          type: string
          enum: [CREATED, STARTED, COMPLETED]
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }

    WblPlacementList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WblPlacement" }
        total: { type: integer }

    CreateWblPlacementRequest:
      type: object
      required: [learner_gcid, host_org_id, mentor_gcid, scheduled_start, scheduled_end]
      properties:
        learner_gcid: { type: string }
        host_org_id: { type: string }
        mentor_gcid: { type: string }
        scheduled_start: { type: string, format: date-time }
        scheduled_end: { type: string, format: date-time }

    UpdateWblPlacementRequest:
      type: object
      properties:
        status:
          type: string
          enum: [STARTED, COMPLETED]
        hours_completed: { type: number, format: float, minimum: 0 }

    # ---- Survey -------------------------------------------------------

    Survey:
      type: object
      required: [survey_id, status]
      properties:
        survey_id: { type: string, format: uuid }
        course_id: { type: string, nullable: true }
        title: { type: string, minLength: 1, maxLength: 256 }
        status:
          type: string
          enum: [DRAFT, DISTRIBUTED, CLOSED]
        distributed_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }

    SurveyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Survey" }
        total: { type: integer }

    CreateSurveyRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        course_id: { type: string }

    # ---- CampusOps ----------------------------------------------------

    CampusBooking:
      type: object
      required: [booking_id, resource_id, starts_at, ends_at]
      properties:
        booking_id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        course_id: { type: string, nullable: true }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }

    CampusBookingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CampusBooking" }
        total: { type: integer }

    CreateCampusBookingRequest:
      type: object
      required: [resource_id, starts_at, ends_at]
      properties:
        resource_id: { type: string, format: uuid }
        course_id: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }

    Incident:
      type: object
      required: [booking_id, incident_severity, reported_at]
      properties:
        booking_id: { type: string, format: uuid }
        resource_id: { type: string, nullable: true }
        course_id: { type: string, nullable: true }
        starts_at: { type: string, format: date-time, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        incident_severity: { $ref: "#/components/schemas/IncidentSeverity" }
        description: { type: string, maxLength: 1024 }
        reported_by_gcid: { type: string }
        reported_at: { type: string, format: date-time }

    IncidentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Incident" }
        total: { type: integer }

    ReportIncidentRequest:
      type: object
      required: [incident_severity, description]
      properties:
        resource_id: { type: string }
        course_id: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        incident_severity: { $ref: "#/components/schemas/IncidentSeverity" }
        description: { type: string, maxLength: 1024 }

    # ---- Phyllis MVP — Public Catalogue ------------------------------

    PublicCourse:
      type: object
      description: |
        Marketplace-facing read model for a Course (Phyllis MVP, Comic Ch5 P10).
        InstructorName is a denormalised projection of the Identity record
        for low-latency reads; it refreshes on identity-update events.
      required:
        - id
        - tenant_id
        - title
        - instructor_gcid
        - price_sgd_cents
        - is_free
        - public
        - tags
        - syllabus_outline_count
        - enrolled_count
        - created_at
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 256 }
        instructor_gcid: { type: string }
        instructor_name: { type: string }
        price_sgd_cents: { type: integer, minimum: 0 }
        is_free: { type: boolean }
        public: { type: boolean }
        sf_eligible: { type: boolean }
        tags:
          type: array
          items: { type: string, maxLength: 64 }
        syllabus_outline_count: { type: integer, minimum: 0 }
        enrolled_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }

    PublicCourseList:
      type: object
      required: [items, total, page, per]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PublicCourse" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        per: { type: integer, minimum: 1 }

    CreatePublicCourseRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 256 }
        syllabus_outline:
          type: array
          items: { type: string, maxLength: 256 }
        tags:
          type: array
          items: { type: string, maxLength: 64 }
        price_sgd_cents: { type: integer, minimum: 0 }
        public: { type: boolean }
        sf_eligible: { type: boolean }
        instructor_name: { type: string, maxLength: 256 }

    # ---- Phyllis MVP — Enrollments -----------------------------------

    BulkEnrollRosterRequest:
      type: object
      required: [course_id, gcids]
      properties:
        course_id: { type: string, format: uuid, description: "Must be one of the offering's attached courses" }
        gcids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
    BulkEnrollRosterResult:
      type: object
      required: [course_id, requested_count, inserted_count, enrollment_ids]
      properties:
        course_id: { type: string, format: uuid }
        requested_count: { type: integer, description: "Distinct gcids in the request after de-dup" }
        inserted_count: { type: integer, description: "Newly enrolled (fresh or revived); excludes already-active" }
        enrollment_ids:
          type: array
          items: { type: string, format: uuid }
    Enrollment:
      type: object
      required: [id, tenant_id, course_id, gcid, enrolled_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        gcid: { type: string }
        enrolled_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }

    EnrollmentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Enrollment" }
        total: { type: integer, minimum: 0 }

    CreateEnrollmentRequest:
      type: object
      required: [course_id]
      properties:
        course_id: { type: string, format: uuid }
        gcid:
          type: string
          description: |
            Optional in body — falls back to the gcid header (auth-derived).
            Same-identity invariant: never creates a new user; just stores
            the (course_id, gcid) row.

    # ---- Health -------------------------------------------------------

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [OK, DEGRADED]
        version: { type: string }
