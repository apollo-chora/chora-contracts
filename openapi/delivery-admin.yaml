        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: "Project groups returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGroupList"
    post:
      operationId: createProjectGroup
      summary: "Form a new project group"
      tags: [Project Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectGroupRequest"
      responses:
        "201":
