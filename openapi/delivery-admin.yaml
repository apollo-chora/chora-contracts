        - in: query
          name: course_id
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: "Certifications returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificationList"
    post:
      operationId: issueCertification
      summary: "Issue a certification"
      tags: [Certifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCertRequest"
      responses:
        "201":
          description: "Cert issued — emits chora.delivery.certification.issued.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"

  /api/v1/certifications/{cert_id}:
    parameters:
      - $ref: "#/components/parameters/CertId"
    get:
      operationId: getCertification
      summary: "Get a certification"
      tags: [Certifications]
      responses:
        "200":
          description: "Certification returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"

  /api/v1/certifications/{cert_id}/revoke:
    parameters:
      - $ref: "#/components/parameters/CertId"
    post:
      operationId: revokeCertification
      summary: "Revoke a certification"
      tags: [Certifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeCertRequest"
      responses:
        "200":
          description: "Cert revoked — emits chora.delivery.certification.revoked.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"

  # -----------------------------------------------------------------
  # SkillsFutures claims
  # -----------------------------------------------------------------

  /api/v1/skillsfutures-claims:
    get:
      operationId: listSkillsFuturesClaims
      summary: "List SkillsFutures claims"
      tags: [SkillsFutures]
      parameters:
        - in: query
          name: learner_gcid
          schema: { type: string }
        - in: query
          name: claim_status
          schema: { $ref: "#/components/schemas/ClaimStatus" }
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: "Claims returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsFuturesClaimList"
    post:
      operationId: createSkillsFuturesClaim
      summary: "Submit a SkillsFutures claim"
      tags: [SkillsFutures]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSkillsFuturesClaimRequest"
      responses:
        "201":
          description: "Claim submitted — emits chora.delivery.skillsfutures.claimed.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsFuturesClaim"

  /api/v1/skillsfutures-claims/{claim_id}:
    parameters:
      - $ref: "#/components/parameters/ClaimId"
    get:
      operationId: getSkillsFuturesClaim
      summary: "Get a claim"
      tags: [SkillsFutures]
      responses:
        "200":
          description: "Claim returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsFuturesClaim"

  /api/v1/skillsfutures-claims/{claim_id}/approve:
    parameters:
      - $ref: "#/components/parameters/ClaimId"
    post:
      operationId: approveSkillsFuturesClaim
      summary: "Approve a SkillsFutures claim (admin or SSG callback)"
      tags: [SkillsFutures]
      responses:
        "200":
          description: "Claim approved — emits chora.delivery.skillsfutures.approved.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsFuturesClaim"

  /api/v1/skillsfutures-claims/{claim_id}/reject:
    parameters:
      - $ref: "#/components/parameters/ClaimId"
    post:
      operationId: rejectSkillsFuturesClaim
      summary: "Reject a SkillsFutures claim"
      tags: [SkillsFutures]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectClaimRequest"
      responses:
        "200":
          description: "Claim rejected — emits chora.delivery.skillsfutures.rejected.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsFuturesClaim"

  # -----------------------------------------------------------------
  # Project Groups
  # -----------------------------------------------------------------

  /api/v1/project-groups:
    get:
      operationId: listProjectGroups
      summary: "List project groups"
      tags: [Project Groups]
      parameters:
        - in: query
          name: course_id
