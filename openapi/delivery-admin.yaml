openapi: "3.2.0"
info:
  title: "Chora Delivery Admin API"
  version: "1.1.0"
  description: |
    Unified admin/instructor REST surface for the Content Delivery domain
    (`chora-delivery` service, `chora_delivery` database, R+ Rhythm+ surface).
    Owning team: Team 2 (Delivery).

    Per ADR-129/130/131 collapse mandate (M11.6 review), this single spec
    supersedes the legacy training-admin / classroom / examadmin / wbl /
    campusops / survey OpenAPI services. All admin / instructor admin CRUD
    for Content Delivery aggregates lives here.

    Aggregates exposed:
      - Course / Class
      - Booking
      - Roster
      - Certification
      - SkillsFutures claim
      - ProjectGroup
      - ProctoredExam
      - WorkBasedLearning placement
      - Survey
      - CampusOps (rooms / equipment / incidents)

    AP-01: This contract exists BEFORE implementation.

    Cross-domain reads (atom content, learner profiles, etc.) are NOT served
    here — Delivery never JOINs other domain databases. Admin/instructor reads
    of related cross-domain data flow through Pub/Sub-fed local projections.
  contact:
    name: "Chora Platform Team"
  license:
    name: "Proprietary"

servers:
  - url: "http://localhost:8086"
    description: "Local development"
  - url: "https://api.chora.app"
    description: "Production"

security:
  - BearerAuth: []

tags:
  - name: Courses
    description: "Course / Class aggregate — admin lifecycle"
  - name: Bookings
    description: "Booking aggregate — enrolment + confirmation + cancellation"
  - name: Rosters
    description: "Roster aggregate — instructor + learner assignment matrix"
  - name: Certifications
    description: "Certification aggregate — issue + revoke"
  - name: SkillsFutures
    description: "SkillsFuturesSubmission aggregate — SG SSG claim workflow"
  - name: Project Groups
    description: "ProjectGroup aggregate — cohort group work"
  - name: Exams
    description: "ProctoredExam aggregate — schedule + administer + grade"
  - name: WBL Placements
    description: "Work-Based Learning placement aggregate"
  - name: Surveys
    description: "Survey aggregate — distribute + close"
  - name: Campus Ops
    description: "Room / equipment / incident operations"
  - name: Catalogue
    description: |
      Public Course catalogue (Phyllis MVP — Comic Ch5 P10 "Udemy moment").
      Discovery / detail / instructor-create endpoints; same-identity
      enrollment per Comic Ch4 P8.
  - name: Enrollments
    description: |
      Same-identity enrollment (Comic Ch5 P10 P3). POST does NOT create a
      new user — it adds a row linking gcid + course_id. Role context is
      computed downstream by chora-identity.
  - name: Health
    description: "Service health check"

paths:

  # -----------------------------------------------------------------
  # Courses
  # -----------------------------------------------------------------

  /api/v1/courses:
    get:
      operationId: listCourses
      summary: "List courses"
      tags: [Courses]
      parameters:
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: "Courses returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseList"
    post:
      operationId: createCourse
      summary: "Create a new course"
      tags: [Courses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
      responses:
        "201":
          description: "Course created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /api/v1/courses/{course_id}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      operationId: getCourse
      summary: "Get a course by ID"
      tags: [Courses]
      responses:
        "200":
          description: "Course returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    patch:
      operationId: updateCourse
      summary: "Update course metadata"
      tags: [Courses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseRequest"
      responses:
        "200":
          description: "Course updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    delete:
      operationId: deleteCourse
      summary: "Soft-delete a course"
      tags: [Courses]
      responses:
        "204":
          description: "Course soft-deleted"

  /api/v1/courses/{course_id}/schedule:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      operationId: scheduleCourse
      summary: "Schedule a draft course (publish)"
      tags: [Courses]
      responses:
        "200":
          description: "Course scheduled — emits chora.delivery.course.scheduled.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /api/v1/courses/{course_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      operationId: cancelCourse
      summary: "Cancel a course"
      tags: [Courses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
      responses:
        "200":
          description: "Course cancelled — emits chora.delivery.course.cancelled.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /api/v1/courses/{course_id}/complete:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      operationId: completeCourse
      summary: "Mark a course as completed"
      tags: [Courses]
      responses:
        "200":
          description: "Course completed — emits chora.delivery.course.completed.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  # -----------------------------------------------------------------
  # Bookings
  # -----------------------------------------------------------------

  /api/v1/bookings:
    get:
      operationId: listBookings
      summary: "List bookings"
      description: |
        Returns the caller's tenant bookings as a BookingList ({items,total}).
        DEPLOYED at `GET /api/bookings` (the live chora-delivery handler mount,
        gateway-gated + RLS-isolated since 2026-06-01 — HANDOFF_RPLUS §6); the
        `/api/v1/bookings` path in this block is the post-gateway-rationalization
        target. The optional course_id/learner_gcid query filters below are not
        yet wired server-side (tenant-scoped list only) — TODO before v1 cutover.
      tags: [Bookings]
      parameters:
        - in: query
          name: course_id
          schema: { type: string, format: uuid }
        - in: query
          name: learner_gcid
          schema: { type: string }
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: "Bookings returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingList"
    post:
      operationId: createBooking
      summary: "Create a booking (PENDING)"
      tags: [Bookings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: "Booking created — emits chora.delivery.booking.created.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /api/v1/bookings/{booking_id}:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    get:
      operationId: getBooking
      summary: "Get a booking"
      tags: [Bookings]
      responses:
        "200":
          description: "Booking returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    delete:
      operationId: deleteBooking
      summary: "Soft-delete a booking"
      tags: [Bookings]
      responses:
        "204":
          description: "Booking soft-deleted"

  /api/v1/bookings/{booking_id}/confirm:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      operationId: confirmBooking
      summary: "Confirm a booking"
      tags: [Bookings]
      responses:
        "200":
          description: "Booking confirmed — emits chora.delivery.booking.confirmed.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /api/v1/bookings/{booking_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      operationId: cancelBooking
      summary: "Cancel a booking"
      tags: [Bookings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
      responses:
        "200":
          description: "Booking cancelled — emits chora.delivery.booking.cancelled.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  # -----------------------------------------------------------------
  # Rosters
  # -----------------------------------------------------------------

  /api/v1/offerings/{id}/roster/bulk:
    post:
      operationId: bulkEnrollOfferingRoster
      summary: "Atomically enrol many learners into an offering's attached course"
      description: |
        All-or-nothing batch enrol. Inserts every course_enrollments row AND
        writes every chora.delivery.enrollment.created.v1 event inside ONE
        transaction (true transactional outbox); a mid-batch failure rolls the
        whole batch back and emits no partial event. Idempotent: already-active
        learners are skipped (not re-counted, not re-emitted); duplicate gcids in
        the batch are de-duplicated. Capacity is checked against the count of NEW
        learners only. Auth mirrors the offering roster surface (X-Tenant-Id +
        gcid + x-mesh-user-roles: instructor / admin / training-admin).
      tags: [Rosters]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkEnrollRosterRequest" }
      responses:
        "201":
          description: "Batch enrolled — emits chora.delivery.enrollment.created.v1 per new learner"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkEnrollRosterResult" }
        "400": { description: "course_id not attached to the offering, empty/blank gcids, or invalid JSON" }
        "403": { description: "Caller lacks instructor/admin/training-admin role" }
        "404": { description: "Offering not found (or cross-tenant / soft-deleted)" }
        "409": { description: "The batch of NEW enrolments would exceed the offering capacity" }

  /api/v1/rosters/{course_id}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      operationId: getRoster
      summary: "Get the roster for a course"
      tags: [Rosters]
      responses:
        "200":
          description: "Roster returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roster"
    post:
      operationId: addRosterEntry
      summary: "Add a learner to the roster"
      tags: [Rosters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddRosterEntryRequest"
      responses:
        "201":
          description: "Learner added — emits chora.delivery.rostering.learner_rostered.v1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roster"
    patch:
      operationId: updateRoster
      summary: "Bulk-update / finalize the roster"
      tags: [Rosters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRosterRequest"
      responses:
        "200":
          description: "Roster updated — emits chora.delivery.rostering.finalized.v1 if finalized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roster"

  # -----------------------------------------------------------------
  # Certifications
  # -----------------------------------------------------------------

  /api/v1/certifications:
    get:
      operationId: listCertifications
      summary: "List certifications"
      tags: [Certifications]
      parameters:
        - in: query
          name: learner_gcid
