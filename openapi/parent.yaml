openapi: 3.0.3
info:
  title: chora-parent — Parent Engagement API
  version: 0.1.0
  description: |
    REST API for the Parent Engagement supporting domain (CHO-20).
    Owns parent <-> child linking with two-step consent, per-action
    consent requests (30-day TTL), parent-gated child progress visibility,
    and parent notification subscriptions.

    Auth: X-Chora-GCID header (placeholder for Identity Platform JWT).
    Tenancy: X-Chora-Tenant-ID header.

servers:
  - url: https://chora-parent.chora-489812.run.app
    description: Cloud Run (chora-489812 platform host)

tags:
  - name: parent-links
  - name: consent-requests
  - name: progress
  - name: health

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: alive

  /parent-links:
    post:
      tags: [parent-links]
      summary: Create a parent link (initiator's perspective)
      description: |
        Caller's `X-Chora-GCID` becomes the initiator. Caller declares
        their role ("parent" or "child"); the counterparty GCID is the
        other party. Two-step consent — link starts in `pending` and
        must be confirmed by the counterparty.
      parameters:
        - { in: header, name: X-Chora-GCID, required: true, schema: { type: string } }
        - { in: header, name: X-Chora-Tenant-ID, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counterparty_gcid, role]
              properties:
                counterparty_gcid: { type: string, format: uuid }
                role: { type: string, enum: [parent, child] }
      responses:
        "201":
          description: link created (status=pending)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: an active link already exists between these parties

  /parent-links/{linkId}/confirm:
    post:
      tags: [parent-links]
      summary: Confirm a pending parent link (counterparty step)
      description: Caller's GCID must be the counterparty (non-initiator).
      parameters:
        - { in: path, name: linkId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Chora-GCID, required: true, schema: { type: string } }
      responses:
        "200":
          description: link confirmed (status=linked)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParentLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: caller is not the counterparty, or link is not pending }
        "404": { description: link not found }

  /me/parent-links:
    get:
      tags: [parent-links]
      summary: List the current user's parent links (parent + child sides)
      parameters:
        - { in: header, name: X-Chora-GCID, required: true, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ParentLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /children/{childGcid}/progress:
    get:
      tags: [progress]
      summary: Get child progress snapshot (parent-gated)
      description: |
        Returns 403 unless the caller has an active LINKED relationship
        with the requested child in the supplied tenant context.
      parameters:
        - { in: path, name: childGcid, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Chora-GCID, required: true, schema: { type: string } }
        - { in: header, name: X-Chora-Tenant-ID, required: true, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: caller is not a linked parent of the requested child }

  /consent-requests:
    post:
      tags: [consent-requests]
      summary: Child raises a consent request for parent approval
      description: |
        Caller must be the child party of an active linked relationship.
        Request enters PENDING status with a 30-day TTL.
      parameters:
        - { in: header, name: X-Chora-GCID, required: true, schema: { type: string } }
        - { in: header, name: X-Chora-Tenant-ID, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link_id, action]
              properties:
                link_id: { type: string, format: uuid }
                action:
                  type: string
                  enum:
                    - star_credit_redemption
                    - public_course_enroll
                    - social_post
                    - duel_entry
                context:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: caller is not the child party of an active linked relationship }
        "404": { description: link not found }

  /me/consent-requests:
    get:
      tags: [consent-requests]
      summary: List the current parent's consent requests, filterable by status
      parameters:
        - { in: header, name: X-Chora-GCID, required: true, schema: { type: string } }
        - in: query
          name: status
          schema: { type: string, enum: [pending, granted, denied, expired] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConsentRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /consent-requests/{requestId}/decision:
    patch:
      tags: [consent-requests]
      summary: Parent grants or denies a consent request
      description: Caller must be the parent party of the request. Terminal status — cannot be flipped.
      parameters:
        - { in: path, name: requestId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Chora-GCID, required: true, schema: { type: string } }
        - { in: header, name: X-Chora-Tenant-ID, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [granted, denied] }
                note: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: caller is not the parent, or request is in terminal status }
        "404": { description: request not found }

components:
  schemas:
    ParentLink:
      type: object
      properties:
        link_id: { type: string, format: uuid }
        parent_gcid: { type: string, format: uuid }
        child_gcid: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, linked, revoked] }
        initiated_by: { type: string, enum: [parent, child] }
        created_at: { type: string, format: date-time }
        linked_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        revoked_by: { type: string, nullable: true }
        revoke_reason: { type: string, nullable: true }
    ConsentRequest:
      type: object
      properties:
        request_id: { type: string, format: uuid }
        link_id: { type: string, format: uuid }
        parent_gcid: { type: string, format: uuid }
        child_gcid: { type: string, format: uuid }
        action:
          type: string
          enum:
            - star_credit_redemption
            - public_course_enroll
            - social_post
            - duel_entry
        context:
          type: object
          additionalProperties: { type: string }
        status: { type: string, enum: [pending, granted, denied, expired] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        decision_at: { type: string, format: date-time, nullable: true }
        decision_note: { type: string, nullable: true }
    ProgressSnapshot:
      type: object
      properties:
        child_gcid: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        atoms_completed: { type: integer }
        current_streak: { type: integer }
        longest_streak: { type: integer }
        last_activity_at: { type: string, format: date-time, nullable: true }
        certifications:
          type: array
          items:
            type: object
            properties:
              certification_id: { type: string }
              title: { type: string }
              issued_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

  responses:
    BadRequest:
      description: bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: missing or invalid auth
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
