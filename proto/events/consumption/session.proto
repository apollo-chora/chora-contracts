// =============================================================================
// Chora Content Consumption — AtomicSession events
// =============================================================================
//
// Aggregate root: AtomicSession (one learner × one atom × one playback).
// Owning domain : Content Consumption (chora_consumption DB).
// Topic prefix  : chora.consumption.session.*
//
// AtomicSession is the per-attempt unit shared by both Straight-Up and
// Graph-Discovery modes. Each session may emit multiple AtomInteractionRecorded
// events (one per learner interaction with the atom) plus a single
// AnswerValidated when the answer is graded.
//
// Cross-domain references: atom_id / atom_revision_id are UUIDs sourced from
// chora_creation. NO FK constraints across DBs — validate via locally cached
// AtomProjection (populated by chora.creation.atom.published.v1 subscription).
// =============================================================================

syntax = "proto3";

package chora.consumption.v1;

option go_package = "github.com/apollo-chora/chora-contracts/gen/go/chora/consumption/v1;consumptionv1";

import "google/protobuf/timestamp.proto";
import "chora/common/v1/envelope.proto";

// ValidationRuleType — how the learner's answer was validated.
// Mirrors AnswerValidationRule kinds in chora_creation; surfaces here for
// downstream consumers (Sharing XP, Observability, Notifications).
enum ValidationRuleType {
  VALIDATION_RULE_TYPE_UNSPECIFIED = 0;
  VALIDATION_RULE_TYPE_EXACT_MATCH = 1;
  VALIDATION_RULE_TYPE_REGEX = 2;
  VALIDATION_RULE_TYPE_RANGE = 3;
  VALIDATION_RULE_TYPE_KEYWORD = 4;
  VALIDATION_RULE_TYPE_MANUAL = 5;     // Instructor manual grading
  VALIDATION_RULE_TYPE_LLM_GRADED = 6; // AI-assisted grading
}

// SessionStarted — emitted when a learner opens an atom for playback.
//
// Topic: chora.consumption.session.started.v1
// Consumers: Sharing (presence), Observability (engagement funnel),
//            AI Kernel (Companion persona context warm-up).
message SessionStarted {
  chora.common.v1.EventEnvelope envelope = 1;

  // AtomicSession aggregate root ID (UUIDv7).
  string session_id = 2;

  string learner_gcid = 3;

  // Atom + revision being played (cross-domain UUIDs from chora_creation).
  string atom_id = 4;
  string atom_revision_id = 5;

  // Optional path context — null/empty if free-play discovery.
  string path_id = 6;

  google.protobuf.Timestamp started_at = 7;
}

// SessionCompleted — emitted when a session ends with a final outcome.
//
// Topic: chora.consumption.session.completed.v1
// Consumers: Sharing (XP award via outbox), Delivery (cert progress),
//            Notifications, Observability.
message SessionCompleted {
  chora.common.v1.EventEnvelope envelope = 1;

  string session_id = 2;
  string learner_gcid = 3;
  string atom_id = 4;
  string atom_revision_id = 5;

  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp completed_at = 7;

  // Score in [0.0, 1.0]. For binary-correct atoms: 0.0 or 1.0.
  float score = 8;

  // Total active duration of the session in milliseconds.
  int64 duration_ms = 9;

  // Whether the answer was correct (convenience for downstream XP rules).
  bool answer_correct = 10;

  // Which rule produced the score.
  ValidationRuleType validation_rule_type = 11;

  // Optional path context.
  string path_id = 12;
}

// SessionAbandoned — emitted when a learner exits without completing.
//
// Topic: chora.consumption.session.abandoned.v1
// Consumers: Notifications (re-engagement), Observability (drop-off metrics).
message SessionAbandoned {
  chora.common.v1.EventEnvelope envelope = 1;

  string session_id = 2;
  string learner_gcid = 3;
  string atom_id = 4;
  string atom_revision_id = 5;

  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp abandoned_at = 7;

  // Active time before abandonment.
  int64 duration_ms = 8;

  // Optional path context.
  string path_id = 9;
}

// AtomInteractionRecorded — emitted for each discrete interaction within a
// session (e.g., option selected, hint requested, draft submitted).
//
// Topic: chora.consumption.session.atom_interaction_recorded.v1
// Consumers: AI Kernel (RAG memory enrichment),
//            Observability (interaction-level analytics).
message AtomInteractionRecorded {
  chora.common.v1.EventEnvelope envelope = 1;

  // Interaction ID (UUIDv7) — child of AtomicSession aggregate.
  string interaction_id = 2;

  string session_id = 3;
  string atom_id = 4;

  // Free-form learner response payload — typed per atom_type at the
  // application layer. Held as a string here for v1; richer typing deferred
  // to v2 once atom_type taxonomy stabilises.
  string response = 5;

  // Time spent on this single interaction.
  int64 time_spent_ms = 6;

  google.protobuf.Timestamp occurred_at = 7;
}

// AnswerValidated — emitted when a learner's submitted answer has been
// validated against the atom's answer rule.
//
// Topic: chora.consumption.session.answer_validated.v1
// Consumers: Sharing (XP / streak / combo), Notifications, Observability.
message AnswerValidated {
  chora.common.v1.EventEnvelope envelope = 1;

  string session_id = 2;
  string learner_gcid = 3;
  string atom_id = 4;
  string atom_revision_id = 5;

  // True iff the answer was deemed correct.
  bool answer_correct = 6;

  // Numeric score in [0.0, 1.0] (partial credit possible).
  float score = 7;

  ValidationRuleType validation_rule_type = 8;

  // Optional grader confidence for LLM-graded answers (0.0–1.0).
  float confidence = 9;

  google.protobuf.Timestamp validated_at = 10;
}
