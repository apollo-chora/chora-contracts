// =============================================================================
// chora.identity.v1 — TenantMembership events
// =============================================================================
//
// Source-of-truth: .claude/rules/ddd-enforcement.md
// + memory project_chora_data_plane.md
//
// Owning domain : Identity (chora_identity database)
// Owning team   : Team 3 (Platform)
// Topic prefix  : chora.identity.tenancy_membership.*
//
// TenantMembership records the GCID-Tenant link with role(s). AGIDs CANNOT
// hold TenantMembership (per ddd-enforcement aggregate invariant #10).
//
// Tenancy admin events (Tenant CRUD, addons, subscriptions, billing) live
// in the Tenancy + Billing supporting domain (chora.tenancy.*); this proto
// only covers the GCID <-> Tenant relationship which Identity owns.
//
// EVERY event message embeds chora.common.v1.EventEnvelope as field 1.
// =============================================================================

syntax = "proto3";

package chora.identity.v1;

option go_package = "github.com/locoroco-git/Chora-LMS/chora-contracts/gen/go/chora/identity/v1;identityv1";

import "google/protobuf/timestamp.proto";
import "chora/common/v1/envelope.proto";

// -----------------------------------------------------------------------------
// TenantMembershipRole — roles a GCID may hold within a tenant.
// -----------------------------------------------------------------------------
//
// A single GCID may hold MULTIPLE memberships (one per tenant) and a single
// membership may carry MULTIPLE roles. Three-Audience Explainability
// (Learner / Instructor-Admin / Auditor) is driven by these roles.
enum TenantMembershipRole {
  TENANT_MEMBERSHIP_ROLE_UNSPECIFIED = 0;
  TENANT_MEMBERSHIP_ROLE_LEARNER = 1;          // Default end-user role
  TENANT_MEMBERSHIP_ROLE_INSTRUCTOR = 2;        // Author + classroom delivery
  TENANT_MEMBERSHIP_ROLE_ADMIN = 3;             // Tenant administration (H+ Hub+)
  TENANT_MEMBERSHIP_ROLE_AUDITOR = 4;           // Read-only governance + audit (O+ Observability+)
  TENANT_MEMBERSHIP_ROLE_OWNER = 5;             // Tenant owner (billing + legal)
  TENANT_MEMBERSHIP_ROLE_SUPPORT_AGENT = 6;     // Support staff (limited admin scope)
}

// -----------------------------------------------------------------------------
// TenantMembershipGranted — chora.identity.tenancy_membership.granted.v1
// -----------------------------------------------------------------------------
//
// Published when a GCID is granted membership in a tenant with one or more
// roles. Consumers: Notifications (welcome to tenant), Tenancy
// (entitlement resolution), all role-gated UIs across the 5 surfaces.
message TenantMembershipGranted {
  chora.common.v1.EventEnvelope envelope = 1;

  // UUIDv7 — TenantMembership aggregate root identifier.
  string membership_id = 2;

  // GCID receiving the membership (UUIDv7, cross-tenant portable).
  string gcid = 3;

  // Tenant scope of this membership (UUIDv7).
  string tenant_id = 4;

  // Roles granted in this membership. At least one required.
  repeated TenantMembershipRole roles = 5;

  // GCID of the admin / owner who issued the grant.
  string granted_by_gcid = 6;

  google.protobuf.Timestamp granted_at = 7;
}

// -----------------------------------------------------------------------------
// TenantMembershipRevoked — chora.identity.tenancy_membership.revoked.v1
// -----------------------------------------------------------------------------
//
// Published when a TenantMembership is soft-deleted. The GCID retains its
// cross-tenant identity but loses entitlements within this specific tenant.
// Historical activity (sessions, posts, certifications) remains attributable.
message TenantMembershipRevoked {
  chora.common.v1.EventEnvelope envelope = 1;

  string membership_id = 2;
  string gcid = 3;
  string tenant_id = 4;

  // Roles that WERE held (snapshot at revocation time, for audit clarity).
  repeated TenantMembershipRole prior_roles = 5;

  // GCID of the actor revoking (admin / owner / self-departure).
  string revoked_by_gcid = 6;

  // Free-text reason (e.g., "voluntary_departure", "admin_offboard",
  // "policy_violation"). Max 512 chars.
  string reason = 7;

  google.protobuf.Timestamp revoked_at = 8;
}
