// =============================================================================
// chora.identity.v1 — Tenant IdP Provider configuration events
// =============================================================================
//
// Source-of-truth: Setup Wizard Phase C tenant identity-provider domain
// (CHO-1682) + .claude/rules/ddd-enforcement.md (Identity aggregate).
//
// Owning domain  : Identity (chora_identity database)
// Owning team    : Team 3 (Platform)
// Topic prefix   : chora.identity.tenant_idp_provider.*
// Surface (admin): H+ Hub+ (Surface-5) — tenant admin / IdP setup wizard
//
// A TenantIdpProvider records which external identity provider (OIDC / SAML /
// Singpass) a tenant has wired for its members' federated sign-in. The
// configured event is emitted when a tenant admin completes IdP setup so
// downstream domains (Observability onboarding funnel, Governance access
// audit) can react. This is Identity-owned config — distinct from the
// per-GCID gcid.* lifecycle events.
//
// EVERY event message embeds chora.common.v1.EventEnvelope as field 1.
// =============================================================================

syntax = "proto3";

package chora.identity.v1;

option go_package = "github.com/apollo-chora/chora-contracts/gen/go/chora/identity/v1;identityv1";

import "chora/common/v1/envelope.proto";

// -----------------------------------------------------------------------------
// TenantIdpProviderConfigured
// Topic: chora.identity.tenant_idp_provider.configured.v1
// -----------------------------------------------------------------------------
//
// Published when a tenant admin configures (or reconfigures) an identity
// provider for the tenant via the H+ Setup Wizard Phase C.
//
// Producer: services/chora-identity/internal/adapter/tenant_idp_provider_events/publisher.go.
// Class D contract paydown (event-fabric audit 2026-07-01): the code emitted
// to this topic before any proto / schema / topic existed.
message TenantIdpProviderConfigured {
  chora.common.v1.EventEnvelope envelope = 1;

  // Domain event-type discriminator (e.g. "configured"). Carried in the
  // payload so a single subscriber can branch on lifecycle transitions if
  // this aggregate later emits more than one event_type on this topic.
  string event_type = 2;

  // Stable IdP configuration identifier (UUIDv7). Survives reconfiguration so
  // consumers can correlate updates to the same logical provider row.
  string idp_id = 3;

  // Tenant the IdP is configured for. The envelope.tenant_id carries the
  // authoritative scope; this mirrors it into the payload for convenience.
  string tenant_id = 4;

  // Kind of IdP configured: "oidc" | "saml" | "singpass" (domain
  // ProviderType). Left as a string — the producer sends the domain value
  // verbatim and the closed set is validated producer-side (IsKnown).
  string provider_type = 5;

  // GCID of the tenant admin who performed the configuration. Optional —
  // empty for system / migration-driven configuration.
  string actor_gcid = 6;
}
