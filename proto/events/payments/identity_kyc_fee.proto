// =============================================================================
// Chora Payments — Identity KYC Fee events (Stripe-driven)
// =============================================================================
//
// Aggregate root: IdentityKycFee (1:1 with a Stripe Checkout session for the
//                 one-time KYC manual-doc verification fee per ADR-142:
//                 Singpass-verified GCID is FREE; manual-doc KYC is $9.99).
// Owning domain : Payments (chora_payments DB, per ADR-164).
// Topic prefix  : chora.payments.identity_kyc_fee.*
//
// Closes Stage E debt: chora-identity used to charge the $9.99 manual KYC
// fee inline (direct Stripe-go import on chora-identity's HTTP handler).
// Stage A.5 extracts that charge to chora-payments as a 7th aggregate.
//
// Lifecycle: one-time charge with the canonical 5 payment-phase states only.
// No additional FSM beyond shared.State.
//
// Originating-service notification path: chora-identity subscribes to
// `chora.payments.identity_kyc_fee.payment_captured.v1` and marks the
// KYC verification as paid (its existing logic completes the manual-review
// pipeline on its side once the fee clears).
// =============================================================================

syntax = "proto3";

package chora.payments.v1;

option go_package = "github.com/apollo-chora/chora-contracts/gen/go/chora/payments/v1;paymentsv1";

import "google/protobuf/timestamp.proto";
import "chora/common/v1/envelope.proto";

// IdentityKycFeeCheckoutStarted — emitted when chora-payments creates a
// Stripe Checkout Session for the one-time manual-doc KYC fee.
//
// Topic: chora.payments.identity_kyc_fee.checkout_started.v1
// Consumers: chora-observability, chora-governance.
message IdentityKycFeeCheckoutStarted {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;

  // The learner whose identity is being verified.
  string learner_gcid = 3;

  // Type of KYC doc being verified (e.g., "manual_id_doc",
  // "manual_passport", "manual_proof_of_address"). Snapshot at Session
  // creation so chora-identity can branch the verification pipeline.
  string kyc_doc_type = 4;

  string stripe_session_id = 5;
  string stripe_checkout_url = 6;

  int64  amount_cents = 7;
  string currency = 8;

  google.protobuf.Timestamp checkout_started_at = 9;
}

// IdentityKycFeePaymentCaptured — emitted on Stripe's
// `checkout.session.completed`. chora-identity subscribes + marks the
// KYC manual-review pipeline as paid (existing logic completes the
// verification on its side once this fires).
//
// Topic: chora.payments.identity_kyc_fee.payment_captured.v1
// Consumers: chora-identity (PRIMARY — unlocks the manual-review queue
//            for this learner), chora-observability (revenue ledger),
//            chora-notifications (receipt email), chora-governance.
message IdentityKycFeePaymentCaptured {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string learner_gcid = 3;
  string kyc_doc_type = 4;

  string stripe_session_id = 5;
  string stripe_payment_intent_id = 6;
  string stripe_charge_id = 7;

  int64  amount_cents_paid = 8;
  int64  amount_cents_refunded = 9;
  string currency = 10;

  google.protobuf.Timestamp paid_at = 11;
}

// IdentityKycFeePaymentFailed — emitted on Stripe payment failure.
//
// Topic: chora.payments.identity_kyc_fee.payment_failed.v1
// Consumers: chora-identity (closes the in-progress KYC charge),
//            chora-notifications (learner failure email), chora-governance.
message IdentityKycFeePaymentFailed {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string learner_gcid = 3;
  string kyc_doc_type = 4;

  string stripe_session_id = 5;
  string stripe_failure_code = 6;
  string stripe_failure_message = 7;

  google.protobuf.Timestamp failed_at = 8;
}

// IdentityKycFeeRefunded — emitted on Stripe refund (rare — refunds for
// KYC fees are typically duplicate-charge corrections).
//
// Topic: chora.payments.identity_kyc_fee.refunded.v1
// Consumers: chora-identity (revokes KYC paid-state if applicable),
//            chora-notifications, chora-observability.
message IdentityKycFeeRefunded {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string learner_gcid = 3;
  string kyc_doc_type = 4;

  string stripe_charge_id = 5;
  string stripe_refund_id = 6;

  int64  amount_cents_refunded = 7;
  string currency = 8;

  string reason = 9;

  google.protobuf.Timestamp refunded_at = 10;
}

// IdentityKycFeeExpired — emitted on Stripe `checkout.session.expired`
// (learner abandoned the Checkout flow past Stripe's 24h window).
//
// Topic: chora.payments.identity_kyc_fee.expired.v1
// Consumers: chora-observability, chora-governance.
message IdentityKycFeeExpired {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string learner_gcid = 3;
  string kyc_doc_type = 4;

  string stripe_session_id = 5;

  google.protobuf.Timestamp expired_at = 6;
}
