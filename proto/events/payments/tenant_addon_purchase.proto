// =============================================================================
// Chora Payments — Tenant Addon Purchase events (Stripe-driven, H+ Marketplace)
// =============================================================================
//
// Aggregate root: TenantAddonPurchase (1:1 with a Stripe Checkout session
//                 for a H+ Marketplace tenant-add-on subscription —
//                 CHO-1736 epic; reads from the catalog shipped in
//                 CHO-1735).
// Owning domain : Payments (chora_payments DB, per ADR-164).
// Topic prefix  : chora.payments.tenant_addon_purchase.*
//
// These events describe the BILLING + PURCHASE lifecycle of a tenant
// add-on subscription. The corresponding chora-tenancy materialisation
// (`AddonSubscription` aggregate flip to ACTIVE) is emitted AFTER
// chora-tenancy subscribes to
// `chora.payments.tenant_addon_purchase.payment_captured.v1` and writes
// the `tenant_entitlements` row.
//
// chora-payments creates the Stripe Checkout Session via the canonical
// `stripe-go v78` SDK (mode=`payment` — one-shot; tenancy holds the
// billing-cycle clock + auto-renew per ADR-142 sibling pattern);
// chora-tenancy is Stripe-agnostic post-ADR-164.
// =============================================================================

syntax = "proto3";

package chora.payments.v1;

option go_package = "github.com/apollo-chora/chora-contracts/gen/go/chora/payments/v1;paymentsv1";

import "google/protobuf/timestamp.proto";
import "chora/common/v1/envelope.proto";

// TenantAddonPurchaseCheckoutStarted — emitted when chora-payments
// creates a Stripe Checkout Session for a tenant add-on subscription.
// The tenant admin has NOT yet paid; the Session URL is returned
// synchronously to the FE, who redirects the browser to Stripe-hosted
// Checkout.
//
// Topic: chora.payments.tenant_addon_purchase.checkout_started.v1
// Consumers: chora-observability (funnel telemetry, revenue-pipeline
//            in-flight count), chora-governance (audit trail for
//            IMDA D1 accountability).
message TenantAddonPurchaseCheckoutStarted {
  chora.common.v1.EventEnvelope envelope = 1;

  // TenantAddonPurchase aggregate id (UUIDv7) — same id flows through
  // every subsequent event in this lifecycle.
  string purchase_id = 2;

  // Tenant admin who initiated checkout. Resolved by chora-gateway from
  // the ChoraSession JWT + passed to chora-payments via the gRPC
  // `CreateTenantAddonCheckoutSession` call.
  string admin_gcid = 3;

  // AddOnPlan being subscribed to. Soft FK to chora_tenancy.addon_plans;
  // recipient (tenancy subscriber) resolves via Pub/Sub event subscription
  // (cross-DB queries forbidden).
  string addon_plan_id = 4;

  // Denormalised addon code (e.g., "knowledge_graph", "companion") — kept
  // alongside addon_plan_id so downstream consumers can index without a
  // tenancy lookup.
  string addon_code = 5;

  // Selected pricing tier (e.g., "starter", "pro").
  string tier_code = 6;

  // Stripe correlation handles.
  string stripe_session_id = 7;
  string stripe_checkout_url = 8;

  // Pricing snapshot (captured at Session creation; Stripe price index).
  int64  amount_cents = 9;
  string currency = 10;            // ISO 4217 — "SGD" for the Phyllis demo

  google.protobuf.Timestamp checkout_started_at = 11;
}

// TenantAddonPurchasePaymentCaptured — emitted on Stripe's
// `checkout.session.completed` webhook. chora-tenancy subscribes + flips
// the `AddonSubscription` aggregate to ACTIVE idempotently, then emits
// `chora.tenancy.tenant_addon.activated.v1`.
//
// Topic: chora.payments.tenant_addon_purchase.payment_captured.v1
// Consumers: chora-tenancy (PRIMARY — activates the entitlement),
//            chora-observability (revenue ledger), chora-notifications
//            (receipt email to admin), chora-governance (IMDA D1
//            evidence).
message TenantAddonPurchasePaymentCaptured {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string admin_gcid = 3;
  string addon_plan_id = 4;
  string addon_code = 5;
  string tier_code = 6;

  string stripe_session_id = 7;
  string stripe_payment_intent_id = 8;
  string stripe_charge_id = 9;

  int64  amount_cents_paid = 10;
  int64  amount_cents_refunded = 11;  // 0 unless partial refund post-capture
  string currency = 12;

  google.protobuf.Timestamp paid_at = 13;
}

// TenantAddonPurchasePaymentFailed — emitted when Stripe reports a
// payment failure (`payment_intent.payment_failed` OR
// `checkout.session.async_payment_failed` for offline methods). Cleanup
// signal — chora-tenancy does NOT activate the entitlement for this
// purchase.
//
// Topic: chora.payments.tenant_addon_purchase.payment_failed.v1
// Consumers: chora-tenancy (closes the in-progress checkout intent),
//            chora-notifications (failure email), chora-governance.
message TenantAddonPurchasePaymentFailed {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string admin_gcid = 3;
  string addon_plan_id = 4;

  string stripe_session_id = 5;
  string stripe_failure_code = 6;     // Stripe-defined reason
  string stripe_failure_message = 7;  // human-readable

  google.protobuf.Timestamp failed_at = 8;
}

// TenantAddonPurchaseRefunded — emitted on a Stripe `charge.refunded`
// event (full or partial). Triggered by:
//   - support-initiated refund
//   - admin-requested refund (per tenant refund policy)
//   - duplicate-charge correction
//   - fraud chargeback
//
// Topic: chora.payments.tenant_addon_purchase.refunded.v1
// Consumers: chora-tenancy (deactivates the entitlement — reuses the
//            CHO-1731 deactivation flow + emits a corresponding
//            `chora.tenancy.tenant_addon.deactivated.v1`),
//            chora-notifications (refund-confirmation email),
//            chora-observability, chora-governance.
message TenantAddonPurchaseRefunded {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string admin_gcid = 3;
  string addon_plan_id = 4;

  string stripe_charge_id = 5;
  string stripe_refund_id = 6;

  int64  amount_cents_refunded = 7;
  string currency = 8;

  // Refund reason. One of:
  //   support_initiated | admin_request | duplicate_charge | fraud
  string reason = 9;

  google.protobuf.Timestamp refunded_at = 10;
}

// TenantAddonPurchaseExpired — emitted when Stripe reports
// `checkout.session.expired` (Checkout Session abandoned past Stripe's
// 24-hour window without payment) OR when the chora-payments expiry
// sweeper marks a stuck `checkout_started` row as expired.
//
// Topic: chora.payments.tenant_addon_purchase.expired.v1
// Consumers: chora-observability (funnel abandonment), chora-governance
//            (audit close).
message TenantAddonPurchaseExpired {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string admin_gcid = 3;
  string addon_plan_id = 4;

  string stripe_session_id = 5;

  google.protobuf.Timestamp expired_at = 6;
}

// =============================================================================
// CHO-1775 — Stripe Subscription lifecycle events (Phase 2 of CHO-1771).
//
// Phase 1 (CHO-1771) added the 4 dispatcher handlers driving the local
// TAP row's sub_status through the full Stripe lifecycle (state-only).
// Phase 2 adds these 3 events so chora-tenancy can stay in sync with
// the lifecycle out-of-band (Stripe Dashboard cancel + dunning + recovery).
// =============================================================================

// TenantAddonPurchaseSubscriptionCancelled — emitted from
// `customer.subscription.deleted`. Distinct from the legacy
// `chora.payments.user_subscription.cancelled.v1` (mana-side); this is
// the H+ Marketplace tenant-addon subscription path.
//
// Topic: chora.payments.tenant_addon_purchase.cancelled.v1
// Consumers: chora-tenancy (deactivates the AddOn via the CHO-1731 flow),
//            chora-observability (churn ledger), chora-governance.
message TenantAddonPurchaseSubscriptionCancelled {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string admin_gcid = 3;
  string addon_plan_id = 4;
  string addon_code = 5;
  string tier_code = 6;

  string stripe_subscription_id = 7;
  string stripe_customer_id = 8;

  google.protobuf.Timestamp cancelled_at = 9;
}

// TenantAddonPurchaseSubscriptionPaymentFailed — emitted from
// `invoice.payment_failed` on a recurring subscription invoice. Distinct
// from TenantAddonPurchasePaymentFailed (one-shot mode=payment failures
// during the initial Checkout, no invoice context).
//
// Topic: chora.payments.tenant_addon_purchase.subscription_payment_failed.v1
// Consumers: chora-tenancy (registry past_due flag, deferred to a sibling
//            FE PR), chora-notifications (dunning email), chora-observability.
//
// **v1 minimal payload** — fields are limited to identity + subscription
// correlation that the TAP aggregate naturally carries. Phase 2b will
// extend the aggregate to hold stripe_invoice_id / attempt_count /
// next_payment_attempt_at so the dunning email can reference them.
message TenantAddonPurchaseSubscriptionPaymentFailed {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string admin_gcid = 3;
  string addon_plan_id = 4;
  string addon_code = 5;
  string tier_code = 6;

  string stripe_subscription_id = 7;
  string stripe_customer_id = 8;

  string currency = 9;

  google.protobuf.Timestamp failed_at = 10;
}

// TenantAddonPurchasePaymentRecovered — emitted from
// `invoice.payment_succeeded` when the prior sub_status was past_due
// (Stripe smart-retry succeeded after a dunning cycle). Normal renewals
// (prior = active) do NOT emit this — the cycle anchor refresh comes
// via customer.subscription.updated.
//
// Topic: chora.payments.tenant_addon_purchase.payment_recovered.v1
// Consumers: chora-tenancy (clears the past_due flag), chora-notifications
//            (recovery confirmation email), chora-observability.
//
// **v1 minimal payload** — see SubscriptionPaymentFailed note above.
message TenantAddonPurchasePaymentRecovered {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string admin_gcid = 3;
  string addon_plan_id = 4;
  string addon_code = 5;
  string tier_code = 6;

  string stripe_subscription_id = 7;
  string stripe_customer_id = 8;

  string currency = 9;

  google.protobuf.Timestamp recovered_at = 10;
}

// =============================================================================
// CHO-1779 — Stripe SubscriptionSchedule release event (PR #91 follow-up).
//
// Closes the cross-domain propagation gap left by CHO-1772 PR #91:
// chora-payments' dispatcher promotes ScheduledTierCode → TierCode on
// the local TAP row when Stripe fires subscription_schedule.released at
// cycle anchor, but the chora-tenancy registry's CurrentTier never
// updates until restart. This event lets the tenancy subscriber call
// SubscriptionRegistry.PromoteScheduledTier so /h/addons stays in sync.
// =============================================================================

// TenantAddonPurchaseSubscriptionScheduleReleased — emitted from
// `subscription_schedule.released`. The schedule's second phase
// activated; Stripe drops the schedule + the underlying Subscription
// continues at the new Price. tier_code on the row IS ALREADY promoted
// (the dispatcher calls TenantAddonPurchase.ReleaseSchedule before
// emitting), so `to_tier` here is the post-release current tier.
//
// **v1 minimal payload** — schedule_id + scheduled_effective_at are
// NOT carried because ReleaseSchedule clears them on the aggregate
// before the (async) outbox marshaller runs. from_tier is also not
// carried because the consumer (chora-tenancy) derives it from its
// own registry's CurrentTier when calling PromoteScheduledTier. If
// observability needs schedule_id correlation, capture from the Stripe
// event log via the envelope's traceparent.
//
// Topic: chora.payments.tenant_addon_purchase.subscription_schedule_released.v1
// Consumers: chora-tenancy (PromoteScheduledTier on the in-memory
//            registry + emit upgraded.v1 / downgraded.v1),
//            chora-observability (tier-change ledger).
message TenantAddonPurchaseSubscriptionScheduleReleased {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string admin_gcid = 3;
  string addon_plan_id = 4;
  string addon_code = 5;
  // Tier the row holds AFTER the schedule released (what was previously
  // ScheduledTierCode + is now the active TierCode on the row).
  string to_tier = 6;

  string stripe_subscription_id = 7;

  google.protobuf.Timestamp released_at = 8;
}
