// =============================================================================
// Chora Payments — Tenant Mana Pool Top-Up events (Stripe-driven)
// =============================================================================
//
// Aggregate root: TenantManaTopUp (1:1 with a Stripe Checkout session for
//                 a tenant mana pool top-up purchased by a tenant_admin via
//                 H+ Setup-Tenant flow).
// Owning domain : Payments (chora_payments DB, per ADR-164).
// Topic prefix  : chora.payments.tenant_mana_topup.*
//
// Replaces (post Wave 1 Stage D cutover):
//   chora.tenancy.tenant_mana_pool.topped_up.v1 — chora-tenancy
//   billing-webhook forwarder. A legacy-bridge emit of the old topic stays
//   in chora-tenancy through the 1-release rollback window per ADR-164
//   §Stage G; the old topic is decommissioned at Stage G close.
//
// Originating-service notification path: chora-tenancy subscribes to
// `chora.payments.tenant_mana_topup.payment_captured.v1` and credits
// `tenant_mana_pool.balance_units` (existing logic) + emits the legacy
// bridge event for downstream consumers during the rollback window.
// =============================================================================

syntax = "proto3";

package chora.payments.v1;

option go_package = "github.com/locoroco-git/Chora-LMS/chora-contracts/gen/go/chora/payments/v1;paymentsv1";

import "google/protobuf/timestamp.proto";
import "chora/common/v1/envelope.proto";

// TenantManaTopUpCheckoutStarted — emitted when chora-payments creates a
// Stripe Checkout Session for a tenant mana pool top-up.
//
// Topic: chora.payments.tenant_mana_topup.checkout_started.v1
// Consumers: chora-observability, chora-governance.
message TenantManaTopUpCheckoutStarted {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;

  // tenant_admin who initiated the top-up. The tenant scope is on the
  // envelope (envelope.tenant_id == target tenant for the top-up).
  string admin_gcid = 3;

  // Mana SKU from the platform catalog (e.g.,
  // `mana.tenant_topup.standard_v1`). Determines the units credited on
  // payment capture.
  string sku = 4;

  string stripe_session_id = 5;
  string stripe_checkout_url = 6;

  int64  amount_cents = 7;
  string currency = 8;

  // Mana units to credit on payment capture (snapshot from SKU at session
  // creation time, in case the SKU's units-per-cent ratio changes).
  int64  mana_units = 9;

  google.protobuf.Timestamp checkout_started_at = 10;
}

// TenantManaTopUpPaymentCaptured — emitted on Stripe's
// `checkout.session.completed`. chora-tenancy subscribes + credits
// `tenant_mana_pool.balance_units += mana_units` + emits the legacy
// `chora.tenancy.tenant_mana_pool.topped_up.v1` for downstream consumers
// during the rollback window.
//
// Topic: chora.payments.tenant_mana_topup.payment_captured.v1
// Consumers: chora-tenancy (PRIMARY — mana credit + legacy bridge emit),
//            chora-observability (revenue ledger), chora-notifications
//            (receipt email to admin), chora-governance.
message TenantManaTopUpPaymentCaptured {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string admin_gcid = 3;
  string sku = 4;

  string stripe_session_id = 5;
  string stripe_payment_intent_id = 6;
  string stripe_charge_id = 7;

  int64  amount_cents_paid = 8;
  int64  amount_cents_refunded = 9;
  string currency = 10;

  int64  mana_units = 11;

  google.protobuf.Timestamp paid_at = 12;
}

// TenantManaTopUpPaymentFailed — emitted on Stripe payment failure.
//
// Topic: chora.payments.tenant_mana_topup.payment_failed.v1
// Consumers: chora-tenancy (closes the in-progress top-up),
//            chora-notifications (admin failure email), chora-governance.
message TenantManaTopUpPaymentFailed {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string admin_gcid = 3;
  string sku = 4;

  string stripe_session_id = 5;
  string stripe_failure_code = 6;
  string stripe_failure_message = 7;

  google.protobuf.Timestamp failed_at = 8;
}

// TenantManaTopUpRefunded — emitted on Stripe refund. Triggered by:
//   - support-initiated refund
//   - customer-requested refund (per tenant refund policy)
//   - duplicate-charge correction
//   - fraud chargeback
//
// chora-tenancy debits `tenant_mana_pool.balance_units -= mana_units`
// (or partial proportional refund) on receipt.
//
// Topic: chora.payments.tenant_mana_topup.refunded.v1
// Consumers: chora-tenancy (mana debit), chora-notifications, chora-observability.
message TenantManaTopUpRefunded {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string admin_gcid = 3;
  string sku = 4;

  string stripe_charge_id = 5;
  string stripe_refund_id = 6;

  int64  amount_cents_refunded = 7;
  string currency = 8;

  // Mana units to debit (proportional to refund amount).
  int64  mana_units_to_debit = 9;

  string reason = 10;

  google.protobuf.Timestamp refunded_at = 11;
}

// TenantManaTopUpExpired — emitted on Stripe `checkout.session.expired`
// (admin abandoned the Checkout flow past Stripe's 24h window).
//
// Topic: chora.payments.tenant_mana_topup.expired.v1
// Consumers: chora-observability, chora-governance.
message TenantManaTopUpExpired {
  chora.common.v1.EventEnvelope envelope = 1;

  string purchase_id = 2;
  string admin_gcid = 3;
  string sku = 4;

  string stripe_session_id = 5;

  google.protobuf.Timestamp expired_at = 6;
}
